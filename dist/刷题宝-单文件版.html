<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1652f0">
  <title>刷题宝</title>
  <style>
/* ========== 刷题宝 · 移动端样式 ==========
   结构：① 令牌（颜色/形状/阴影） ② 基础布局 ③ 组件
        ④ 溢出防护
   ========================================== */

/* ---------- ① 令牌：默认 = 极简蓝（日间） ---------- */
:root {
  /* 主色 */
  --primary: #1652f0;
  --primary-dark: #0e3ec2;
  --primary-soft: #eef3ff;
  --primary-glow: rgba(22, 82, 240, .25);
  --on-primary: #fff;
  --disabled-bg: #b8c4e0;

  /* 中性 */
  --bg: #f3f5f9;
  --card: #ffffff;
  --topbar-bg: #f3f5f9;
  --tabbar-bg: #ffffff;
  --text: #1a2233;
  --muted: #8a93a6;
  --line: #e6eaf2;
  --surface-2: #f7f9fc;
  --surface-3: #eef3ff;
  --key-bg: #e3e8f2;
  --exp-text: #55617a;

  /* 语义色 */
  --ok: #10b981;
  --ok-bg: #e9faf3;
  --bad: #ef4444;
  --bad-bg: #fdeeee;
  --star: #f59e0b;

  /* 题型标签 */
  --t-single: #3b82f6;
  --t-multi: #8b5cf6;
  --t-judge: #f59e0b;
  --t-fill: #10b981;

  /* 形状 / 阴影 / 玻璃 */
  --radius: 16px;
  --radius-sm: 12px;
  --grad-primary: linear-gradient(135deg, #1652f0 0%, #4b8bff 58%, #6f6cf5 100%);
  --hero-grad: linear-gradient(135deg, #1d5bf2 0%, #4b7cf8 52%, #7168f2 100%);
  --shadow-card: 0 8px 24px rgba(22, 38, 80, .08), 0 2px 6px rgba(22, 38, 80, .04);
  --shadow-soft: 0 3px 10px rgba(22, 38, 80, .06);
  --glass-bg: rgba(255, 255, 255, .78);
  --glass-line: rgba(226, 231, 241, .8);
  --toast-bg: rgba(26, 34, 51, .92);
  --toast-text: #fff;

  --tabbar-h: 64px;
}

/* 夜间 */
html.dark {
  --bg: #12151d; --card: #1c212e; --topbar-bg: #161a25; --tabbar-bg: #161a25;
  --text: #e6eaf2; --muted: #7d879e; --line: #2a3145;
  --surface-2: #232a3b; --surface-3: #1d2a4d; --key-bg: #2c344a;
  --exp-text: #a8b3c7;
  --ok-bg: #14352b; --bad-bg: #3d2029;
  --disabled-bg: #2c344a;
  --grad-primary: linear-gradient(135deg, #2f66e8 0%, #4b8bff 58%, #7d74f0 100%);
  --hero-grad: linear-gradient(135deg, #1a4fd6 0%, #3f6ae0 52%, #5c55d8 100%);
  --shadow-card: 0 8px 24px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3);
  --shadow-soft: 0 3px 10px rgba(0, 0, 0, .35);
  --glass-bg: rgba(22, 26, 37, .76);
  --glass-line: rgba(42, 49, 69, .8);
  --toast-bg: rgba(238, 242, 252, .95);
  --toast-text: #12151d;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.6;
  overscroll-behavior-y: none;
  overflow-x: hidden;              /* 兜底：任何情况都不产生横向滚动 */
  overflow-wrap: anywhere;         /* 兜底：超长英文/公式/URL 自动换行，不撑破卡片 */
}

#app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 560px; margin: 0 auto; width: 100%; }

/* ---------- ② 顶栏 / 主区 / 底部导航 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 16px; position: sticky; top: 0; z-index: 10;
  background: var(--glass-bg); border-bottom: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
}
.topbar-title {
  font-size: 17px; font-weight: 700; text-align: center; letter-spacing: .3px;
  flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar-back { background: none; border: none; font-size: 26px; color: var(--text); padding: 4px 10px; cursor: pointer; line-height: 1; }
.topbar-spacer { width: 40px; flex: 0 0 auto; }

#view { flex: 1; padding: 16px 14px calc(var(--tabbar-h) + 24px); min-width: 0; }

#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex; background: var(--glass-bg); border-top: 1px solid var(--glass-line); z-index: 20;
  box-shadow: 0 -6px 24px rgba(15, 30, 70, .06);
  -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: none; color: var(--muted); font-size: 10.5px; cursor: pointer; font-family: inherit;
  transition: color .18s;
}
.tab svg {
  width: 48px; height: 30px; padding: 3px 12px; border-radius: 12px;
  stroke-width: 2;
  transition: background .18s, transform .18s, stroke-width .18s;
}
.tab.on { color: var(--primary); font-weight: 700; }
.tab.on svg { background: var(--surface-3); transform: translateY(-2px) scale(1.05); stroke-width: 2.3; }
.tab.on span { letter-spacing: .5px; }

/* ---------- ③ 通用组件 ---------- */
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }
#view > * { animation: cardIn .24s ease both; }
#view > *:nth-child(2) { animation-delay: .04s; }
#view > *:nth-child(3) { animation-delay: .08s; }
#view > *:nth-child(4) { animation-delay: .12s; }
#view > *:nth-child(5) { animation-delay: .16s; }
#view > *:nth-child(n+6) { animation-delay: .2s; }

.card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--glass-line);
  padding: 16px; margin-bottom: 14px;
  box-shadow: var(--shadow-card);
  transition: box-shadow .2s;
  min-width: 0;
}
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.center { text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; line-height: 2; }
.empty::before { content: '📚'; display: block; font-size: 38px; line-height: 1.4; margin-bottom: 4px; }

.btn {
  border: none; border-radius: var(--radius-sm); padding: 11px 18px; min-height: 42px;
  font-size: 15px; cursor: pointer; font-family: inherit;
  transition: transform .05s, opacity .15s, box-shadow .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--grad-primary); color: var(--on-primary); font-weight: 600; box-shadow: 0 6px 16px var(--primary-glow); }
.btn.primary:active { box-shadow: 0 2px 8px var(--primary-glow); }
.btn.primary:disabled { background: var(--disabled-bg); box-shadow: none; }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.big { display: block; width: 100%; padding: 13px; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; }

/* 胶囊 chip：排序 / 筛选 / 章节选择 —— 选中态必须一眼可见 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface-2); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: 13px; font-family: inherit;
  cursor: pointer; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s, box-shadow .15s, transform .1s;
}
.chip:active { transform: scale(.96); }
.chip.on {
  background: var(--grad-primary); border-color: transparent; color: var(--on-primary);
  font-weight: 600; box-shadow: 0 3px 10px var(--primary-glow);
}

/* 折叠开关（章节 / 小节） */
.sec-toggle {
  flex: 0 0 auto; width: 26px; height: 26px; padding: 0; line-height: 1;
  border: none; border-radius: 7px; background: var(--surface-2); color: var(--muted);
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: transform .1s, background .15s;
}
.sec-toggle:active { transform: scale(.92); }

/* ---------- 首页 ---------- */
.hero {
  background: var(--hero-grad);
  border-radius: var(--radius); color: #fff;
  padding: 26px 20px; margin-bottom: 16px; text-align: center;
  position: relative; overflow: hidden;
  box-shadow: 0 12px 28px var(--primary-glow);
}
.hero::before, .hero::after {
  content: ''; position: absolute; border-radius: 50%;
  background: rgba(255, 255, 255, .13); pointer-events: none;
}
.hero::before { width: 150px; height: 150px; top: -72px; right: -42px; }
.hero::after { width: 104px; height: 104px; bottom: -52px; left: -26px; }
.hero-num {
  font-size: clamp(30px, 9vw, 42px); font-weight: 800; line-height: 1.2;
  position: relative; letter-spacing: .5px; text-shadow: 0 2px 14px rgba(10, 30, 90, .18);
}
.hero-label { opacity: .85; font-size: 13px; position: relative; }

.bank-list { margin-top: 16px; }
.bank-card {
  display: flex; align-items: center; background: var(--card);
  border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.bank-main { flex: 1; padding: 14px 16px; cursor: pointer; min-width: 0; }
.bank-name { font-weight: 600; font-size: 15px; word-break: break-word; }
.bank-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.bank-del {
  background: none; border: none; color: var(--muted); padding: 14px;
  font-size: 13px; cursor: pointer; flex: 0 0 auto;
}

/* ---------- 导入 ---------- */
.file-list { margin-top: 14px; }
.file-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  margin-bottom: 8px; font-size: 13px;
}
.file-name { flex: 1; min-width: 0; word-break: break-word; }
.file-size { color: var(--muted); white-space: nowrap; }
.file-state { color: var(--primary); white-space: nowrap; }
.file-item[data-state="失败"] .file-state,
.file-item[data-state="无文本"] .file-state { color: var(--bad); }
.file-item[data-state^="✓"] .file-state { color: var(--ok); }

.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0; }
.progress-bar {
  height: 100%; background: var(--grad-primary); width: 0; transition: width .4s;
  position: relative; overflow: hidden;
}
.progress-bar::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%);
  transform: translateX(-100%); animation: shimmer 1.8s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* ---------- 练习配置 ---------- */
.bank-pick { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.pick-item { display: flex; gap: 8px; font-size: 14px; padding: 4px 0; }
/* 章节区：按题库分组（可整库折叠） */
.sec-pick { margin-top: 12px; }
.sec-pick + .sec-pick { padding-top: 10px; border-top: 1px dashed var(--line); }
.sec-pick-head { display: flex; align-items: center; gap: 8px; }
.sec-pick-head b { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-pick-head .muted { flex: 0 0 auto; white-space: nowrap; }
.seg { display: flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; }
.seg button {
  flex: 1; min-width: 0; border: none; background: none; padding: 8px;
  border-radius: 8px; font-size: 14px; color: var(--muted); cursor: pointer; font-family: inherit;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

/* ---------- 答题 ---------- */
.quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 4px; }
.quiz-prog { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; text-align: right; margin-right: 6px; }
.exam-timer {
  margin-left: auto; margin-right: 6px; flex: 0 0 auto;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 3px 11px; border-radius: 20px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
}
.exam-timer.warn { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: timerPulse 1s ease-in-out infinite; }
@keyframes timerPulse { 50% { opacity: .5; } }
.quiz-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 0 0 12px; }
.quiz-bar-fill { height: 100%; border-radius: 3px; background: var(--hero-grad); transition: width .3s ease; }
.exam-banner {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-3); border: 1px solid var(--line); border-left: 3px solid var(--primary);
  border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12.5px; color: var(--text);
  margin-bottom: 12px; line-height: 1.5;
}
.star-btn {
  background: none; border: none; font-size: 24px; line-height: 1;
  color: var(--muted); cursor: pointer; padding: 4px 6px; min-height: 36px; min-width: 36px;
  transition: transform .1s, color .15s;
}
.star-btn:active { transform: scale(1.25); }
.star-btn.on { color: var(--star); }
.q-type {
  display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px;
  font-weight: 700; color: #fff; letter-spacing: .4px;
  box-shadow: 0 2px 6px rgba(20, 30, 60, .15);
}
.q-type.single { background: var(--t-single); }
.q-type.multi { background: var(--t-multi); }
.q-type.judge { background: var(--t-judge); }
.q-type.fill { background: var(--t-fill); }

/* ---------- 答题卡 ---------- */
.sheet-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sheet-cell {
  width: 40px; height: 40px; border-radius: var(--radius-sm); cursor: pointer; position: relative;
  background: var(--surface-2); border: 1.5px solid var(--line); color: var(--muted);
  font-size: 14px; font-weight: 700; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  line-height: 1;
  transition: transform .1s, background .15s, color .15s, border-color .15s, box-shadow .15s;
}
.sheet-cell:active { transform: scale(.94); }
.sheet-cell.done { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.sheet-cell.wrong { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.sheet-cell.filled { border-color: transparent; color: var(--on-primary); background: var(--grad-primary); box-shadow: 0 3px 9px var(--primary-glow); }
.sheet-cell.cur { outline: 2px solid var(--primary); outline-offset: 1px; }
.sheet-cell.cur:not(.filled):not(.done):not(.wrong) { border-color: var(--primary); color: var(--primary); }
.sheet-cell.star::after { content: '★'; position: absolute; top: -7px; right: -5px; font-size: 12px; color: var(--star); }
/* 答题卡格子里的「你选了什么」 */
.cell-pick { font-size: 9.5px; font-weight: 600; opacity: .92; letter-spacing: .5px; max-width: 34px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); align-items: center; }
.sheet-legend i {
  display: inline-block; width: 12px; height: 12px; border-radius: 4px;
  border: 1.5px solid var(--line); margin-right: 4px; vertical-align: -1px;
}
.sheet-legend i.done { border-color: var(--ok); background: var(--ok-bg); }
.sheet-legend i.wrong { border-color: var(--bad); background: var(--bad-bg); }
.sheet-legend i.filled { border-color: var(--primary-dark); background: var(--primary); }
.sheet-legend i.cur { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }

.stem { font-size: 16px; line-height: 1.7; font-weight: 500; }
.stem.sm { font-size: 14px; font-weight: 400; }
.blank { color: var(--primary); font-weight: 700; }

.options { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
.option {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  background: var(--surface-2); border: 1.5px solid var(--glass-line); border-radius: var(--radius-sm);
  padding: 12px 13px; cursor: pointer; font-size: 14.5px; font-family: inherit; line-height: 1.55;
  min-width: 0;
  transition: border-color .15s, background .15s, box-shadow .15s, transform .1s;
}
.option:active { transform: scale(.99); }
.option.picked { border-color: var(--primary); background: var(--surface-3); box-shadow: 0 2px 10px var(--primary-glow); }
.option.right { border-color: var(--ok); background: var(--ok-bg); }
.option.wrong { border-color: var(--bad); background: var(--bad-bg); }
.option.disabled { pointer-events: none; }
.opt-key {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--key-bg); color: var(--text); font-weight: 800;
  display: flex; align-items: center; justify-content: center; font-size: 12.5px; margin-top: 1px;
  box-shadow: inset 0 0 0 1px rgba(20, 30, 60, .05);
}
.option.picked .opt-key { background: var(--primary); color: var(--on-primary); }
.option.right .opt-key { background: var(--ok); color: #fff; }
.option.wrong .opt-key { background: var(--bad); color: #fff; }
.opt-text { flex: 1; min-width: 0; }

#multi-submit { margin-top: 14px; }

.fill-area { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.fill-input {
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 11px 14px;
  font-size: 15px; font-family: inherit; background: var(--card); color: var(--text); width: 100%;
}
.fill-input:focus { outline: none; border-color: var(--primary); }
.fill-input:disabled { background: var(--surface-2); color: var(--muted); }

.judge-area {
  margin-top: 14px; padding: 13px 14px; border-radius: var(--radius-sm); font-size: 14px;
  display: none; border-left: 3px solid transparent; animation: judgeIn .2s ease;
}
.judge-area.show { display: block; }
.judge-area.ok { background: var(--ok-bg); border-left-color: var(--ok); }
.judge-area.bad { background: var(--bad-bg); border-left-color: var(--bad); }
@keyframes judgeIn { from { opacity: 0; transform: translateY(5px); } }
.judge-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.judge-area.ok .judge-title { color: var(--ok); }
.judge-area.bad .judge-title { color: var(--bad); }
.judge-answer { margin-bottom: 4px; }
.judge-exp { color: var(--exp-text); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
.judge-exp.sm { font-size: 13px; border: none; padding: 0; margin: 6px 0 0; }

.quiz-nav { display: flex; gap: 10px; margin-top: 4px; }
.quiz-nav .btn { flex: 1; }

/* ---------- 结果页 ---------- */
.result-hero { text-align: center; padding: 30px 0 20px; }
.result-ring {
  --p: 0;
  width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 20px;
  background: conic-gradient(from 210deg, #6f6cf5, #1652f0 calc(var(--p) * .6%), #5b8cff calc(var(--p) * 1%), var(--line) 0);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: 0 12px 30px var(--primary-glow);
}
.result-ring::before {
  content: ''; position: absolute; width: 112px; height: 112px; border-radius: 50%;
  background: var(--bg);
}
.result-acc {
  position: relative; font-size: clamp(26px, 8vw, 34px); font-weight: 800;
  background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.result-acc small { font-size: 15px; background: none; color: var(--primary); }
.result-row { display: flex; justify-content: center; gap: 34px; }
.result-cell { display: flex; flex-direction: column; align-items: center; }
.result-cell b { font-size: 20px; }
.result-cell span { font-size: 12px; color: var(--muted); }

/* ---------- 错题本 ---------- */
.wrong-card { margin-bottom: 12px; }
.wrong-head { margin-bottom: 6px; }
.wrong-ans { margin-top: 8px; color: var(--ok); font-weight: 600; font-size: 14px; }

/* ---------- 成绩单：逐题解析（成绩单页可筛选 / 翻阅 / 跳题） ---------- */
.rev-nav { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.rev-nav .btn { flex: 0 0 auto; padding: 8px 12px; font-size: 13px; }
.rev-nav .btn:disabled { opacity: .4; }
.rev-pos { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rev-card { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rev-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rev-no {
  flex: 0 0 auto; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px;
  background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.rev-status { flex: 0 0 auto; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.rev-status.ok { color: var(--ok); background: var(--ok-bg); }
.rev-status.bad { color: var(--bad); background: var(--bad-bg); }
.rev-status.none { color: var(--muted); background: var(--surface-2); }
/* 选项右侧的「正确答案 / 你的选择」小标签 */
.opt-mark { flex: 0 0 auto; align-self: center; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.opt-mark.ok { color: var(--ok); background: var(--ok-bg); }
.opt-mark.bad { color: var(--bad); background: var(--bad-bg); }
/* 填空题：你的 / 正确 对照 */
.rev-ans { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.rev-ans-row { display: flex; gap: 10px; align-items: baseline; font-size: 14px; flex-wrap: wrap; line-height: 1.6; }
.rev-ans-k { flex: 0 0 auto; font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
.rev-ua-ok { color: var(--ok); font-weight: 600; }
.rev-ua-bad { color: var(--bad); font-weight: 600; }
.rev-ua-none { color: var(--muted); }

/* ---------- 背题模式 ---------- */
.recite-card .options { margin-top: 12px; }
.recite-card .wrong-ans { font-size: 15px; }

/* ---------- 练习记录 ---------- */
.hist-item { display: block; cursor: pointer; }
.hist-item:active { transform: scale(.99); }
.hist-top { display: flex; align-items: center; gap: 8px; }
.hist-mode { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text); }
.hist-mode.exam { color: var(--primary); background: var(--surface-3); }
.hist-acc { margin-left: auto; font-weight: 800; font-size: 16px; }
.hist-meta { margin-top: 6px; }

/* ---------- 统计 ---------- */
.stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
.stat-cell {
  flex: 1; min-width: 0; background: var(--card); border-radius: var(--radius); text-align: center;
  padding: 16px 8px; box-shadow: var(--shadow-soft);
}
.stat-cell b { display: block; font-size: clamp(18px, 5.6vw, 22px); }
.stat-cell span { font-size: 12px; color: var(--muted); }

/* 柱状图：修复横向溢出。
   关键点：① .col 允许收缩（min-width:0）② 柱高基准改为 .col-track（不含日期标签，
   标签不会再被挤出列外）③ 容器 overflow-x:auto 兜底，超窄屏改为横向滚动而非溢出卡片 */
.chart {
  display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 10px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chart::-webkit-scrollbar { display: none; }
.col {
  flex: 1 1 0; min-width: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center;
}
.col-track { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.col-bar {
  width: 68%; max-width: 20px; min-width: 5px; min-height: 3px;
  background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  border-radius: 5px 5px 2px 2px;
  transition: height .35s ease;
}
.col-label { flex: 0 0 auto; font-size: 9px; color: var(--muted); margin-top: 5px; white-space: nowrap; }
/* 日期标签：宽屏显示「月-日」，窄屏自动缩成「日」，避免 14 列标签互相挤压 */
.col-label .lb-mini { display: none; }
@media (max-width: 400px) {
  .col-label .lb-full { display: none; }
  .col-label .lb-mini { display: inline; }
}

/* ---------- 设置 ---------- */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field span { font-size: 13px; color: var(--muted); }
.field input {
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; font-family: inherit; background: var(--card); color: var(--text); width: 100%;
}
.field input:focus { outline: none; border-color: var(--primary); }
.field textarea {
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; font-family: inherit; background: var(--card); color: var(--text);
  resize: vertical; width: 100%;
}
.field textarea:focus { outline: none; border-color: var(--primary); }


/* ---------- 范式导入 ---------- */
.canon-spec {
  white-space: pre-wrap; word-break: break-word;
  font-family: inherit; font-size: 12.5px; line-height: 1.75; color: var(--text);
  background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px;
  max-height: 46vh; overflow: auto;
}
.canon-area {
  width: 100%; min-height: 210px; margin-top: 10px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 12px; font-size: 13.5px; line-height: 1.7;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--card); color: var(--text); resize: vertical;
}
.canon-area:focus { outline: none; border-color: var(--primary); }
.canon-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.canon-stat {
  flex: 1 1 0; min-width: 58px; text-align: center; background: var(--surface-2);
  border-radius: var(--radius-sm); padding: 10px 4px;
}
.canon-stat b { display: block; font-size: clamp(17px, 5.2vw, 21px); }
.canon-stat span { font-size: 11px; color: var(--muted); }
.canon-issues {
  margin-top: 12px; background: var(--surface-2);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.canon-issue-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.canon-issue-title.bad { color: var(--bad); }
.canon-issue {
  font-size: 12.5px; line-height: 1.6; color: var(--text);
  padding: 4px 0; border-bottom: 1px dashed var(--line);
  overflow-wrap: anywhere;
}
.canon-issue:last-child { border-bottom: none; }
.canon-issue .ln {
  display: inline-block; min-width: 56px; margin-right: 6px;
  color: var(--primary); font-weight: 600; font-size: 11.5px;
}

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: calc(var(--tabbar-h) + 30px); left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--toast-bg); color: var(--toast-text); font-size: 13.5px;
  padding: 10px 18px; border-radius: 999px; max-width: 86%;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px rgba(10, 20, 50, .18);
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 100;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 无障碍 / 聚焦质感 ---------- */
.fill-input:focus, .field input:focus, .field textarea:focus, .canon-area:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
}
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible,
.option:focus-visible, .sheet-cell:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ---------- ④ 小屏 / 大屏适配 ---------- */
@media (max-width: 360px) {
  .stem { font-size: 15px; }
  .option { font-size: 14px; }
  .btn.big { font-size: 15px; }
  .hero-num { font-size: 30px; }
}
@media (min-width: 560px) {
  .stem { font-size: 17px; }
}


/* ---------- ⑤ 「我的」页（v1.7.2 主流化改版） ---------- */
.me-hero {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 30px 16px 24px; text-align: center;
  background: var(--hero-grad); border: none; color: #fff;
}
.me-hero .muted { color: rgba(255, 255, 255, .78); }
.me-avatar {
  width: 66px; height: 66px; border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 800; letter-spacing: 1px;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3);
  box-shadow: 0 8px 20px rgba(9, 24, 66, .22);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.me-name { font-size: 19px; font-weight: 800; letter-spacing: 1px; }

.me-list { padding: 6px 8px; }
.me-entry {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px 10px; min-height: 56px;
  background: none; border: none; border-radius: 12px;
  font-family: inherit; font-size: 15px; color: var(--text);
  cursor: pointer; text-align: left; transition: background .15s;
}
.me-entry:active { background: var(--surface-2); }
.me-entry + .me-entry { position: relative; }
.me-entry + .me-entry::before {
  content: ''; position: absolute; top: 0; left: 56px; right: 10px;
  height: 1px; background: var(--line);
}
.me-ico {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; box-shadow: 0 3px 8px rgba(15, 30, 70, .18);
}
.me-label { flex: 0 0 auto; font-weight: 650; }
.me-entry .muted { flex: 1 1 auto; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-chev { flex: 0 0 auto; color: var(--muted); font-size: 22px; line-height: 1; font-weight: 300; }

</style>

  <script>
/* ========== IndexedDB 存储层 ========== */
const DB = (() => {
  const DB_NAME = 'QuizAppDB';
  const DB_VERSION = 1;
  let db = null;

  function open() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('banks')) {
          const s = d.createObjectStore('banks', { keyPath: 'id' });
          s.createIndex('createdAt', 'createdAt');
        }
        if (!d.objectStoreNames.contains('questions')) {
          const s = d.createObjectStore('questions', { keyPath: 'id' });
          s.createIndex('bankId', 'bankId');
        }
        if (!d.objectStoreNames.contains('records')) {
          const s = d.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
          s.createIndex('questionId', 'questionId');
          s.createIndex('bankId', 'bankId');
          s.createIndex('time', 'time');
        }
        if (!d.objectStoreNames.contains('meta')) {
          d.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  function tx(store, mode = 'readonly') {
    return db.transaction(store, mode).objectStore(store);
  }

  function promisify(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /* ---- meta ---- */
  async function metaGet(key) {
    const r = await promisify(tx('meta').get(key));
    return r ? r.value : null;
  }
  async function metaSet(key, value) {
    await promisify(tx('meta', 'readwrite').put({ key, value }));
  }

  /* ---- banks ---- */
  async function bankAdd(bank) {
    await promisify(tx('banks', 'readwrite').put(bank));
    return bank;
  }
  async function bankList() {
    return promisify(tx('banks').getAll());
  }
  async function bankGet(id) {
    return promisify(tx('banks').get(id));
  }
  async function bankDelete(id) {
    await promisify(tx('banks', 'readwrite').delete(id));
    // 级联删题
    const store = tx('questions', 'readwrite');
    const idx = store.index('bankId');
    const req = idx.openCursor(IDBKeyRange.only(id));
    await new Promise((resolve) => {
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
        else resolve();
      };
    });
    // 级联清该库回收站条目（题库已删，恢复无处可去）
    await recycleClear(id);
  }
  async function bankRename(id, name) {
    const bank = await bankGet(id);
    if (!bank) return null;
    bank.name = name;
    await bankAdd(bank);
    return bank;
  }
  async function bankUpdateCount(id) {
    const count = await promisify(tx('questions').index('bankId').count(IDBKeyRange.only(id)));
    const bank = await bankGet(id);
    if (bank) { bank.count = count; await bankAdd(bank); }
    return count;
  }

  /* ---- questions ---- */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  async function questionAddMany(questions) {
    // upsert：主键冲突时 put 覆盖而不是 add 报错（重复导入/中断重试不再炸）
    return new Promise((resolve, reject) => {
      const store = tx('questions', 'readwrite');
      let done = 0;
      const finish = () => { if (++done === questions.length) resolve(done); };
      questions.forEach(q => {
        if (!q.id) q.id = uid();
        const r = store.put(q);
        r.onsuccess = finish;
        r.onerror = () => reject(r.error);
      });
      if (!questions.length) resolve(0);
    });
  }
  async function questionsByBank(bankId) {
    return promisify(tx('questions').index('bankId').getAll(IDBKeyRange.only(bankId)));
  }
  async function questionPut(q) {
    await promisify(tx('questions', 'readwrite').put(q));
  }
  async function questionGet(id) {
    return promisify(tx('questions').get(id));
  }
  async function questionDelete(id) {
    await promisify(tx('questions', 'readwrite').delete(id));
  }

  /* ---- records ---- */
  async function recordAdd(rec) {
    rec.time = Date.now();
    await promisify(tx('records', 'readwrite').add(rec));
  }
  async function recordsAll() {
    return promisify(tx('records').getAll());
  }

  /* ---- 回收站（存 meta，简单可靠；删除的题目可恢复/彻底删除） ---- */
  async function recycleList() {
    return (await metaGet('recycleBin')) || [];
  }
  async function recycleAdd(bank, questions) {
    if (!questions || !questions.length) return;
    const bin = await recycleList();
    const now = Date.now();
    for (const q of questions) {
      bin.push({ qid: q.id, bankId: bank.id, bankName: bank.name, question: q, deletedAt: now });
    }
    await metaSet('recycleBin', bin);
  }
  async function recycleRemove(qid) {
    const bin = await recycleList();
    await metaSet('recycleBin', bin.filter(x => x.qid !== qid));
  }
  async function recycleRestore(qid) {
    const bin = await recycleList();
    const item = bin.find(x => x.qid === qid);
    if (!item) return null;
    // 目标题库已不存在 → 恢复失败（前端提示）
    const bank = await bankGet(item.bankId);
    if (!bank) return { ok: false, reason: 'bankGone' };
    const q = { ...item.question };
    // 原 id 已被新题占用（重复导入等）→ 换新 id 防覆盖
    const clash = await promisify(tx('questions').get(q.id));
    if (clash) q.id = uid();
    await questionPut(q);
    await bankUpdateCount(item.bankId);
    await metaSet('recycleBin', bin.filter(x => x.qid !== qid));
    return { ok: true };
  }
  async function recycleClear(bankId) {
    const bin = await recycleList();
    await metaSet('recycleBin', bankId ? bin.filter(x => x.bankId !== bankId) : []);
  }

  /* ---- 收藏（存 meta，简单可靠） ---- */
  async function starIds() {
    return (await metaGet('starIds')) || [];
  }
  async function starToggle(id) {
    const ids = await starIds();
    const i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    await metaSet('starIds', ids);
    return i < 0; // 返回是否新增收藏
  }
  async function starQuestions() {
    const ids = await starIds();
    if (!ids.length) return [];
    const out = [];
    for (const id of ids) {
      const q = await promisify(tx('questions').get(id));
      if (q) out.push(q);
    }
    return out;
  }

  /* ---- 每题最近一次作答：{qid: {correct, time}}（错题筛选 / 章节正确率共用，避免重复遍历） ---- */
  async function latestByQuestion() {
    const recs = await recordsAll();
    const latest = {};
    for (const r of recs) {
      const p = latest[r.questionId];
      if (!p || r.time > p.time) latest[r.questionId] = { correct: !!r.correct, time: r.time };
    }
    return latest;
  }

  /* ---- 错题：按题目聚合（最近一次答错且未在后续答对） ---- */
  async function wrongQuestions() {
    const recs = await recordsAll();
    // 按 questionId 分组取最新
    const latest = {};
    for (const r of recs) {
      if (!latest[r.questionId] || r.time > latest[r.questionId].time) latest[r.questionId] = r;
    }
    const wrongIds = Object.values(latest).filter(r => !r.correct).map(r => r.questionId);
    if (!wrongIds.length) return [];
    const store = tx('questions');
    const out = [];
    for (const id of wrongIds) {
      const q = await promisify(store.get(id));
      if (q) out.push(q);
    }
    return out;
  }

  async function clearRecords() {
    await promisify(tx('records', 'readwrite').clear());
  }

  async function stats() {
    const recs = await recordsAll();
    const byDay = {};
    let correct = 0;
    for (const r of recs) {
      const day = new Date(r.time).toISOString().slice(0, 10);
      byDay[day] = byDay[day] || { total: 0, correct: 0 };
      byDay[day].total++;
      if (r.correct) { correct++; byDay[day].correct++; }
    }
    return { total: recs.length, correct, wrong: recs.length - correct, byDay };
  }

  const idbApi = { open, metaGet, metaSet, bankAdd, bankList, bankGet, bankDelete, bankRename, bankUpdateCount, questionAddMany, questionsByBank, questionPut, questionGet, questionDelete, recordAdd, recordsAll, latestByQuestion, wrongQuestions, stats, clearRecords, uid, starIds, starToggle, starQuestions, recycleList, recycleAdd, recycleRemove, recycleRestore, recycleClear };

  /* ========== 降级存储：IndexedDB 被禁用（预览沙箱 / 内嵌页 / 部分 WebView）时自动接管
     优先用 localStorage 持久化；连 localStorage 也不可用（不透明源）时退化为纯内存，保证页面能打开可用 ========== */
  function makeMem() {
    const KEY = 'quizapp_mem_v1';
    let data = { banks: [], questions: [], records: [], meta: {}, seq: 1 };
    let persist = true;
    try { const raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); }
    catch (e) { persist = false; }
    let timer = null;
    const save = () => { if (!persist) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { persist = false; } };
    const saveSoon = () => { clearTimeout(timer); timer = setTimeout(save, 150); };
    // 页面隐藏/关闭时立刻落盘，避免防抖窗口内丢数据
    if (typeof window !== 'undefined' && window.addEventListener) {
      const flush = () => { if (timer) { clearTimeout(timer); timer = null; } save(); };
      window.addEventListener('pagehide', flush);
      if (typeof document !== 'undefined' && document.addEventListener) {
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
      }
    }
    const byId = (arr, id) => arr.find(x => x.id === id);
    const countOf = bankId => data.questions.filter(q => q.bankId === bankId).length;

    return {
      async open() { },
      uid,
      persist: () => persist,
      async metaGet(key) { return key in data.meta ? data.meta[key] : null; },
      async metaSet(key, value) { data.meta[key] = value; saveSoon(); },
      async bankAdd(bank) { const i = data.banks.findIndex(b => b.id === bank.id); if (i >= 0) data.banks[i] = bank; else data.banks.push(bank); saveSoon(); return bank; },
      async bankList() { return data.banks.slice(); },
      async bankGet(id) { return byId(data.banks, id) || undefined; },
      async bankDelete(id) {
        data.banks = data.banks.filter(b => b.id !== id);
        data.questions = data.questions.filter(q => q.bankId !== id);
        data.meta.recycleBin = (data.meta.recycleBin || []).filter(x => x.bankId !== id);
        saveSoon();
      },
      async bankRename(id, name) { const b = byId(data.banks, id); if (!b) return null; b.name = name; saveSoon(); return b; },
      async bankUpdateCount(id) { const c = countOf(id); const b = byId(data.banks, id); if (b) { b.count = c; saveSoon(); } return c; },
      async questionAddMany(qs) {
        for (const q of qs) { if (!q.id) q.id = uid(); const i = data.questions.findIndex(x => x.id === q.id); if (i >= 0) data.questions[i] = q; else data.questions.push(q); }
        saveSoon(); return qs.length;
      },
      async questionsByBank(bankId) { return data.questions.filter(q => q.bankId === bankId); },
      async questionPut(q) { const i = data.questions.findIndex(x => x.id === q.id); if (i >= 0) data.questions[i] = q; else data.questions.push(q); saveSoon(); },
      async questionGet(id) { return byId(data.questions, id) || undefined; },
      async questionDelete(id) { data.questions = data.questions.filter(q => q.id !== id); saveSoon(); },
      async recordAdd(rec) { rec.id = data.seq++; rec.time = Date.now(); data.records.push(rec); saveSoon(); },
      async recordsAll() { return data.records.slice(); },
      async latestByQuestion() {
        const latest = {};
        for (const r of data.records) { const p = latest[r.questionId]; if (!p || r.time > p.time) latest[r.questionId] = { correct: !!r.correct, time: r.time }; }
        return latest;
      },
      async wrongQuestions() {
        const latest = {};
        for (const r of data.records) if (!latest[r.questionId] || r.time > latest[r.questionId].time) latest[r.questionId] = r;
        const ids = Object.values(latest).filter(r => !r.correct).map(r => r.questionId);
        return data.questions.filter(q => ids.includes(q.id));
      },
      async stats() {
        const byDay = {}; let correct = 0;
        for (const r of data.records) {
          const day = new Date(r.time).toISOString().slice(0, 10);
          byDay[day] = byDay[day] || { total: 0, correct: 0 };
          byDay[day].total++;
          if (r.correct) { correct++; byDay[day].correct++; }
        }
        return { total: data.records.length, correct, wrong: data.records.length - correct, byDay };
      },
      async clearRecords() { data.records = []; saveSoon(); },
      async starIds() { return (data.meta.starIds || []).slice(); },
      async starToggle(id) { const ids = data.meta.starIds || (data.meta.starIds = []); const i = ids.indexOf(id); if (i >= 0) ids.splice(i, 1); else ids.push(id); saveSoon(); return i < 0; },
      async starQuestions() { const ids = data.meta.starIds || []; return data.questions.filter(q => ids.includes(q.id)); },
      async recycleList() { return (data.meta.recycleBin || []).slice(); },
      async recycleAdd(bank, questions) {
        if (!questions || !questions.length) return;
        const bin = data.meta.recycleBin || (data.meta.recycleBin = []);
        const now = Date.now();
        for (const q of questions) bin.push({ qid: q.id, bankId: bank.id, bankName: bank.name, question: q, deletedAt: now });
        saveSoon();
      },
      async recycleRemove(qid) { data.meta.recycleBin = (data.meta.recycleBin || []).filter(x => x.qid !== qid); saveSoon(); },
      async recycleRestore(qid) {
        const bin = data.meta.recycleBin || [];
        const item = bin.find(x => x.qid === qid);
        if (!item) return null;
        if (!byId(data.banks, item.bankId)) return { ok: false, reason: 'bankGone' };
        const q = { ...item.question };
        if (byId(data.questions, q.id)) q.id = uid();
        const i = data.questions.findIndex(x => x.id === q.id); if (i >= 0) data.questions[i] = q; else data.questions.push(q);
        const b = byId(data.banks, item.bankId); if (b) b.count = countOf(item.bankId);
        data.meta.recycleBin = bin.filter(x => x.qid !== qid);
        saveSoon();
        return { ok: true };
      },
      async recycleClear(bankId) { data.meta.recycleBin = bankId ? (data.meta.recycleBin || []).filter(x => x.bankId !== bankId) : []; saveSoon(); }
    };
  }

  const memApi = makeMem();
  const state = { fallback: false };

  /* IndexedDB 初始化失败 → 自动降级，绝不因存储不可用而白屏 */
  async function openSmart() {
    try {
      await open();
      state.fallback = false;
    } catch (e) {
      console.warn('[DB] IndexedDB 不可用（' + (e && e.name) + '：' + (e && e.message) + '），已切换本地降级存储');
      state.fallback = true;
    }
  }

  const api = {};
  for (const k of Object.keys(idbApi)) {
    if (k === 'open') continue;
    api[k] = (...args) => (state.fallback ? memApi : idbApi)[k](...args);
  }
  api.open = openSmart;
  api.isFallback = () => state.fallback;
  api.fallbackPersistent = () => state.fallback && memApi.persist();
  return api;
})();

</script>
  <script>
/* ========== 文件文本提取层（Word / 文本 / 图片） ========== */
const Extractor = (() => {

  /* ---- DOCX：mammoth 提取文本；嵌入图片仅计数，正文位置标记 [图片] ----
     （v1.5：内置 Tesseract OCR 已移除——19MB 资源换不来可用的识别质量；
      v1.7：图片型题库改由 AI 视觉接口识别——extractFull 可带走嵌入图片，
      交视觉模型转写，准确率远超传统 OCR） ---- */

  function htmlToPlainText(html) {
    const ta = document.createElement('textarea');
    ta.innerHTML = html
      .replace(/<img[^>]*>/gi, '\n[图片]\n')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|h[1-6]|li|tr|table|blockquote|section)>/gi, '\n')
      .replace(/<[^>]+>/g, '');
    return ta.value.replace(/\n[ \t]+/g, '\n').replace(/\n{3,}/g, '\n\n');
  }

  /* ---- 图片压缩：手机照片动辄 5-10MB，直接 base64 会撑爆请求 ----
     等比缩到最长边 maxSide（默认 1600px，试卷文字足够清晰），JPEG 质量 quality */
  function shrinkImage(dataUrl, maxSide = 1600, quality = 0.82) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          let { width: w, height: h } = img;
          if (w <= maxSide && h <= maxSide) return resolve(dataUrl); // 已经够小，不再压
          const scale = Math.min(maxSide / w, maxSide / h);
          const cv = document.createElement('canvas');
          cv.width = Math.round(w * scale);
          cv.height = Math.round(h * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', quality));
        } catch (e) {
          resolve(dataUrl); // 压缩失败（如跨域污染）就发原图，宁多花流量不失败
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  async function fromDOCX(file, onProgress, opts = {}) {
    if (!window.mammoth) throw new Error('当前为精简版（未内置 Word 解析），请改用「范式导入」，或下载完整版');
    const buf = await file.arrayBuffer();
    let imgCount = 0;
    const images = [];   // v1.7：嵌图收集（dataUrl），供 AI 视觉识别兜底
    // 图片统一替换为 1px 透明占位：既保留「此处有图」标记，又避免 base64 大图占用内存
    const result = await window.mammoth.convertToHtml({ arrayBuffer: buf }, {
      convertImage: window.mammoth.images.imgElement(async (image) => {
        imgCount++;
        try {
          const b64 = await image.readAsBase64String();
          if (b64 && b64.length > 2000) { // 过滤装饰小图（横线/LOGO），大于 2KB 才可能是题目图
            images.push({ name: `图片${imgCount}`, dataUrl: `data:${image.contentType};base64,${b64}` });
          }
        } catch (e) { /* 读不出就只留标记 */ }
        return { src: 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' };
      })
    });
    const text = htmlToPlainText(result.value);
    if (opts.full) {
      // 完整模式：调用方（导入页）自己决定图片型文档怎么兜底，这里不抛错
      return { text, images };
    }
    // 兼容模式：图片型 DOCX 仍明确报错（canon.js 的 Word 转换器等旧调用方）
    if (imgCount > 0 && text.replace(/\s|\[图片\]/g, '').length < 50) {
      throw new Error('该 Word 几乎全是图片（图片型题库）：请在「导入题库」改用 AI 视觉识别，或改用文字型题库文件');
    }
    return text;
  }

  /* ---- 统一入口 ---- */
  async function extract(file, onProgress, opts) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.docx')) {
      return fromDOCX(file, onProgress, opts);
    }
    if (name.endsWith('.doc')) {
      throw new Error('暂不支持旧版 .doc 格式，请用 Word/WPS 另存为 .docx 后重试');
    }
    if (name.endsWith('.pdf')) {
      throw new Error('已移除 PDF 解析：请先把 PDF 另存为 Word(.docx) 或文本，或用「范式导入」直接贴文本');
    }
    // txt / markdown：直接读纯文本（选择器接受 .txt/.md，不再误报「仅支持 DOCX」）
    if (name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.markdown')) {
      return await file.text();
    }
    throw new Error('不支持的格式：' + file.name + '（支持 DOCX / TXT / MD）');
  }

  /* ---- 完整提取（v1.7）：文本 + 嵌入图片一起带走，导入页视觉识别用 ---- */
  async function extractFull(file, onProgress) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.docx')) return fromDOCX(file, onProgress, { full: true });
    if (name.endsWith('.doc')) {
      throw new Error('暂不支持旧版 .doc 格式，请用 Word/WPS 另存为 .docx 后重试');
    }
    if (name.endsWith('.pdf')) {
      throw new Error('已移除 PDF 解析：请先把 PDF 另存为 Word(.docx) 或文本，或用「范式导入」直接贴文本');
    }
    if (name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.markdown')) {
      return { text: await file.text(), images: [] };
    }
    throw new Error('不支持的格式：' + file.name + '（支持 DOCX / TXT / MD / 图片）');
  }


  /* ---- 噪声行检测：统计出现≥3次的短行（页眉页脚）+ 关键词兜底 ----
     排除：选项行（A. 开头）、数字题号行、结构性行（章/节/题型标题——
     多章节文件里「一、单选题」每章重复出现是正常结构，绝不能当噪声删） ---- */
  function detectNoiseLines(lines) {
    const noise = new Set();
    // 结构性行：章标题 / 中文序号节标题 / 独立题型标题行
    const isStructural = t =>
      /^第\s*[一二三四五六七八九十\d]+\s*章/.test(t) ||
      /^[一二三四五六七八九十]+\s*[、.．]/.test(t) ||
      /^(单项选择题|单选题|多项选择题|多选题|不定项选择题|判断题|填空题|简答题|计算题|名词解释|论述题|选择题)\s*[：:]?\s*$/.test(t);
    // 统计重复短行
    const counts = new Map();
    for (const line of lines) {
      const t = line.trim();
      if (!t || t.length > 40) continue;
      if (/^[A-H]\s*[.、．:：)）]/.test(t)) continue; // 选项行
      if (/^\s*\d{1,3}\s*[.、．)）]/.test(t)) continue; // 数字题号行
      // 答案行 / 解析行：每道题后面都跟一行，天然「重复」，绝不能当页眉页脚删掉
      //（曾把「答案：D」当重复短行删除 → 整套题答案全丢，就是「答案扫不上」的主因）
      if (/^(?:参考答案|正确答案|标准答案|答案|答)\s*[:：]?/.test(t)) continue;
      if (/^(?:答案解析|解析|解释|说明)\s*[:：]/.test(t)) continue;
      if (isStructural(t)) continue; // 章节题型结构行
      counts.set(t, (counts.get(t) || 0) + 1);
    }
    for (const [t, c] of counts) if (c >= 3 && !isStructural(t)) noise.add(t);
    // 关键词兜底（即使只出现一次也是页眉页脚）
    const kw = /国家电网|统一服务热线|微信公众号|小程序|网校地址|hzdwpx|第\s*\d+\s*页/;
    for (const line of lines) {
      const t = line.trim();
      if (t.length <= 40 && kw.test(t) && !/^\s*\d{1,3}\s*[.、．)）]/.test(t)) noise.add(t);
    }
    return noise;
  }

  /* ---- 文本清洗：删噪声行 → 跨页断行合并 → 压缩空行 ---- */
  function cleanText(raw) {
    let lines = raw.replace(/\r/g, '').split('\n');
    // 1) 删噪声行
    const noise = detectNoiseLines(lines);
    lines = lines.filter(l => !noise.has(l.trim()));
    // 2) 跨页断行合并：上行以中文/字母数字/标点结尾 + 下行以中文开头，且下行不是新题号/选项/节标题/章标题/答案区头
    //    中间的空行不阻断合并（页眉页脚删除后常留空行）
    const merged = [];
    let pendingBlank = false;
    const isNewQ = s => /^\s*(\d{1,3}\s*[.、．)）]|[（(]\s*\d{1,3}\s*[)）])/.test(s);
    const isOpt = s => /^\s*[A-H]\s*[.、．:：)）]/.test(s);
    const isSec = s => /^\s*[一二三四五六七八九十][、.]/.test(s);
    const isChapter = s => /^第\s*[一二三四五六七八九十\d]+\s*章/.test(s);
    const isAnsHead = s => /^(参考答案|标准答案|答案速查|答案表|答案汇总|答案与解析|试题答案)/.test(s);
    // 独立题型标题行（无中文序号，如「单选题」单独成行）——是结构行，不能并进上一行
    const isTypeTitle = s => /^(单项选择题|单选题|多项选择题|多选题|不定项选择题|判断题|填空题|简答题|计算题|名词解释|论述题|选择题)\s*[：:]?\s*$/.test(s);
    // 答案行（「答案：D    解析：…」）——必须独立，并入选项行会污染选项内容
    const isAnsLine = s => /^答案\s*[:：]/.test(s);
    for (const line of lines) {
      const t = line.trim();
      if (!t) { pendingBlank = true; continue; }
      if (merged.length) {
        const prev = merged[merged.length - 1];
        const prevEnds = /[\u4e00-\u9fffA-Za-z0-9，。；：、？！）】》""''%,:;?)]$/.test(prev);
        const nextStarts = /^[\u4e00-\u9fff]/.test(t);
        if (prevEnds && nextStarts && !isNewQ(t) && !isOpt(t) && !isSec(t) && !isChapter(t) && !isAnsHead(t) && !isTypeTitle(t) && !isAnsLine(t)) {
          merged[merged.length - 1] = prev + t; // 合并时丢弃中间空行
          pendingBlank = false;
          continue;
        }
      }
      if (pendingBlank && merged.length) merged.push('');
      pendingBlank = false;
      merged.push(t);
    }
    let t = merged.join('\n');
    // 3) 压缩连续空行
    t = t.replace(/\n{3,}/g, '\n\n');
    return t.trim();
  }

  /* ---- 智能分块：按题号边界切，避免题目被拦腰截断 ---- */
  function chunk(text, maxLen = 4000) {
    const lines = text.split('\n');
    const chunks = [];
    let cur = [];
    let curLen = 0;
    // 题号模式：行首 数字 + . 、 ． ) 之一
    const qNum = /^\s*\d{1,3}\s*[.、．)）]\s*/;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const isBoundary = qNum.test(line) && line.trim().length > 5; // 太短的可能只是答案表
      if (isBoundary && curLen > maxLen * 0.6) {
        chunks.push(cur.join('\n'));
        cur = [];
        curLen = 0;
      }
      cur.push(line);
      curLen += line.length + 1;
      // 硬限制（找不到题号边界时）
      if (curLen > maxLen * 1.8) {
        chunks.push(cur.join('\n'));
        cur = [];
        curLen = 0;
      }
    }
    if (cur.length) chunks.push(cur.join('\n'));
    return chunks.filter(c => c.trim().length > 0);
  }

  /* ---- 确定性切题：按题号边界把原文切成一道道题（不靠 LLM 数题） ----
     R1 子小问（1）（2）（3）并入父题；R2 答案区停切；R3 短答案行不算题
     S1 题型小节感知：「一、单选题」等行设置当前节，题号回到1时隐式开新节
     每题带 key=节序号-题号（跨节去重用，修复各节同号互相覆盖）---- */
  function splitQuestions(text) {
    const lines = text.split('\n');
    const mainRe = /^\s*(\d{1,3})\s*[.、．)）]\s*/;
    const subRe = /^[（(]\s*(\d{1,3})\s*[)）]\s*/;
    const ansPairRe = /(\d{1,3})\s*[.、．:：)]?\s*[A-H]\b/g;
    const ansHeadRe = /^(参考答案|标准答案|答案速查|答案表|答案汇总|答案与解析|试题答案|参考答案与解析)/;
    // S1：题型小节行（≤15字、不以数字开头）
    const secType = s => {
      if (s.length > 15 || /^\s*\d/.test(s)) return null;
      if (/单选|只选/.test(s) && /题/.test(s)) return 'single';
      if (/多选/.test(s)) return 'multi';
      if (/判断/.test(s)) return 'judge';
      if (/填空/.test(s)) return 'fill';
      return null;
    };
    const isTypeTitle = s => /^(单项选择题|单选题|多项选择题|多选题|不定项选择题|判断题|填空题|简答题|计算题|名词解释|论述题|选择题)\s*[：:]?\s*$/.test(s);
    const isSecLine = s => (/^[一二三四五六七八九十]\s*[、.．]\s*\S/.test(s) && !/^\s*\d/.test(s)) || isTypeTitle(s);
    const isChapter = s => /^第\s*[一二三四五六七八九十\d]+\s*章/.test(s);

    // 预扫描
    let mainStyleCount = 0;
    for (const line of lines) {
      if (mainRe.test(line) && line.trim().length > 5 && !ansHeadRe.test(line.trim())) mainStyleCount++;
    }
    const hasMainStyle = mainStyleCount >= 5;

    function isAnswerLine(line) {
      const s = line.trim();
      // 选项行（「A.xxx  B.xxx  C.xxx」）绝不是答案表行——否则含数字+字母的选项行
      // （如「A.CQ≫C0  B.CQ≪C0  C.CQ=C0  D.CQ、C0…」「A.1A  B.2A  C.5A」）
      // 会被 ansPairRe 数出 ≥3 对而整行丢弃，连带该题答案一起丢
      if (/^[A-Ha-h]\s*[.、．)）:：]/.test(s)) return false;
      // 「答案：B    解析：…」是单题答案行，绝非答案表行（答案表行是「1.C 2.A 3.B」式）。
      // 否则计算题答案里的「6.75A、3.9A」等数字+字母会被误计成答案对而整行丢弃。
      if (/^(?:答案|答)\s*[:：]/.test(s) || /(?:答案解析|解析|解释|说明)\s*[:：]/.test(s)) return false;
      let c = 0; const re = new RegExp(ansPairRe.source, 'g');
      while (re.exec(line) !== null) c++;
      return c >= 3;
    }
    function isAnswerEntry(line) {
      const m = line.match(/^\s*(\d{1,3})\s*[.、．:：)）]?\s*([A-H]{1,4})(?![A-Za-z])/);
      if (!m) return false;
      return line.slice(m.index + m[0].length).trim().length < 25;
    }

    let inAnswerZone = false;
    const items = [];
    const sections = [];   // 节信息（供题库分组显示：{secIdx, title, type}）
    let cur = null;
    let secIdx = 0;        // 节序号（每节自增）
    let curType = null;    // 当前节题型提示
    let lastQNo = 0;       // 上一题号（检测回到1）
    let curChapter = null; // 当前章（单元）标题，如「第一章 磁路及变压器」
    let chapPart = 0;      // 章内隐式分组计数
    for (const line of lines) {
      const trimmed = line.trim();
      if (ansHeadRe.test(trimmed)) {
        if (cur) { items.push(cur); cur = null; }
        inAnswerZone = true;
        continue;
      }
      if (inAnswerZone) continue;
      // S1：题型小节 / 章标题。章 = 单元，必须带进节标题里——
      //     否则「第一章 xxx / 一、单选题」只剩「一、单选题」，
      //     导入后题库就没有单元了（多章同名小节还会互相混淆）
      if (isSecLine(trimmed) || isChapter(trimmed)) {
        const t = secType(trimmed);
        const isChap = isChapter(trimmed);
        if (t || isChap) {
          if (cur) { items.push(cur); cur = null; }
          secIdx++;
          curType = t;
          if (isChap) { curChapter = trimmed.slice(0, 30); chapPart = 0; }
          const title = isChap ? curChapter
            : (curChapter ? (curChapter + ' · ' + trimmed).slice(0, 60) : trimmed.slice(0, 30));
          sections.push({ secIdx, title, type: t });
          lastQNo = 0; // 显式节标题后重置题号，防止下一题 no=1 误触发隐式开节
          continue;
        }
      }
      if (isAnswerLine(line)) { if (cur) { items.push(cur); cur = null; } continue; }
      if (isAnswerEntry(line)) { if (cur) { items.push(cur); cur = null; } continue; }

      const m = line.match(mainRe);
      const sm = line.match(subRe);
      const isMainQ = m && trimmed.length > 5;
      if (isMainQ) {
        const no = +m[1];
        // 隐式开新节：题号回到 1（且之前已到过更大号）
        if (no === 1 && lastQNo > 1) {
          secIdx++;
          curType = null; // 隐式节无类型提示
          chapPart++;
          sections.push({ secIdx, title: curChapter ? (curChapter + ' · 第' + chapPart + '组') : null, type: null });
        }
        lastQNo = no;
        if (cur) items.push(cur);
        cur = { no, secIdx, type: curType, key: secIdx + '-' + no, text: [line.replace(mainRe, '')] };
      } else if (sm && (!hasMainStyle || !cur)) {
        const no = +sm[1];
        if (no === 1 && lastQNo > 1) { secIdx++; curType = null; }
        lastQNo = no;
        if (cur) items.push(cur);
        cur = { no, secIdx, type: curType, key: secIdx + '-' + no, text: [line.replace(subRe, '')] };
      } else if (hasMainStyle && sm && cur) {
        cur.text.push(line);
      } else if (cur) {
        cur.text.push(line);
        if (cur.text.join('\n').length > 4000) { items.push(cur); cur = null; }
      }
    }
    if (cur) items.push(cur);

    // 清洗：去尾部空行；过滤太短的
    const out = items
      .map(it => ({ no: it.no, secIdx: it.secIdx, key: it.key, type: it.type, text: it.text.join('\n').replace(/\s+$/g, '').trim() }))
      .filter(it => it.text.replace(/\s/g, '').length >= 8);

    // problems：按节报告重号/缺号
    const problems = [];
    const bySec = new Map();
    for (const it of out) {
      if (!bySec.has(it.secIdx ?? 0)) bySec.set(it.secIdx ?? 0, []);
      bySec.get(it.secIdx ?? 0).push(it.no);
    }
    for (const [sec, nos] of bySec) {
      const sorted = [...nos].sort((a, b) => a - b);
      const dup = sorted.filter((n, i) => i > 0 && sorted[i - 1] === n);
      const miss = [];
      if (sorted.length >= 5) {
        for (let i = sorted[0]; i <= sorted[sorted.length - 1]; i++) {
          if (!sorted.includes(i)) miss.push(i);
        }
      }
      if (dup.length || miss.length) {
        problems.push({ sec, dupNos: [...new Set(dup)], missingNos: miss });
      }
    }

    // 兼容旧字段：全局缺号/重号（供提示用）
    const allNos = out.map(q => q.no).sort((a, b) => a - b);
    const globalDup = allNos.filter((n, i) => i > 0 && allNos[i - 1] === n);
    return { items: out, total: out.length, dupNos: [...new Set(globalDup)], missingNos: [], problems, sections };
  }

  /* ---- 本地单题解析：正则直接提取题干/选项/答案（零 API 调用） ----
     hintType：小节题型提示（judge 节 → 判断题，options 固定正确/错误）
     hintKey：小节-题号（透传到结果，供跨节去重）
     选项采用集合校验：去重排序后以 A 开头、最多缺 1 个中间字母即可（标 _degraded），
     不再要求从 A 起严格连续——解决转制文档选项乱序被整题丢弃 ---- */
  function parseOneQuestion(no, text, hintType, hintKey) {
    let t = text;
    let answer = null;

    // 0) 答案字母串归一化：兼容「ABCD」「A、B、C、D」「A,B」「A B」等写法
    const normAns = s => {
      const v = String(s || '').toUpperCase().replace(/[^A-H]/g, '');
      return v || null;
    };
    // 分隔符只允许行内空白（[ \t]），不能用 \s —— 否则「答案：A\nA．选项甲」会把下一行
    // 选项的字母 A 一起吃进来（得到 "AA"，选项行同时被破坏）——1000 题里最常见的漏扫根因
    const AT = '[A-H](?:[ \\t]*[、,，／/]?[ \\t]*[A-H]){0,7}';

    // 1) 显式答案标注（含顿号/逗号分隔的多选答案）
    const ansRes = [
      new RegExp('[（(]\\s*答案\\s*[:：]?[ \\t]*(' + AT + ')[ \\t]*[)）]'),
      new RegExp('【\\s*答案\\s*】?\\s*[:：]?[ \\t]*(' + AT + ')'),
      new RegExp('(?<![A-Za-z])答案\\s*[:：][ \\t]*(' + AT + ')(?![A-Za-z])'),
      new RegExp('(?<![A-Za-z])答\\s*[:：][ \\t]*(' + AT + ')(?![A-Za-z])'),
    ];
    for (const re of ansRes) {
      const m = t.match(re);
      if (m) { answer = normAns(m[1]); t = t.replace(m[0], ' '); break; }
    }
    if (!answer) {
      const jm = t.match(/[（(]\s*答案\s*[:：]?\s*(对|错|正确|错误)\s*[)）]/) || t.match(/答案\s*[:：]\s*(对|错|正确|错误)/);
      if (jm) { answer = /对|正确/.test(jm[1]) ? 'A' : 'B'; t = t.replace(jm[0], ' '); }
    }
    if (!answer) {
      const tm = t.match(/[（(]\s*([A-H])\s*[)）](?=\s*$|\n)/);
      if (tm) { answer = tm[1]; t = t.replace(tm[0], '（　）'); }
    }

    // 1a) 兜底：答案段带分组标签（如「单端：A、C；双端：B、D、E」）——仅当整段严格是
    //     「短标签: + 字母 + 分隔符」形状时才采纳，避免把文本型答案误当选项（宁缺毋错）
    if (!answer) {
      const seg = t.match(/(?<![A-Za-z])答案\s*[:：]\s*([^\n]{1,80}?)(?=\s*(?:答案解析|解析|解释|说明)\s*[:：]|$)/);
      if (seg) {
        const body = seg[1].trim();
        const shape = /^(?:[\u4e00-\u9fff]{1,6}\s*[:：]\s*)?[A-H](?:\s*[、,，；;／/\s]\s*(?:[\u4e00-\u9fff]{1,6}\s*[:：]\s*)?[A-H])*\s*[。.；;]?$/;
        if (shape.test(body)) {
          const letters = [...new Set(body.toUpperCase().replace(/[^A-H]/g, ''))].sort();
          if (letters.length) answer = letters.join('');
        }
      }
    }

    // 1b) 解析提取：内嵌式「答案：D    解析：…」「（解析：…）」或 Word 里最常见的
    //     「【解析】…」（无冒号）——必须在这里剔除，否则整段解析会黏进最后一个选项，
    //     既丢了讲解、又把选项内容污染掉
    let explanation = null;
    const expRes = [
      // 【解析】… / 【答案解析】…（无冒号；到下一个【标记或文末为止）
      /[【\[]\s*(?:答案解析|解析|解释|说明)\s*[】\]]\s*[:：]?\s*([\s\S]*?)\s*(?=[【\[]|$)/,
      /[（(]\s*(?:答案解析|解析|解释|说明)\s*[:：]?\s*([\s\S]*?)\s*[)）]/,
      /(?:答案解析|解析|解释|说明)\s*[:：]\s*([\s\S]+)$/,
    ];
    for (const re of expRes) {
      const m = t.match(re);
      if (m) {
        explanation = (m[1] || '').replace(/\s+/g, ' ').trim() || null;
        t = t.replace(m[0], ' ');
        break;
      }
    }

    // 2) 选项提取
    const lines = t.split('\n');
    const marks = [];
    let flat = '';
    for (const line of lines) { flat += line + '\n'; }
    // 2a) 行首选项标记（选项独立成行时最可靠；题干里的「A、B、C三相」等行内字样不会误入）
    const lineMarks = [];
    const lmRe = /(?:^|\n)[ \t　]*([A-H])\s*[.、．:：)）]\s*/g;
    let lm;
    while ((lm = lmRe.exec(flat)) !== null) {
      const letterPos = lm.index + lm[0].indexOf(lm[1]);
      lineMarks.push({ letter: lm[1], start: letterPos, markLen: lm.index + lm[0].length - letterPos });
    }
    // 剔除内容含「空答案括号」的假标记：如题干行「A、B两系统互联……（ ）。」开头的 A、
    const emptyBracket = /（\s*）|\(\s*\)|（[\s　]+）/;
    const keptLine = [];
    for (let i = 0; i < lineMarks.length; i++) {
      const from = lineMarks[i].start + lineMarks[i].markLen;
      const to = i + 1 < lineMarks.length ? lineMarks[i + 1].start : flat.length;
      const content = flat.slice(from, to);
      if (emptyBracket.test(content) && content.replace(/\s/g, '').length > 10) continue; // 是题干不是选项
      keptLine.push(lineMarks[i]);
    }
    const lineSet = [...new Set(keptLine.map(x => x.letter))].sort();
    let lineGaps = 0;
    for (let i = 1; i < lineSet.length; i++) lineGaps += lineSet[i].charCodeAt(0) - lineSet[i - 1].charCodeAt(0) - 1;
    if (lineSet.length >= 2 && lineSet[0] === 'A' && lineGaps <= 1) {
      const stem = flat.slice(0, keptLine[0].start).trim();
      const options = {};
      const seenL2 = new Set();
      const uniq2 = keptLine.filter(mk => { if (seenL2.has(mk.letter)) return false; seenL2.add(mk.letter); return true; });
      uniq2.forEach((mk, i) => {
        const from = mk.start + mk.markLen;
        const to = i + 1 < uniq2.length ? uniq2[i + 1].start : flat.length;
        options[mk.letter] = flat.slice(from, to).replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
      });
      if (Object.values(options).every(v => v.length > 0) && stem.length >= 5) {
        let type = 'single';
        if (hintType === 'multi' || (answer && answer.length > 1)) type = 'multi';
        const vals = Object.values(options).map(v => v.replace(/\s/g, ''));
        if (lineSet.length === 2 && /正确|对|√/.test(vals[0]) && /错误|错|×/.test(vals[1])) type = 'single';
        if (answer && [...answer].some(c => !options[c])) answer = null;
        return { no, key: hintKey, type, stem, options, answer: answer || null, explanation, _local: true, _degraded: lineGaps > 0 || keptLine.length !== uniq2.length || undefined };
      }
    }
    // 2b) 回退：行内标记（兼容「正确的是？A.xx B.yy」式行内选项）
    const optMarkRe = /([A-H])\s*[.、．:：)）]\s*/g;
    let m2;
    while ((m2 = optMarkRe.exec(flat)) !== null) {
      const before = flat[m2.index - 1];
      // 行首 / 空白 / 标点后的字母标记才算选项（含"正确的是？A."这类行内选项）
      if (m2.index === 0 || before === '\n' || /\s/.test(before) || /[，。；、：？！”』）】》,:;?)]$/.test(before)) {
        marks.push({ letter: m2[1], start: m2.index, markLen: m2[0].length });
      }
    }
    // 同字母多次出现只留第一个（按文本流位置）
    const seenL = new Set();
    const uniqMarks = marks.filter(mk => {
      if (seenL.has(mk.letter)) return false;
      seenL.add(mk.letter);
      return true;
    }).sort((a, b) => a.start - b.start);
    const letters = uniqMarks.map(x => x.letter);
    const hadDup = marks.length !== uniqMarks.length; // 同字母标记重复出现

    // 集合校验：含 A、按字母序、最多缺 1 个中间字母（缺字母/重复标记 → _degraded 残缺题；乱序但齐全 → 正常保留）
    const sortedSet = [...new Set(letters)].sort();
    if (sortedSet.length >= 2 && sortedSet[0] === 'A') {
      let gaps = 0;
      for (let i = 1; i < sortedSet.length; i++) {
        gaps += sortedSet[i].charCodeAt(0) - sortedSet[i - 1].charCodeAt(0) - 1;
      }
      if (gaps <= 1) {
        const degraded = gaps > 0 || hadDup;
        // 内容按文本流位置切分、按字母赋值
        const stem = flat.slice(0, uniqMarks[0].start).trim();
        const options = {};
        uniqMarks.forEach((mk, i) => {
          const from = mk.start + mk.markLen;
          const to = i + 1 < uniqMarks.length ? uniqMarks[i + 1].start : flat.length;
          options[mk.letter] = flat.slice(from, to).replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        });
        if (Object.values(options).every(v => v.length > 0) && stem.length >= 5) {
          let type = 'single';
          if (hintType === 'multi' || (answer && answer.length > 1)) type = 'multi';
          const vals = Object.values(options).map(v => v.replace(/\s/g, ''));
          if (letters.length === 2 && /正确|对|√/.test(vals[0]) && /错误|错|×/.test(vals[1])) {
            type = 'single';
          }
          if (answer && [...answer].some(c => !options[c])) answer = null;
          return { no, key: hintKey, type, stem, options, answer: answer || null, explanation, _local: true, _degraded: degraded || undefined };
        }
      }
    }

    // 3) 无选项 → 判断/填空（hintType 优先）
    const body = t.trim();
    if (body.length >= 5) {
      if (hintType === 'judge') {
        // 判断题：无选项结构，固定 正确/错误
        return { no, key: hintKey, type: 'judge', stem: body, options: { 'A': '正确', 'B': '错误' }, answer: answer || null, explanation, _local: true };
      }
      if (/_{3,}|_{2,}/.test(body)) {
        return { no, key: hintKey, type: 'fill', stem: body, options: null, answer: answer || null, explanation, _local: true };
      }
      if (hintType === 'fill' || /（\s*）|\(\s*\)/.test(body)) {
        return { no, key: hintKey, type: 'fill', stem: body, options: null, answer: answer || null, explanation, _local: true };
      }
      // 3a) 兜底：结构不明也别丢题（旧版此处 return null → 1000 题里总有几道「扫不上」）
      //     陈述句（无提问词、以句号收尾）→ 判断题；其余 → 填空/简答（答案自己填或 AI 解）
      if (!/^(姓名|学号|班级|专业|院系|得分|评分|考试时间|注意事项|题号|试卷|第\s*\d+\s*页)/.test(body)) {
        const asking = /简述|说明|论述|解释|为什么|如何|什么|哪些|试述|计算|证明|比较|列举|名词解释|问答|简答/.test(body);
        const type = (hintType === 'single' || hintType === 'multi') ? 'fill'
          : ((!asking && /[。.]$/.test(body)) ? 'judge' : 'fill');
        return {
          no, key: hintKey, type, stem: body,
          options: type === 'judge' ? { 'A': '正确', 'B': '错误' } : null,

/* ========== LLM 解析引擎（OpenAI 兼容接口） ========== */

    const pOut = parseFloat(cfg && cfg.priceOut) || 0;

     空闲看门狗：每收到一个数据块就重置 90s 计时——慢模型长输出不再被总时长砍断，
     只在「连数据都收不到」时才判超时。首块到达前的等待同样受看门狗保护。 ---- */
  async function readStream(resp, onDelta, ctl) {

  /* ---- 从全文提取答案区（启发式），返回 { text, first, last }（first/last 为答案区行区间，可能为 null）：

  function findAnswerTableSpan(text) {
    const lines = text.split('\n');

    const isStruct = t => /^第\s*[一二三四五六七八九十\d]+\s*章/.test(t) ||

      if (/^[（(【\[]\s*(答案解析|解析|解释|说明)/.test(r)) return true;

    }

      first = entryIdx[0]; last = entryIdx[entryIdx.length - 1];

    if (/^(错|错误|×|✗|否)$/.test(t)) return { answer: 'B', kind: 'judge', raw: t, note };

    if (secType === 'judge' && /^(F|N|FALSE)$/i.test(t)) return { answer: 'B', kind: 'judge', raw: t, note };

  function tryDenseLine(t) {

  function parseAnswerDocument(text) {
