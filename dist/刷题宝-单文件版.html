      const t = raw.trim();
      if (!t) continue;
      // 章 / 节 / 题型标题（与题目文件同名结构对齐）
      if (/^第\s*[一二三四五六七八九十\d]+\s*章/.test(t)) { chapter = t.slice(0, 40); section = null; secType = null; continue; }
      if (/^[一二三四五六七八九十]+\s*[、.．]/.test(t) || /^(单项选择题|单选题|多项选择题|多选题|判断题|填空题|选择题)\s*[：:]?\s*$/.test(t)) {
        section = t.slice(0, 20); secType = secTypeOfTitle(t); continue;
      }
      // 题号前缀（三选一）+ 可选「答案：」
      let no = null, rest = null;
      let m = t.match(/^(\d{1,3})\s*[.、．:：)）=－-]\s*/);
      if (m) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^第\s*(\d{1,3})\s*题\s*/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^题号\s*[:：]?\s*(\d{1,3})\s*/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^(\d{1,3})\s+(?=[A-Ha-hＡ-Ｈａ-ｈ对错√×])/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no != null) {
        const mA = rest.match(/^答案\s*[:：]?\s*/);
        const hasMarker = !!mA;
        if (mA) rest = rest.slice(mA[0].length);
        const { answerPart, explanation } = splitExplanation(rest);
        const cls = classifyAnswerToken(answerPart, secType);
        // 无「答案：」标记时只收字母/判断类（避免把题目行当答案）
        if (cls && (hasMarker || cls.kind !== 'text')) { pushEntry(no, cls, explanation); continue; }
      }
      // 密集答案行
      const dense = tryDenseLine(t);
      if (dense) { for (const d of dense) pushEntry(d.no, d, null); continue; }
      // 无题号答案行（序列模式）
      const m2 = t.match(/^(?:答案|答)\s*[:：]\s*([\s\S]+)$/);
      if (m2) {
        const { answerPart, explanation } = splitExplanation(m2[1]);
        const cls = classifyAnswerToken(answerPart, secType);
        if (cls) ordered.push({ answer: cls.answer, kind: cls.kind, raw: cls.raw, explanation: explanation || null });
      }
    }
    return { entries, ordered, hasNos: entries.length >= 3 };
  }

  /* ---- 答案文件判定辅助：答案行占比（导入时区分题目文件 / 答案文件） ---- */
  function answerLineRatio(text) {
    const lines = String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return 0;
    let n = 0;
    for (const t of lines) {
      if (/^\d{1,3}\s*[.、．:：)）]?\s*(?:答案\s*[:：]?\s*)?[A-Ha-hＡ-Ｈａ-ｈ](?![A-Za-z0-9])/.test(t) ||
          /^\d{1,3}\s*[.、．:：)）]?\s*(?:答案\s*[:：]?\s*)?(对|错|√|×|正确|错误)/.test(t) ||
          /^(?:答案|答)\s*[:：]/.test(t)) n++;
    }
    return n / lines.length;
  }

  /* ---- 配套答案匹配：按 章+节+题号 精确对位，逐级回退（章+题号 → 节+题号 → 裸题号 → 顺序）
     同时填入解析；按题型校验答案合法性，多候选无法区分时宁缺毋错 ---- */
  function matchAnswersStructured(questions, sections, parsed) {
    const res = { filled: 0, explained: 0 };
    if (!parsed || (!parsed.entries.length && !parsed.ordered.length)) return res;

    const normTitle = s => String(s || '').trim()
      .replace(/单项选择题/g, '单选题').replace(/多项选择题/g, '多选题');

    // 问题侧：secIdx → { chapter, section, type }
    const secMeta = new Map();
    let curChapter = null;
    for (const s of (sections || [])) {
      const title = s.title || null;
      const isChap = title && /^第\s*[一二三四五六七八九十\d]+\s*章/.test(title);
      if (isChap) curChapter = title;
      secMeta.set(s.secIdx, {
        chapter: isChap ? title : curChapter,
        section: isChap ? null : (title ? normTitle(title) : null),
        type: s.type || null
      });
    }

    // 答案侧索引
    const exact = new Map(), chapNo = new Map(), secNo = new Map(), bareNo = new Map();
    const put = (m, k, e) => { if (!m.has(k)) m.set(k, []); m.get(k).push(e); };
    for (const e of parsed.entries) {
      const chap = e.chapter || null;
      const sec = e.section ? normTitle(e.section) : null;
      if (chap && sec) put(exact, chap + '|' + sec + '|' + e.no, e);
      if (chap) put(chapNo, chap + '|' + e.no, e);
      if (sec) put(secNo, sec + '|' + e.no, e);
      put(bareNo, String(e.no), e);
    }

    const valid = (q, e) => {
      if (!e || !e.answer) return false;
      if (!q.options || q.type === 'fill') return String(e.answer).trim().length > 0;
      const letters = normLetters(e.answer);
      if (!letters) return false;                       // 选项题不能配文本答案
      if ([...letters].some(c => !q.options[c])) return false;
      if ((q.type === 'single' || q.type === 'judge') && letters.length !== 1) return false;
      return true;
    };
    const apply = (q, e) => {
      if (!valid(q, e)) return false;
      if (q.type === 'fill' || !q.options) q.answer = String(e.kind === 'text' ? e.answer : (e.raw || e.answer)).trim();
      else q.answer = normLetters(e.answer);
      if (e.explanation && !q.explanation) { q.explanation = e.explanation; res.explained++; }
      res.filled++;
      return true;
    };
    const pick = (cands, q, meta) => {
      if (!cands || !cands.length) return null;
      const ok = cands.filter(e => valid(q, e));
      if (!ok.length) return null;
      if (ok.length === 1) return ok[0];
      const byType = ok.filter(e => e.secType && meta && meta.type && e.secType === meta.type);
      return byType.length === 1 ? byType[0] : null; // 多候选且分不清 → 放弃，宁缺毋错
    };

    const targets = questions.filter(q => !q.answer);
    // P1 章+节+题号 → P2 章+题号 → P3 节+题号 → P4 裸题号
    for (const q of targets) {
      const meta = q.key ? secMeta.get(+String(q.key).split('-')[0]) || null : null;
      let e = null;
      if (meta) {
        if (meta.chapter && meta.section) e = pick(exact.get(meta.chapter + '|' + meta.section + '|' + q.no), q, meta);
        if (!e && meta.chapter) e = pick(chapNo.get(meta.chapter + '|' + q.no), q, meta);
        if (!e && meta.section) e = pick(secNo.get(meta.section + '|' + q.no), q, meta);
      }
      if (!e) e = pick(bareNo.get(String(q.no)), q, meta);
      if (e) apply(q, e);
    }
    // P5 纯序列（答案文件无题号）：按出现顺序对位（已答的也占位，保持对齐）
    if (!parsed.entries.length && parsed.ordered.length) {
      let si = 0;
      for (const q of questions) {
        const e = parsed.ordered[si++];
        if (!e) break;
        if (!q.answer) apply(q, e);
      }
    }
    return res;
  }

  /* ================= AI 辅助录入 · 从答案文件原文智能对位 =================
     定位：本地结构化匹配（matchAnswersStructured）的兜底——格式怪异/题号错位/
     无章节标题导致正则对不上时，交给 AI 按语义从答案原文里找答案照抄填入。
     关键设计（保正确率）：
     1. AI 只做「对位+照抄」，明确禁止自己推理做题——答案文件里就是标准答案
     2. 每题带章节上下文 + 题号 + 题型 + 题干，给 AI 足够对位线索
     3. 回填前过同一套题型校验（single/judge→单字母且在选项内，multi→字母合法，fill→文本）
     4. 答案原文超长自动分片轮询；失败批次重试；并发可配 */
  async function aiMatchAnswers(questions, answerText, sections, onProgress, onRetry, onBatchSave) {
    const res = { filled: 0, explained: 0 };
    let pool = questions.filter(q => !q.answer);
    if (!pool.length || !answerText || !String(answerText).trim()) return res;

    const cfg = await getConfig();
    const concurrency = Math.max(1, Math.min(4, parseInt(cfg.concurrency, 10) || 4));
    const BATCH = 12;      // 每批题数
    const SLICE = 48000;   // 答案原文分片大小（字符）

    // 题目侧章节上下文（与 matchAnswersStructured 同源），给 AI 对位线索
    const secMeta = new Map();
    let curChapter = null;
    for (const s of (sections || [])) {
      const title = s.title || null;
      const isChap = title && /^第\s*[一二三四五六七八九十\d]+\s*章/.test(title);
      if (isChap) curChapter = title;
      secMeta.set(s.secIdx, { chapter: isChap ? title : curChapter, section: isChap ? null : title });
    }
    const contextOf = q => {
      if (!q.key) return null;
      const m = secMeta.get(+String(q.key).split('-')[0]);
      return m ? [m.chapter, m.section].filter(Boolean).join(' / ') || null : null;
    };

    const PROMPT = `你是答案匹配专家。输入包含【题目列表】和【答案文件原文】，答案文件原文里写着每道题的标准答案。
请从答案文件原文中找出每道题对应的答案（按题号、章节标题、题型、题干内容对位），严格按 JSON 输出（不要 markdown、不要解释文字）：
{"answers":[{"idx":0,"answer":"C","explanation":"答案文件原文中该题的解析，没有则留空"}]}
规则：
- idx 是【题目列表】里每题的序号（从 0 开始）
- 选择题 answer 为选项字母串，如 "C"、"ACD"；单选题只填 1 个字母
- 判断题：原文「对/正确/√」→ answer 填 "A"；「错/错误/×」→ answer 填 "B"
- 填空题 answer 为答案文本
- 必须照抄答案文件原文中的答案，禁止自己推理做题
- 答案文件原文里找不到对应答案的题，不要输出该项
- explanation 仅当答案原文带解析时照抄，否则留空`;

    // 一批题目 + 一片答案原文 → AI 对位 → 校验回填
    const fillBatch = async (batch, sliceText) => {
      const body = batch.map((q, i) => ({
        idx: i,
        no: q.no ?? undefined,
        context: contextOf(q) || undefined,
        type: q.type,
        stem: String(q.stem || '').slice(0, 60),
        options: q.options ? Object.keys(q.options).join('') : undefined
      }));
      const raw = await chat([
        { role: 'system', content: PROMPT },
        { role: 'user', content: '【题目列表】\n' + JSON.stringify(body) + '\n\n【答案文件原文】\n' + sliceText }
      ], { onRetry });
      const obj = parseJSON(raw);
      const arr = obj?.answers || obj;
      if (!Array.isArray(arr)) throw new Error('AI 返回非 JSON');
      let got = 0, exp = 0;
      for (const a of arr) {
        const q = batch[a?.idx];
        if (!q || q.answer) continue;
        let ans = String(a.answer ?? '').trim();
        if (!ans || ans === 'null') continue;
        if (q.options && q.type !== 'fill') {
          // 选项题：同结构化匹配的严格校验
          const letters = normLetters(ans);
          if (!letters) continue;                                       // 选项题不收文本答案
          if ([...letters].some(c => !q.options[c])) continue;           // 字母不在选项里
          if ((q.type === 'single' || q.type === 'judge') && letters.length !== 1) continue; // 单选/判断必须单字母
          q.answer = letters;
        } else {
          // 填空/无选项题：收文本，限长
          if (ans.length > 80) ans = ans.slice(0, 80);
          q.answer = ans;
        }
        if (a.explanation && !q.explanation) { q.explanation = String(a.explanation).trim(); exp++; }
        got++;
      }
      return { got, exp };
    };

    // 分片轮询：答案原文超长时逐片查找（前面片找不到的题进入下一片）
    const text = String(answerText).trim();
    const slices = [];
    for (let i = 0; i < text.length; i += SLICE) slices.push(text.slice(i, i + SLICE));

    for (let si = 0; si < slices.length && pool.length; si++) {
      let retriesLeft = 1; // 每片失败批重试 1 次
      while (pool.length) {
        const batches = [];
        for (let i = 0; i < pool.length; i += BATCH) batches.push(pool.slice(i, i + BATCH));
        let bIdx = 0, done = 0;
        const netFailed = [];
        await Promise.all(Array.from({ length: Math.min(concurrency, batches.length) }, async () => {
          while (bIdx < batches.length) {
            const batch = batches[bIdx++];
            try {
              const { got, exp } = await fillBatch(batch, slices[si]);
              res.filled += got; res.explained += exp;
              if (got && onBatchSave) { try { await onBatchSave(batch); } catch (e) { /* 保存失败不中断 */ } }
            } catch (e) { netFailed.push(batch); }
            done++;
            if (onProgress) onProgress(done, batches.length, res.filled, si + 1, slices.length);
          }
        }));
        pool = pool.filter(q => !q.answer);
        if (!netFailed.length || !pool.length || retriesLeft-- <= 0) break;
        pool = netFailed.flat().filter(q => !q.answer);
      }
    }
    return res;
  }

  /* ---- 整体解析 · 纯本地：正则切题 + 逐题解析 + 答案表匹配（0 次 API 调用、无需 API Key） ---- */
  async function parseDocument(fullText, onProgress) {
    const text = Extractor.cleanText(fullText);
    const answerTable = findAnswerTable(text);

    // 1) 确定性切题
    const split = Extractor.splitQuestions(text);

    // 2) 本地正则解析（毫秒级、零费用）——透传节题型/节键
    const questions = [];
    for (const it of split.items) {
      const q = Extractor.parseOneQuestion(it.no, it.text, it.type, it.key);
      if (q && q.stem) questions.push(q);
    }
    for (const q of questions) delete q._local;

    // 3) 答案区本地匹配：同文件答案表 / 逐行答案条目 → 按 章+节+题号 填答案与解析
    if (answerTable && answerTable.trim()) {
      const parsedAns = parseAnswerDocument(answerTable);
      if (parsedAns.entries.length || parsedAns.ordered.length) {
        matchAnswersStructured(questions, split.sections, parsedAns);
      }
    }

    if (onProgress) onProgress(1, 1, questions.length);

    const answered = questions.filter(q => q.answer).length;
    return {
      questions, answered, noAnswer: questions.length - answered,
      splitTotal: split.total, localCount: questions.length, aiCount: 0,
      degraded: questions.filter(q => q._degraded).length,
      missingNos: split.missingNos, dupNos: split.dupNos, problems: split.problems,
      sections: split.sections,
      dropped: Math.max(0, split.total - questions.length),
      mode: 'local'
    };
  }

  /* ================= 第二步 · 答案补全 ================= */

  /* ---- 把答案文件文本解析成 { 题号: 答案 } 映射（兼容旧接口，内部走结构化解析器） ----
     支持："1.C 2.A 3.B" / "1、C" / "2、答案：A（解析：…）" / "题号:1 答案:C" / "A B C D"（纯序列按顺序） ---- */
  function parseAnswerMap(text) {
    const parsed = parseAnswerDocument(text);
    if (parsed.entries.length >= 3) {
      const map = new Map();
      for (const e of parsed.entries) if (!map.has(e.no)) map.set(e.no, e.answer);
      return { map, mode: 'numbered' };
    }
    if (parsed.ordered.length >= 3) {
      const map = new Map();
      parsed.ordered.forEach((o, i) => map.set(i + 1, o.answer));
      return { map, mode: 'sequence' };
    }
    return { map: new Map(), mode: 'none' };
  }

  /* ---- 用答案映射给题目填答案（按题号；序列模式按顺序，已答题也消耗序号保持对齐） ---- */
  function matchAnswers(questions, answerMap, mode) {
    let filled = 0;
    let seqIdx = 0;
    for (const q of questions) {
      if (mode === 'sequence') {
        // 序列模式：每道题都占一个位置（答案文件通常是完整的）
        const seq = ++seqIdx;
        if (!q.answer) {
          const ans = answerMap.get(seq);
          if (ans && !(q.options && [...ans].some(c => !q.options[c]))) {
            q.answer = ans;
            filled++;
          }
        }
        continue;
      }
      if (q.answer) continue;
      if (q.no != null) {
        const ans = answerMap.get(q.no);
        if (ans && !(q.options && [...ans].some(c => !q.options[c]))) {
          q.answer = ans;
          filled++;
        }
      }
    }
    return filled;
  }

  /* ---- 长文档切片：累积到目标长度后，尽量在「空行 / 题号行 / 章节标题 / 题型标记行」处断开，
     避免把一道题切成两半（fileToCanon 与 fileToCanonLite 共用） ---- */
  function chunkSource(src, TARGET) {
    const chunks = [];
    let buf = [], size = 0;
    const flush = () => { const t = buf.join('\n').trim(); if (t) chunks.push(t); buf = []; size = 0; };
    for (const line of src.split('\n')) {
      buf.push(line);
      size += line.length + 1;
      if (size < TARGET) continue;
      const t = line.trim();
      const boundary = !t || /^\d{1,3}\s*[.、．]/.test(t) || /^第\s*[一二三四五六七八九十\d]+\s*章/.test(t) ||
        /^[一二三四五六七八九十]+\s*[、.．]/.test(t) || /^【/.test(t) || /^#{1,2}\s/.test(t);
      if (boundary || size >= TARGET * 1.6) flush();
    }
    flush();
    return chunks;
  }

  /* ================= 文件 → 范式（AI 只排版，不做题） =================
     与「AI 解题」相反：答案必须从原卷（题目下方标注 / 文末答案表）照抄，AI 严禁自己推理作答。
     用途：原卷排版太乱、本地规则切不出题时，让 AI 把「正文片段 + 全文答案表」重排成范式文本；
     产物仍是纯文本，交给本地的 Canon.parse 预览 → 导入，导入环节 0 次 API 调用。
     长文档按 空行/题号行/章节标题 就近切片，避免把一道题切成两半。 */
  async function fileToCanon(text, onProgress, onRetry, onDelta, onPiece) {
    const src = String(text || '').replace(/\r\n?/g, '\n').trim();
    if (!src) throw new Error('文档里没有可转换的文字');

    // 全文答案表（题目文件、独立答案文件都可能有）：作为每片的共享上下文，供跨片按题号对位
    let answerTable = findAnswerTable(src).trim();
    if (answerTable.length > 40000) answerTable = answerTable.slice(0, 40000);

    const PROMPT = `你是题库排版助手。用户会给你【原卷文档片段】，请把它整理成「范式」格式的纯文本。你只做排版，绝对不做题。

范式格式（严格遵守）：
1. 章标题单独一行，以 # 开头：# 第1章 电力电子器件
2. 节标题单独一行，以 ## 开头：## 1.1 电力二极管；题型小节写成 ## 判断题 也可以
3. 每道题一块，题与题之间空一行
4. 题干行最前面写题型标记：【单选】【多选】【判断】【填空】（简答/问答/名词解释/计算统一按【填空】）
5. 选择题每个选项一行：A. 选项内容，必须从 A 开始连续、不缺字母
6. 答案单独一行：答案：B；多选 答案：ABD；判断 答案：对 或 答案：错；多空填空用 ||| 分隔：答案：阳极|||阴极
7. 解析单独一行：解析：……
8. 题号可写在题干最前面：1. 电力二极管属于（ ）器件。

红线（违反即报废）：
- 答案和解析只能「照抄」原卷：题目下方的答案标注，或【全文答案表】里对应的题号条目
- 严禁自己推理、判断、解答；原卷里没有答案的题，不要写「答案：」行，宁缺毋错
- 题干、选项、答案、解析的文字一律原文照抄，不改写、不缩写、不补充、不翻译
- 丢弃页码、页眉页脚、水印、学校名、装订线等噪声
- 只输出范式文本本身：不要任何解释、前后缀说明、markdown 代码块或 JSON`;

    /* 切片：累积到目标长度后，尽量在「空行 / 题号行 / 章节标题 / 题型标记行」处断开 */
    const chunks = chunkSource(src, 5000);

    /* v1.7.3：片段并发处理（读设置并发数，上限 4）——
       各片段相互独立（共享答案表上下文），逐片排队是「转范式卡半天」的主因之一；
       4 路并发约快 4 倍，费用不变。流式回显只跟随当前「持有者」片段，多片不互相打架 */
    const conc = Math.max(1, Math.min(4, parseInt((await getConfig()).concurrency, 10) || 4));
    const pieces = new Array(chunks.length).fill('');
    let next = 0, done = 0, streamOwner = null;
    const worker = async () => {
      while (next < chunks.length) {
        const i = next++;
        const head = `【原卷文档片段 ${i + 1}/${chunks.length}】\n` + chunks[i];
        const user = answerTable
          ? `【全文答案表（只能从这里或正文标注处照抄答案）】\n${answerTable}\n\n${head}`
          : head;
        const mine = streamOwner === null;
        if (mine) streamOwner = i;
        let raw = '';
        try {
          raw = await chat([
            { role: 'system', content: PROMPT },
            { role: 'user', content: user }
          ], { onRetry, raw: true, onDelta: onDelta && mine ? (acc) => onDelta(acc, i + 1, chunks.length) : null });
        } finally {
          if (mine) streamOwner = null;
        }
        const piece = String(raw || '').trim()
          .replace(/^```(?:text|markdown|md)?\s*/i, '')
          .replace(/```\s*$/, '')
          .trim();
        if (piece) { pieces[i] = piece; if (onPiece) onPiece(i, chunks.length, piece); }
        if (onProgress) onProgress(++done, chunks.length, `片段 ${done}/${chunks.length}`);
      }
    };
    await Promise.all(Array.from({ length: Math.min(conc, chunks.length) }, worker));
    const out = pieces.filter(Boolean).join('\n\n').trim();
    if (!out) throw new Error('AI 没有返回可用的范式文本');
    return out;
  }

  /* ================= 乱格式快速通道（v1.7.3 · AI 只出标注，本地装配） =================
     病根：全量转范式要 AI 把题干选项逐字重打一遍，1000 题输出几万字，
     十几分钟是模型打字速度的物理上限，怎么优化流程都绕不过去。
     做法：文字已能提取的文档，AI 只输出「标注」——每题的定位开头(at)/题型/答案/解析，
     题干、选项由本地从原文照抄切块装配成范式文本。AI 输出量降到零头，快 5~10 倍，费用也降。
     红线不变：答案只照抄（原卷标注 / 全文答案表），严禁 AI 自己推理；定位失败的题宁缺毋错。
     适用：原卷文字可提取但排版乱（题号怪、答案分离、噪声多）；纯图片仍走视觉识别。 */
  const LITE_PROMPT = `你是题库标注助手。输入【原卷片段】（可能含多道题）和【全文答案表】，找出片段里的每道题，只输出定位与答案标注。严格按 json 输出（不要 markdown 代码块、不要任何解释文字）：
{"questions":[{"at":"题干第一行开头的连续原文","type":"single","answer":"B","exp":"解析原文"}]}
- at：题干第一行里连续的一段原文（10~25 字，可含题号），逐字照抄；程序靠它在原文里定位题目开头，必须与原文完全一致
- type：single / multi / judge / fill（简答、问答、名词解释、计算一律填 fill）
- answer：只照抄——原卷题目旁的答案标注，或【全文答案表】里对应题号的答案；原文没有就省略该字段，严禁自己推理作答
- 选择题 answer 为字母（如 "C"、"ACD"）；判断题为 "对" 或 "错"；填空题照抄文本答案，多个空用 ||| 分隔
- exp：原卷或答案表里有解析才照抄，没有就省略
- 页眉、页脚、页码、水印、装订线不是题，不要输出
- questions 按原文顺序排列，片段里每道题输出一项，不要遗漏`;

  async function fileToCanonLite(text, opts = {}) {
    const { onProgress, onRetry, onDelta, onPiece } = opts;
    const src = String(text || '').replace(/\r\n?/g, '\n').trim();
    if (!src) throw new Error('文档里没有可转换的文字');

    // 全文答案表作为每片的共享上下文（与全量转范式同口径）；并把它从正文剥掉——
    // 否则残留的答案表既会挡住 AI 答案的追加（HAS_ANS 误判），还会被 Canon.parse 误认成题目
    const span = findAnswerTableSpan(src);
    let answerTable = span.text.trim();
    if (answerTable.length > 40000) answerTable = answerTable.slice(0, 40000);
    let bodySrc = src;
    if (answerTable && span.first != null && span.last != null) {
      const ls = src.split('\n');
      const stripped = ls.slice(0, span.first).concat(ls.slice(span.last + 1)).join('\n');
      // 护栏：答案区若散布在全文中（如逐题下方标注），剥离会掏空正文——此时不剥，仅作上下文
      const before = src.replace(/\s/g, '').length;
      const after = stripped.replace(/\s/g, '').length;
      if (after >= before * 0.3) bodySrc = stripped.trim();
    }

    const chunks = chunkSource(bodySrc, 3500); // 标注模式输出短，片也切小些，定位更准
    const conc = Math.max(1, Math.min(4, parseInt((await getConfig()).concurrency, 10) || 4));
    const pieces = new Array(chunks.length).fill('');
    let next = 0, done = 0, streamOwner = null;

    /* 定位：把 AI 给的「题干开头」在片段里按行找（忽略空白差异），只往后找不回头 */
    const norm = s => String(s || '').replace(/\s+/g, '');
    const locate = (lines, needle, from) => {
      const n = norm(needle).slice(0, 30);
      if (!n) return -1;
      for (let i = Math.max(0, from); i < lines.length; i++) {
        if (norm(lines[i]).includes(n)) return i;
      }
      // 兜底：题干开头可能被换行截开，相邻两行拼起来再找一次
      for (let i = Math.max(0, from); i < lines.length - 1; i++) {
        if (norm(lines[i] + lines[i + 1]).includes(n)) return i;
      }
      return -1;
    };

    /* 答案清洗：选择题只留字母并排序，判断归一为 对/错，填空照抄 */
    const ansClean = it => {
      if (!it || it.answer == null) return '';
      const t = String(it.answer).trim();
      if (!t) return '';
      if (it.type === 'single' || it.type === 'multi') {
        const letters = t.toUpperCase().replace(/[^A-H]/g, '');
        return letters ? letters.split('').sort().join('') : '';
      }
      if (it.type === 'judge') {
        if (/对|正确|√|true|^T$/i.test(t)) return '对';
        if (/错|误|×|false|^F$/i.test(t)) return '错';
        return '';
      }
      return t; // fill：照抄文本
    };

    /* 装配：按定位行切出每题的原文块，原卷已有答案/解析就不重复追加。
       块尾若挂着下一节的章节标题，先摘出来、答案行插在它前面——
       否则「答案：X」落在节标题之后，导入解析会把它孤立丢弃 */
    const HAS_ANS = /【\s*答案\s*】|^\s*(?:参考答案|正确答案|答案|答)\s*[:：]/m;
    const HAS_EXP = /【\s*解析\s*】|^\s*(?:参考)?解析\s*[:：]/m;
    // 注意：只认中文数字节标题（「二、填空题」「第一部分」），不能放宽到阿拉伯数字——
    // 否则「3．IGBT…」这类题号行会被误当标题整块摘走，答案也随之丢失
    const SEC_HEAD = /^\s*(?:第\s*[一二三四五六七八九十\d]+\s*[章节部分]|[一二三四五六七八九十]+\s*[、.．]|【(?!答案|解析)[^】]{0,12}】|#{1,3}\s)/;
    const assemble = (chunk, items) => {
      const lines = chunk.split('\n');
      const found = [];
      let cursor = 0;
      for (const it of items || []) {
        const L = locate(lines, it && it.at, cursor);
        if (L < 0) continue; // 定位失败的题：宁缺毋错，不乱插答案
        found.push({ line: L, it });
        cursor = L + 1;
      }
      if (!found.length) return '';
      const out = [];
      if (found[0].line > 0) {
        const head = lines.slice(0, found[0].line).join('\n').trim();
        if (head) out.push(head, ''); // 片段开头没被标注到的文字原样保留，交给 Canon.parse 兜底
      }
      for (let k = 0; k < found.length; k++) {
        const end = k + 1 < found.length ? found[k + 1].line : lines.length;
        const blines = lines.slice(found[k].line, end);
        const after = [];
        while (blines.length && !blines[blines.length - 1].trim()) blines.pop();
        while (blines.length && SEC_HEAD.test(blines[blines.length - 1])) {
          after.unshift(blines.pop());
          while (blines.length && !blines[blines.length - 1].trim()) blines.pop();
        }
        const block = blines.join('\n').trim();
        if (block) {
          out.push(block);
          const answer = ansClean(found[k].it);
          if (answer && !HAS_ANS.test(block)) out.push('答案：' + answer);
          const exp = found[k].it && found[k].it.exp ? String(found[k].it.exp).trim() : '';
          if (exp && !HAS_EXP.test(block)) out.push('解析：' + exp.slice(0, 600));
        }
        if (after.length) out.push(after.join('\n'), '');
        else out.push('');
      }
      return out.join('\n').trim();
    };

    const worker = async () => {
      while (next < chunks.length) {
        const i = next++;
        const head = `【原卷片段 ${i + 1}/${chunks.length}】\n` + chunks[i];
        const user = answerTable
          ? `【全文答案表（答案只能从这里或正文标注处照抄）】\n${answerTable}\n\n${head}`
          : head;
        const mine = streamOwner === null;
        if (mine) streamOwner = i;
        let raw = '';
        try {
          raw = await chat([
            { role: 'system', content: LITE_PROMPT },
            { role: 'user', content: user }
          ], { onRetry, raw: true, onDelta: onDelta && mine ? (acc) => onDelta(acc, i + 1, chunks.length) : null });
        } finally {
          if (mine) streamOwner = null;
        }
        let items = [];
        try {
          const m = String(raw || '').match(/\{[\s\S]*\}/); // 容错：剥掉可能的说明文字，取 JSON 本体
          if (m) {
            const j = JSON.parse(m[0]);
            items = Array.isArray(j.questions) ? j.questions : [];
          }
        } catch (e) { items = []; }
        const piece = items.length ? assemble(chunks[i], items) : '';
        if (piece) { pieces[i] = piece; if (onPiece) onPiece(i, chunks.length, piece); }
        if (onProgress) onProgress(++done, chunks.length, `片段 ${done}/${chunks.length}`);
      }
    };
    await Promise.all(Array.from({ length: Math.min(conc, chunks.length) }, worker));

    const out = pieces.filter(Boolean).join('\n\n').trim();
    if (!out) throw new Error('标注路线没切出题目（原卷格式太乱或 AI 定位失败）');
    return out;
  }

  /* ================= 图片视觉识别（v1.7 · 第三期） =================
     OCR 走后图片型题库的新路：图片直接交给视觉模型转写成范式文本。
     - 每张图独立一次请求：单张失败不拖垮整批（调用方可按图重试/跳过）
     - 流式回显复用 chat() 的 onDelta；重试/限流冷却同样复用
     - 模型用 cfg.visionModel（留空跟随主模型）；主模型无视觉能力时由设置页单独指定
     - 成本：视觉模型按图片 token 计费，每张图约几百到一千输入 tok，显著低于识别错误人工返工的成本 */
  const VISION_PROMPT = `你是专业的试卷转写员。把图片中的全部题目内容逐字转写为「范式文本」，格式要求：
1. 章节标题行：# 第X章 …（图片里没有章节就省略）
2. 小节标题行：## X.X …
3. 题型标记 + 题号 + 题干：【单选】1. …（单选/多选/判断/填空；简答、名词解释、计算等统一按【填空】）
4. 选择题每个选项一行：A. 选项内容，从 A 开始连续不缺字母
5. 答案单独一行：答案：B（多选 答案：ABD；判断 答案：对 或 答案：错；图片里没有答案的题不要编造答案行）
6. 解析单独一行：解析：……（图片里没有解析就省略）
7. 多空填空用 ||| 分隔：答案：阳极|||阴极

红线：
- 只转写图片里实际存在的内容：逐字照抄，不改写、不缩写、不补充、不解答
- 图片模糊看不清的字用 ▢ 占位，不要猜
- 丢弃页码、页眉页脚、水印、装订线等噪声
- 只输出范式文本本身：不要任何解释、前后缀说明或 markdown 代码块`;

  /**
   * 图片 → 范式文本（逐张识别后拼接）
   * @param {Array<{name:string, dataUrl:string}>} images 已压缩好的图片（data:image/jpeg;base64,...）
   * @param {Object} opts { onProgress(i,total,note), onRetry(attempt,coolSec), onDelta(i,total,acc), onPiece(i,total,txt) }
   * @returns {Promise<string>} 所有图片识别文本，按顺序以空行拼接
   */
  async function visionCanon(images, opts = {}) {
    const list = (images || []).filter(x => x && x.dataUrl);
    if (!list.length) throw new Error('没有可识别的图片');
    const cfg = await getConfig();
    const vModel = (cfg.visionModel || '').trim() || cfg.model;
    const out = [];
    for (let i = 0; i < list.length; i++) {
      const img = list[i];
      if (opts.onProgress) opts.onProgress(i, list.length, `识别 ${img.name || `图片${i + 1}`}…`);
      const messages = [
        { role: 'system', content: VISION_PROMPT },
        { role: 'user', content: [
          { type: 'image_url', image_url: { url: img.dataUrl } },
          { type: 'text', text: '把这张图片中的全部题目转写为范式文本。' }
        ] }
      ];
      const raw = await chat(messages, {
        raw: true,
        modelOverride: vModel,
        onRetry: opts.onRetry,
        onDelta: opts.onDelta ? (acc) => opts.onDelta(i, list.length, acc) : null
      });
      const piece = String(raw || '').trim()
        .replace(/^```(?:text|markdown|md)?\s*/i, '')
        .replace(/```\s*$/, '')
        .trim();
      if (piece) { out.push(piece); if (opts.onPiece) opts.onPiece(i, list.length, piece); }
      if (opts.onProgress) opts.onProgress(i + 1, list.length, `已完成 ${i + 1}/${list.length} 张`);
    }
    const joined = out.join('\n\n').trim();
    if (!joined) throw new Error('视觉模型没有返回可用的文本，请检查「设置」中的视觉模型是否支持图片');
    return joined;
  }

  /* ================= 缺答案 AI 解题（只补空答案，绝不覆盖原卷答案） =================
     与「文件 → AI 转范式」配套：范式文本里的题若「答案：」为空，交给 AI 补出来。
     只对 !q.answer 的题调用 API（已答的一律不动，省钱也不覆盖原卷），
     答案写回 question.answer，再由 Canon.serialize 落成「答案：X」行。

     成本控制设计（v1.3.8）：
     1. 预估费用：调用前先算大概批次/费用，让调用方弹窗确认，避免「一点就烧钱」
     2. 立即中断：opts.shouldStop() 返回 true 时停；再传 opts.signal（AbortController.signal）会立即 abort
        进行中的请求，当前批标成可续跑（不进失败队列），已解的题立即落盘
     3. 断点续传：opts.isDone(q) 返回 true 的题直接跳过（配合进度存档）
     4. 答案来源标注：opts.markAI 为 true 时，q.aiAnswer = true，UI 显示「AI 解答·需核对」
     5. 进度回调：onProgress({done,total,solved,paused,stopReason,usage}) 实时反馈
     6. 并发可控：opts.concurrency 覆盖 cfg.concurrency（默认仍读配置，上限 4）
     7. 实耗与上限：每笔请求的 usage 累计入 usage 字段；opts.capYuan>0 时实耗达到上限自动暂停（stopReason='cap'） */
  async function solveMissing(questions, onProgress, onRetry, opts = {}) {
    let pool = (questions || []).filter(q => !q.answer && !(opts.isDone && opts.isDone(q)));
    if (!pool.length) return { solved: 0, usage: { prompt_tokens: 0, completion_tokens: 0 } };
    const BATCH = 10;
    const MAX_ROUNDS = 3;
    const cfg = await getConfig();
    const concurrency = Math.max(1, Math.min(4, parseInt(opts.concurrency || cfg.concurrency, 10) || 4));

    const PROMPT = `你是答题专家。给下列题目补上正确答案。

请严格按照以下 JSON 格式输出，不要输出任何其他文字：
{"answers":[{"idx":0,"answer":"C"}]}

规则：
- idx 是输入里每题的序号（从0开始）
- 选择题 answer 为选项字母，如 "C" 或 "ACD"，必须是题目给定选项里的字母
- 判断题 answer 为 "对" 或 "错"
- 填空题 answer 为答案文本，多个空用 ||| 分隔
- 只给答案，不要写解析
- 不确定的题不要猜，宁可不答
- 必须输出有效的 JSON，不要 markdown 代码块`;

    let solved = 0, round = 0, lastFailNote = '';
    const usage = { prompt_tokens: 0, completion_tokens: 0 };
    let paused = false, stopReason = '', capHit = false;
    const capYuan = parseFloat(opts.capYuan) || 0;

    const emit = (done, total, note) => {
      if (onProgress) onProgress({ done, total, solved, usage: { ...usage }, cost: +costOf(usage, cfg).toFixed(4), paused, stopReason, note });
    };

    while (pool.length && round < MAX_ROUNDS) {
      // 调用方要求暂停 / 费用触顶 → 立即停止，不再起新一轮
      if (capHit || (opts.shouldStop && opts.shouldStop())) {
        paused = true; stopReason = capHit ? 'cap' : 'paused'; break;
      }
      round++;
      if (round > 1) {
        emit(0, 1, `网络波动，第 ${round} 轮重试（10s 后）`);
        await new Promise(r => setTimeout(r, 10000));
        pool = pool.filter(q => !q.answer);
        if (!pool.length) break;
      }
      const batches = [];
      for (let i = 0; i < pool.length; i += BATCH) batches.push(pool.slice(i, i + BATCH));
      const failed = [];
      let done = 0, idx = 0;
      async function worker() {
        while (idx < batches.length) {
          // 分批暂停：当前批跑完就停，不抢占新批（capHit 时同样让路）
          if (capHit || (opts.shouldStop && opts.shouldStop())) {
            paused = true; stopReason = capHit ? 'cap' : 'paused'; break;
          }
          const batch = batches[idx++];
          const batchIdx = idx; // 记录当前批次号
          const body = batch.map((q, i) => ({ idx: i, type: q.type, stem: q.stem, options: q.options || undefined }));
          let ok = true, failNote = '', solvedHere = 0;
          console.log(`[解题] 批次 ${batchIdx}/${batches.length} 开始，${batch.length} 题`);
          try {
            const raw = await chat([
              { role: 'system', content: PROMPT },
              { role: 'user', content: JSON.stringify(body) }
            ], { onRetry, signal: opts.signal, _solveMode: true });
            console.log(`[解题] 批次 ${batchIdx} API 返回 ${raw ? raw.length : 0} 字`);
            const u = getLastUsage();
            if (u) {
              usage.prompt_tokens += u.prompt_tokens || 0;
              usage.completion_tokens += u.completion_tokens || 0;
              if (capYuan > 0 && costOf(usage, cfg) >= capYuan) capHit = true;
            }
            const obj = parseJSON(raw);
            /* v1.8 修复「AI 解题没效果」：模型返回形态五花八门，全部兼容——
               ① {"answers":[{"idx":0,"answer":"C"}]}（提示词要求的标准形）
               ② [{"idx":0,"answer":"C"}] / [{"no":1,...}]（数组、题号字段名不同）

            if (!pairs || solvedHere === 0) {

              } else {
                failNote = `校验失败: 返回 ${pairs.length} 个答案，但 0 个通过校验`;
              }

            if (e.aborted || (opts.signal && opts.signal.aborted)) {

            console.log(`[解题] 批次 ${batchIdx} 异常: ${e.message}`);

      // 暂停时不再重排 pool，直接跳出
      if (paused) break;
      pool = failed.flat().filter(q => !q.answer);
    }

    return { solved, usage: { ...usage }, cost: +costOf(usage, cfg).toFixed(4), paused, stopReason, lastFailNote };
  }

          }
        }
        const empty = optKeys.filter(l => !String(q.options[l] || '').trim());
        if (empty.length) { err(q.line, `第 ${q.no} 题：选项 ${empty.join('/')} 没有内容，已跳过`); return; }
      }

      // 3) 答案归一
      let answer = null;
      if (type === 'judge') {
        const v = String(q.answerRaw || '').trim();
        if (v) {
          if (JUDGE_YES.test(v)) answer = 'A';
          else if (JUDGE_NO.test(v)) answer = 'B';
          else {
            const L = lettersOf(v);
            if (L && /^[AB]$/.test(L)) answer = L;
            else err(q.line, `第 ${q.no} 题：判断题答案「${v.slice(0, 12)}」无法识别（写 对 / 错），已按缺答案处理`);
          }
        }
      } else if (type === 'fill') {
        const v = String(q.answerRaw || '').replace(/[｜|]{2,}/g, '|||').trim();
        answer = v || null;
      } else {
        const letters = lettersOf(q.answerRaw);
        if (letters) {
          const bad = [...letters].filter(c => !optObj[c]);
          if (bad.length) {
            err(q.line, `第 ${q.no} 题：答案「${letters}」不在选项内（选项只有 ${optKeys.join('/')}），已忽略该答案`);
          } else {
            answer = letters;
            if (type === 'single' && letters.length > 1) type = 'multi'; // 答案多个字母 → 按多选
          }
        }
      }

      // 4) 填空题空数提示（题干空位 vs 答案分空）
      if (type === 'fill' && answer) {
        const blanks = (stem.match(/＿{2,}|_{2,}|（\s*）|\(\s*\)/g) || []).length;
        const parts = answer.split('|||').length;
        if (blanks && parts !== blanks) warn(q.line, `第 ${q.no} 题：题干有 ${blanks} 个空，答案分成 ${parts} 段（多空用 ||| 分隔）`);
      }

      questions.push({
        no: q.no,
        key: secIdx + '-' + q.no,
        secIdx,
        type,
        stem,
        options: type === 'judge' ? { A: '正确', B: '错误' } : (type === 'fill' ? null : optObj),
        answer,
        explanation: q.expLines.join('\n').replace(/\s+/g, ' ').trim() || null,
        _srcLine: q.line
      });
    }

    for (let i = 0; i < lines.length; i++) {
      const ln = i + 1;
      let s = normLine(lines[i]);
      if (!s.trim()) { blankBefore = true; continue; }
      const prevBlank = blankBefore;
      blankBefore = false;

      // ① 结构行：# 章 / ## 节
      //    章 = 单元。写 `# 第一章 xxx` + `## 一、单选题` 时，节标题自动带上章，
      //    题库里才有单元分组（否则只剩「一、单选题」，多章同名小节还会混在一起）
      let m = s.match(/^\s*(#{1,6})\s*(.+?)\s*$/);
      if (m) {
        flush();
        const lvl = m[1].length;
        const raw = m[2].trim();
        // 一级标题：像「第一章 …」的才算单元；否则当文档标题（如题库名），不参与单元前缀
        if (isChapterLine(raw)) curChapter = raw.slice(0, 40);
        else if (lvl === 1) curChapter = null;
        let title = raw;
        if (lvl > 1 && curChapter && !raw.includes(curChapter)
            && !/^第\s*[一二三四五六七八九十\d]+\s*[章节]/.test(raw)) {
          title = (curChapter + ' · ' + raw).slice(0, 70);
        }
        secType = detectSecType(title);
        sections.push({ secIdx: ++secIdx, title, type: secType });
        nextNo = 1;
        continue;
      }

      // ①b 无 # 的结构行：章标题（第一章 …）/ 中文序号题型标题（一、单选题）/
      //     独立题型标题行（单选题）→ 当节处理。章 = 单元，带进节标题里，
      //     否则「第一章 xxx / 一、单选题」只剩「一、单选题」，导入后就没有单元了
      if (isChapterLine(s) || TYPE_TITLE_RE.test(s.trim()) || TYPE_TITLE_NUM_RE.test(s.trim())) {
        flush();
        const raw = s.trim();
        if (isChapterLine(raw)) {
          curChapter = raw.slice(0, 40);
          secType = detectSecType(raw);
          sections.push({ secIdx: ++secIdx, title: curChapter, type: secType });
        } else {
          secType = detectSecType(raw);
          const title = curChapter ? (curChapter + ' · ' + raw).slice(0, 70) : raw;
          sections.push({ secIdx: ++secIdx, title, type: secType });
        }
        nextNo = 1;
        continue;
      }

      // ② 行内标记【…】：题型 / 答案 / 解析——一行里可能连写多个
      //    （Word 里常见「【答案】C  【解析】主磁通…」）。旧版只认行首那一个，
      //    于是「【解析】…」整段留在题干/选项里；更糟的是答案正文里的公式字母
      //    （如「U≈E=4.44fNΦ」里的 E、F）会被当成答案字母，答出「AEF」这种假答案
      let rest = s, forcedType = null, markerOnly = false;
      {
        const MARK_RE = /[【\[]\s*([^】\]]{1,12}?)\s*[】\]]/g;
        const marks = [];
        let mk;
        while ((mk = MARK_RE.exec(s)) !== null) {
          marks.push({ key: mk[1].replace(/\s/g, ''), start: mk.index, bodyStart: MARK_RE.lastIndex });
          if (MARK_RE.lastIndex === mk.index) MARK_RE.lastIndex++;   // 防御：零宽匹配死循环
        }
        if (marks.length) {
          rest = s.slice(0, marks[0].start).trim();                  // 第一个标记之前的文字
          for (let k = 0; k < marks.length; k++) {
            const stop = k + 1 < marks.length ? marks[k + 1].start : s.length;
            const body = s.slice(marks[k].bodyStart, stop).trim();
            const key = marks[k].key;
            if (TYPE_ALIAS[key]) {
              // 首个标记是题型 → 其后的正文继续按题干/选项处理
              if (k === 0) { forcedType = TYPE_ALIAS[key]; rest = (rest ? rest + ' ' : '') + body; }
            } else if (/^(参考答案|正确答案|答案)$/.test(key)) {
              if (cur) { if (cur.answerRaw == null) cur.answerRaw = body; }
              else warn(ln, '答案出现在题目之外，已忽略');
            } else if (/^(答案解析|解析|解释|说明)$/.test(key)) {
              if (cur) cur.expLines.push(body); else warn(ln, '解析出现在题目之外，已忽略');
            } else {
              warn(ln, `未识别的标记「【${key}】」，已忽略标记`);
              rest = (rest ? rest + ' ' : '') + body;
            }
          }
          markerOnly = !rest;   // 整行只有答案/解析标记 → 不是题干行
        }
      }
      if (markerOnly) continue;

      // ③ 题号行（「1. 题干」/「1、题干」/「第1题 题干」；「2.5kV」这类小数点不算题号）
      const qm = rest.match(/^\s*(?:第\s*)?(\d{1,4})\s*(?:题)?\s*[.、．)）](?!\d)\s*([\s\S]*)$/)
        || rest.match(/^\s*第\s*(\d{1,4})\s*题\s*[:：]?\s*([\s\S]*)$/);
      if (qm) {
        const no = +qm[1];
        const body = qm[2].trim();
        const isStart = forcedType != null || !cur || no === nextNo ||
          (cur.answerRaw != null) || cur.optionOrder.length >= 2 ||
          (cur.stemLines.length === 0) ||
          (cur._auto && !cur.optionOrder.length && cur.answerRaw == null && no === cur.no);
        if (isStart) {
          flush();
          startQuestion(no, forcedType, ln);
          if (body) pushStemBody(body);
          continue;
        }
        // 否则视为题干续行（如「2.5kV…」这类以数字开头的换行）
      } else if (forcedType != null) {
        // 只有题型标记、没有题号：新题（题号自动），rest 继续按普通行处理
        flush();
        startQuestion(null, forcedType, ln);
      }

      // ④ 选项行（含「A.甲  B.乙  C.丙」一行多选项的写法）
      const om = rest.match(/^\s*([A-Ha-hＡ-Ｈ])\s*[.、．)）:：]\s*([\s\S]+)$/);
      if (om && cur) {
        const letter = FULL_LETTER[om[1]] || om[1].toUpperCase();
        const content = om[2].trim();
        // 一行多选项（Word 里最常见）：字母从「下一个期望的字母」起连续、每段都有内容 → 采纳
        const parts = splitInlineOptions(rest);
        if (parts && parts.length >= 2) {
          let expect = cur.optionOrder.length
            ? String.fromCharCode(cur.optionOrder[cur.optionOrder.length - 1].charCodeAt(0) + 1) : 'A';
          let ok = true;
          for (const p of parts) {
            if (p.letter !== expect || !p.content || cur.options[p.letter] != null) { ok = false; break; }
            expect = String.fromCharCode(expect.charCodeAt(0) + 1);
          }
          if (ok) {
            for (const p of parts) { cur.optionOrder.push(p.letter); cur.options[p.letter] = p.content; }
            continue;
          }
        }
        // 题干里「A、B两系统互联…（ ）」式误判：内容含空括号且较长 → 当题干
        if (BLANK_RE.test(content) && content.replace(/\s/g, '').length > 10) {
          pushStemBody(rest);
          continue;
        }
        if (!cur.optionOrder.length && letter !== 'A') { cur.optionRejected = true; warn(ln, `选项必须从 A 开始，「${letter}.」已忽略`); continue; }
        if (cur.options[letter] != null) { cur.optionRejected = true; warn(ln, `选项 ${letter} 重复出现，已忽略后一个`); continue; }
        cur.optionOrder.push(letter);
        cur.options[letter] = content;
        continue;
      }

      // ⑤ 答案行
      const am = rest.match(/^\s*(?:参考答案|正确答案|答案|答)\s*[:：]\s*([\s\S]*)$/);
      if (am) {
        if (!cur) warn(ln, '答案出现在题目之外，已忽略');
        else if (cur.answerRaw != null) warn(ln, `第 ${cur.no} 题出现多个答案行，以第一个为准`);
        else cur.answerRaw = am[1].trim();
        continue;
      }

      // ⑥ 解析行
      const em = rest.match(/^\s*(?:答案解析|解析|解释|说明)\s*[:：]?\s*([\s\S]*)$/);
      if (em) {
        if (cur) cur.expLines.push(em[1].trim());
        else warn(ln, '解析出现在题目之外，已忽略');
        continue;
      }

      // ⑦ 题干内联答案（兼容「题干…（答案：A）。」）—— 交由 pushStemBody 统一处理
      // ⑧ 普通文字：可能是新题（最简写法：无题号、无标记），否则并入题干/解析
      if (cur) {
        const finished = cur.answerRaw != null || cur.optionOrder.length >= 2;
        // 新题的判据：上一题已收尾 + 这行像题干 + （前面有空行 或 还没写解析 或 行内有空位/问号）
        const canStartNew = finished && bareStem(rest) &&
          (prevBlank || !cur.expLines.length || BLANK_RE.test(rest) || /[？?]\s*$/.test(rest));
        if (canStartNew) {
          flush();
          startQuestion(null, null, ln);
          pushStemBody(rest);
          continue;
        }
        if (cur.answerRaw != null) cur.expLines.push(rest.trim());
        else pushStemBody(rest);
      } else if (bareStem(rest)) {
        startQuestion(null, null, ln);
        pushStemBody(rest);
      } else {
        warn(ln, `题目之外的文字（疑似标题/前言），已忽略：「${rest.trim().slice(0, 24)}」`);
      }
    }
    flush();

    const byType = { single: 0, multi: 0, judge: 0, fill: 0 };
    for (const q of questions) byType[q.type]++;
    const missing = questions.filter(q => !q.answer).length;
    return {
      questions, errors, warns, sections,
      stats: {
        total: questions.length, byType, missing,
        answered: questions.length - missing,
        explained: questions.filter(q => q.explanation).length,
        errors: errors.length, warns: warns.length, sections: sections.length
      }
    };
  }

  /* ================= 序列化（题库 / 转换结果 → 范式文本） ================= */

  function secIdxOf(q) {
    if (q.secIdx != null) return q.secIdx;
    const k = String(q.key || '');
    const i = parseInt(k.split('-')[0], 10);
    return Number.isFinite(i) ? i : 0;
  }

  function serialize(questions, sections, opts = {}) {
    const list = [...questions].sort((a, b) => (secIdxOf(a) - secIdxOf(b)) || ((a.no ?? 0) - (b.no ?? 0)));
    const secMap = new Map((sections || []).map(s => [s.secIdx, s.title]));
    const out = [];
    if (opts.title) out.push('# ' + opts.title, '');
    let lastSec = null, lastChap = null;
    for (const q of list) {
      const si = secIdxOf(q);
      if (si !== lastSec) {
        const t = secMap.get(si);
        if (t) {
          // 「第一章 磁路及变压器 · 一、单选题」→ 章单独写一行，节标题回到「一、单选题」。
          // 解析时会把章再拼回节标题（题库里就有单元了），文本也更接近 Word 大纲的样子
          const mm = t.match(/^(第\s*[一二三四五六七八九十\d]+\s*章[^·]*?)\s*·\s*(.+)$/);
          if (mm) {
            const chap = mm[1].trim();
            if (chap !== lastChap) { out.push('# ' + chap, ''); lastChap = chap; }
            out.push('## ' + mm[2].trim(), '');
          } else {
            out.push('## ' + t, '');
            lastChap = null;
          }
        }
        lastSec = si;
      }
      const head = `【${TYPE_LABEL[q.type] || '填空'}】${q.no != null ? q.no + '. ' : ''}${cleanStem(q.stem)}`;
      out.push(head);
      if (q.options && q.type !== 'judge') {
        for (const k of Object.keys(q.options).sort()) out.push(`${k}. ${q.options[k]}`);
      }
      if (q.type === 'judge') {
        const ansText = q.answer === 'A' ? '对' : q.answer === 'B' ? '错' : '';
        out.push('答案：' + ansText + (q.aiAnswer ? '（AI 解答·需核对）' : ''));
      } else {
        out.push('答案：' + (q.answer || '') + (q.answer && q.aiAnswer ? '（AI 解答·需核对）' : ''));
      }
      if (q.explanation) out.push('解析：' + String(q.explanation).replace(/\s+/g, ' ').trim());
      out.push('');
    }
    return out.join('\n');
  }

  /* 题干清洗：单行化 + 去掉转换残留的尾部「答案：」「（答案：）」空壳
     （旧格式文档里「题干。\n答案：」这种断行会让答案行落进题干） */
  function cleanStem(s) {
    return String(s == null ? '' : s)
      .replace(/\s*\n\s*/g, ' ')
      .replace(/\s*[（(]?\s*(?:参考答案|正确答案|答案)\s*[:：]?\s*[)）]?\s*$/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* 题库 → 范式文本 */
  function fromQuestions(questions, sections, opts = {}) {
    return serialize(questions || [], sections || [], opts);
  }

  /* ================= Word 转换器：任意文档 → 范式文本 =================
     复用成熟的本地解析流水线（cleanText → splitQuestions → parseOneQuestion），
     再按 章/节/题号 做一次本地答案匹配；匹配不到的题答案留空（写「答案：」），
     由用户在文本框里手动补「答案：」行。全程零 API 调用。 */

  /* 文本里是否已经带范式特征（题型标记 或 行首答案行） */
  const CANON_MARK_RE = /[【\[]\s*(?:单选|多选|判断|填空|选择|简答|问答|名词解释|计算|论述)题?\s*[】\]]/;
  const CANON_ANS_RE = /^[ \t　]*(?:参考答案|正确答案|答案)\s*[:：]/m;

  function convert(text) {
    if (typeof Extractor === 'undefined') throw new Error('转换器需要 Extractor 模块');
    const src = String(text || '').replace(/\r\n?/g, '\n').trim();

    const clean = Extractor.cleanText(src);
    const split = Extractor.splitQuestions(clean);
    const qs = [];
    for (const it of split.items) {
      const q = Extractor.parseOneQuestion(it.no, it.text, it.type, it.key);
      if (q && q.stem) { q.secIdx = it.secIdx; qs.push(q); }
    }

    /* 已经是范式（带题型标记 / 行首答案行）且范式解析出的题数不少于旧管线
       → 原样保留，不再二次拆改：转换幂等、反复转换不会把范式拆坏。
       注意：只有「题型标记」才能无条件认定；仅凭「答案：」行时还要求范式解析
       零错误且确实解析出答案，否则旧格式文档（题末答案表）会被误当范式吞掉 */
    const marked = CANON_MARK_RE.test(src);
    if (marked || CANON_ANS_RE.test(src)) {
      const pre = parse(src);
      // 带题型标记 = 明确是范式文本 → 一律原样保留（哪怕有格式错误，也交给「解析预览」
      // 逐条报错，绝不二次拆改用户自己写的文本）
      const ok = marked || (pre.stats.total > 0 && pre.stats.total >= qs.length &&
        pre.errors.length === 0 && pre.stats.answered > 0);
      if (ok) {
        return {
          text: src + '\n',
          stats: {
            total: pre.stats.total, byType: pre.stats.byType, missing: pre.stats.missing,
            answered: pre.stats.answered, explained: pre.stats.explained, filled: 0,
            sections: pre.stats.sections
          },
          problems: [], passthrough: true,
          errors: pre.errors, warns: pre.warns
        };
      }
    }

    // 文末答案表 / 逐行答案条目：按 章/节/题号 本地匹配（无 AI）
    let filled = 0;
    if (typeof LLM !== 'undefined' && qs.length) {
      try {
        const parsed = LLM.parseAnswerDocument(clean);
        if (parsed.entries.length || parsed.ordered.length) {
          const r = LLM.matchAnswersStructured(qs, split.sections, parsed);
          filled = r.filled;
        }
      } catch (e) { /* 答案表匹配失败不影响转换 */ }
    }
    const text2 = serialize(qs, split.sections);
    const missing = qs.filter(q => !q.answer).length;
    const byType = { single: 0, multi: 0, judge: 0, fill: 0 };
    for (const q of qs) byType[q.type]++;
    // explained = 最终带解析的题数（内嵌「解析：…」「【解析】…」与答案表里的解析都算），
    // 让界面能明确显示「解析 402」，而不是永远 0（用户会以为解析丢了）
    const explainedCnt = qs.filter(q => q.explanation).length;
    return {
      text: text2,
      stats: {
        total: qs.length, byType, missing, answered: qs.length - missing,
        filled, explained: explainedCnt, sections: split.sections.length
      },
      problems: split.problems || []
    };
  }

  /* ================= 范式文本 → .docx（零依赖：自建最小 ZIP，Word / WPS 可直接打开） =================
     只写三个必需部件：[Content_Types].xml / _rels/.rels / word/document.xml。
     ZIP 用「存储（不压缩）」+ 自算 CRC32——Word 完全接受，代价只是体积略大。
     每行一个段落、整行照抄（连 `# 章`、`答案：X` 都原样保留），
     保证「导出 Word → 用『载入文件』导回」内容一字不差（mammoth 抽文字后仍是范式）。 */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* 最小 ZIP：全部用 store（method 0），无压缩、无时间戳依赖 */
  function zipStore(files) {
    const enc = new TextEncoder();
    const u16 = v => [v & 255, (v >>> 8) & 255];
    const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = f.data;
      const crc = crc32(data);
      const local = new Uint8Array([
        ...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x0021),
        ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)
      ]);
      parts.push(local, name, data);
      central.push(new Uint8Array([
        ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x0021),
        ...u32(crc), ...u32(data.length), ...u32(data.length),
        ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)
      ]), name);
      offset += local.length + name.length + data.length;
    }
    const cdSize = central.reduce((s, c) => s + c.length, 0);
    parts.push(...central, new Uint8Array([
      ...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
      ...u32(cdSize), ...u32(offset), ...u16(0)
    ]));
    const total = parts.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(total);
    let p = 0;
    for (const c of parts) { out.set(c, p); p += c.length; }
    return out;
  }

  const xmlEsc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    // 去掉 XML 1.0 不允许的控制字符（Word 会判定文档损坏）
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

  /* 范式文本 → .docx 字节（Uint8Array） */
  function buildDocx(text, opts = {}) {
    const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    const ps = lines.map(line => {
      const t = line.replace(/\t/g, '    ');
      if (!t.trim()) return '<w:p/>';
      // 章/节标题与「答案/解析」整行加粗，纯为阅读观感；文本内容一字不改，导回时仍是范式
      const bold = /^#{1,6}\s/.test(t) || /^\s*(?:参考答案|正确答案|答案|解析)\s*[:：]/.test(t);
      const rPr = bold ? '<w:rPr><w:b/></w:rPr>' : '';
      return `<w:p><w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r></w:p>`;
    }).join('');
    const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
      + ps
      + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'
      + '<w:pgMar w:top="1440" w:right="1080" w:bottom="1440" w:left="1080"/></w:sectPr>'
      + '</w:body></w:document>';
    const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '</Types>';
    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
      + '</Relationships>';
    const enc = new TextEncoder();
    return zipStore([
      { name: '[Content_Types].xml', data: enc.encode(ct) },
      { name: '_rels/.rels', data: enc.encode(rels) },
      { name: 'word/document.xml', data: enc.encode(doc) }
    ]);
  }

  return { SPEC, template, parse, fromQuestions, convert, buildDocx, TYPE_ALIAS, TYPE_LABEL };
})();

  <script>
/* ========== 答题会话逻辑 ========== */
class QuizSession {
  /**
   * @param questions 题目数组
   * @param opts {shuffle:false, mode:'normal'|'wrong', exam:false, minutes:0, deadline:0}
   * 考试模式：作答时只记答案不判分（不显示对错），交卷后 grade() 统一判分并写答题记录
   */
  constructor(questions, opts = {}) {
    this.all = questions;
    this.opts = opts;
    this.list = opts.shuffle ? this._shuffle([...questions]) : [...questions];
    this.index = 0;
    this.answered = new Map(); // qid -> {userAnswer, correct, q, answer, explanation}
    this.startTime = Date.now();

    this.exam = !!opts.exam;
    this.minutes = opts.minutes || 0;      // 考试时长（分钟），0 = 不限时
    this.deadline = opts.deadline || (this.exam && this.minutes ? Date.now() + this.minutes * 60000 : 0);
    this.examAnswers = new Map();          // 考试模式：qid -> 用户答案（尚未判分）
    this.graded = false;
    this.recite = false;                   // 背题模式：直接看答案、不用作答（仅学习类会话）
  }

  _shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  get current() { return this.list[this.index]; }
  get total() { return this.list.length; }
  get pos() { return this.index + 1; }
  get finished() { return this.index >= this.list.length; }
  /** 考试中（未交卷）：答题中，不反馈对错 */
  get inExam() { return this.exam && !this.graded; }

  get progress() {
    if (this.inExam) {
      return { total: this.list.length, done: this.examAnswers.size, correct: 0, wrong: 0 };
    }
    const answered = [...this.answered.values()];
    return {
      total: this.list.length,
      done: answered.length,
      correct: answered.filter(a => a.correct).length,
      wrong: answered.filter(a => !a.correct).length
    };
  }

  /* ---- 填空题判分：宽松比对（去空白/标点） ---- */
  static normalizeFill(s) {
    if (s == null) return '';
    return String(s).replace(/[\s，。、；：""''？！,.;:'"?!（）()【】\[\]]/g, '').toLowerCase();
  }

  static checkFill(userAns, stdAns) {
    const uParts = String(userAns).split('|||').map(QuizSession.normalizeFill);
    const sParts = String(stdAns).split('|||').map(QuizSession.normalizeFill);
    if (uParts.length !== sParts.length) {
      // 用户没按格式分空，尝试整体比对
      return QuizSession.normalizeFill(userAns) === QuizSession.normalizeFill(stdAns);
    }
    return uParts.every((u, i) => u === sParts[i]);
  }

  /* ---- 判分（学习模式与考试交卷共用） ---- */
  static judge(q, userAnswer) {
    if (q.type === 'fill') return QuizSession.checkFill(userAnswer, q.answer);
    const norm = s => String(s).toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
    return norm(userAnswer) === norm(q.answer);
  }

  /* ---- 提交答案（学习模式：立即判分并写记录） ---- */
  submit(userAnswer) {
    const q = this.current;
    if (!q || this.answered.has(q.id)) return null;
    // 缺标准答案：不判分（由用户先在 ✎ 里补答案），交给页面提示
    if (!q.answer) return { noAnswer: true };

    const correct = QuizSession.judge(q, userAnswer);
    // 连答案/解析一起存下来：翻回上一题时才能原样显示（否则只剩 userAnswer/correct）
    this.answered.set(q.id, { userAnswer, correct, q, answer: q.answer, explanation: q.explanation });
    DB.recordAdd({
      questionId: q.id,
      bankId: q.bankId,
      userAnswer: String(userAnswer),
      correct
    });
    return { correct, answer: q.answer, explanation: q.explanation };
  }

  /* ---- 考试模式：只记答案，不判分、不写记录 ---- */
  answer(userAnswer) {
    const q = this.current;
    if (!q) return null;
    this.examAnswers.set(q.id, String(userAnswer));
    return { saved: true };
  }

  /* ---- 交卷：统一判分 + 写答题记录（只记已作答的题，未答不计入答题量） ---- */
  grade() {
    if (this.graded) return this.result();
    for (const q of this.list) {
      const ua = this.examAnswers.get(q.id);
      if (ua == null || ua === '') continue;
      const correct = q.answer ? QuizSession.judge(q, ua) : false;
      this.answered.set(q.id, { userAnswer: ua, correct, q, answer: q.answer, explanation: q.explanation });
      DB.recordAdd({ questionId: q.id, bankId: q.bankId, userAnswer: String(ua), correct });
    }
    this.graded = true;
    return this.result();
  }

  /* ---- 成绩单 ---- */
  result() {
    const vals = [...this.answered.values()];
    const correct = vals.filter(v => v.correct).length;
    return {
      total: this.list.length,
      answered: vals.length,
      correct,
      wrong: vals.length - correct,
      unanswered: this.list.length - vals.length,
      acc: this.list.length ? Math.round(correct / this.list.length * 100) : 0,
      timeUsed: Math.max(0, Math.round((Date.now() - this.startTime) / 1000))
    };
  }

  /* ---- 未答或答错的题（交卷后速览 / 重做用） ---- */
  wrongList() {
    return this.list
      .map(q => ({ q, a: this.answered.get(q.id) }))
      .filter(x => !x.a || !x.a.correct)
      .map(x => ({ ...x, userAnswer: x.a ? x.a.userAnswer : (this.examAnswers.get(x.q.id) || null) }));
  }

  next() { this.index++; return !this.finished; }
  jump(i) { if (i >= 0 && i < this.list.length) this.index = i; }

  /* ---- 断点续做：序列化（只存 id 序列 + 进度，题目本身在库里） ---- */
  serialize() {
    return {
      ids: this.list.map(q => q.id),
      index: this.index,
      // 已答的题存 id->结果，恢复时从库里取题重建（否则续做后对错/成绩会丢）
      answered: [...this.answered.entries()].map(([qid, v]) => [qid, { userAnswer: v.userAnswer, correct: v.correct }]),
      exam: this.exam,
      minutes: this.minutes,
      deadline: this.deadline || 0,
      graded: this.graded,
      recite: !!this.recite,
      examAnswers: [...this.examAnswers.entries()]
    };
  }
  /* ---- 反序列化：查库重建 ---- */
  static async restore(data) {
    const qs = [];
    for (const id of data.ids) {
      const q = await DB.questionGet(id);
      if (q) qs.push(q);
    }
    const s = new QuizSession(qs, { shuffle: false, exam: data.exam, minutes: data.minutes, deadline: data.deadline });
    s.index = Math.min(data.index || 0, Math.max(0, qs.length - 1));
    s.graded = !!data.graded;
    s.recite = !!data.recite;
    for (const [qid, ua] of (data.examAnswers || [])) s.examAnswers.set(qid, ua);
    for (const [qid, v] of (data.answered || [])) {
      const q = qs.find(x => x.id === qid);
      if (q) s.answered.set(qid, { userAnswer: v.userAnswer, correct: v.correct, q, answer: q.answer, explanation: q.explanation });
    }
    return s;
  }
}

/* ---- 构建会话的辅助 ---- */
const QuizBuilder = {
  /** 从多个题库构建：filterType 筛题型；secKeys 筛章节（"bankId:secIdx"，空 = 全部章节） */
  async fromBanks(bankIds, { shuffle = false, filterType = 'all', secKeys = null, exam = false, minutes = 0 } = {}) {
    let qs = [];
    for (const id of bankIds) {
      const list = await DB.questionsByBank(id);
      qs.push(...list);
    }
    if (secKeys && secKeys.size) {
      qs = qs.filter(q => secKeys.has(q.bankId + ':' + (q.secIdx ?? '')));
    }
    if (filterType !== 'all') {
      // 支持组合："choice|answered" / "fill|answered" / "answered"
      const parts = String(filterType).split('|');
      if (parts.includes('answered')) qs = qs.filter(q => q.answer);
      if (parts.includes('choice')) qs = qs.filter(q => q.type === 'single' || q.type === 'multi' || q.type === 'judge');
      else if (parts.includes('fill')) qs = qs.filter(q => q.type === 'fill');
    }
    return new QuizSession(qs, { shuffle, exam, minutes });
  },

  /** 错题重做 */
  async wrongRedo() {
    const qs = await DB.wrongQuestions();
    return new QuizSession(qs, { shuffle: true, mode: 'wrong' });
  },

  /** 从指定题单重练（考试交卷后的错题重做等） */
  fromQuestions(questions, opts = {}) {
    return new QuizSession(questions, opts);
  }
};

/* ========== 主应用：hash 路由 + 页面渲染 ========== */
const App = (() => {
  const VERSION = '1.8.2'; // 与 apk-src/app/build.gradle 的 versionName 保持一致
  let session = null; // 当前答题会话

  const $view = () => document.getElementById('view');
  const $topbar = () => document.getElementById('topbar');
  const $tabbar = () => document.getElementById('tabbar');

  /* ================= 路由 ================= */
  const routes = {
    '': pageHome, 'home': pageHome,
    'canon': pageCanon,
    'import': pageImport,
    'answers': pageAnswers,
    'bank': pageBankQuestions,
    'recycle': pageRecycle,
    'quiz-setup': pageQuizSetup,
    'quiz': pageQuiz,
    'quiz-result': pageQuizResult,
    'wrong': pageWrong,
    'star': pageStar,
    'search': pageSearch,
    'history': pageHistory,
    'stats': pageStats,
    'me': pageMe,
    'settings': pageSettings
  };

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, ...params] = h.split('/');
    return { path: path || 'home', params };
  }

  function navigate(hash) { location.hash = hash; }

  /* ---- 后台保活桥（第二期）：AI 长任务进行时拉起 Android 前台服务——
     锁屏后进程不被冻结/杀掉，通知栏实时进度，结束自动撤通知释放唤醒锁。
     仅 APK 内生效（AndroidBridge 注入时）；浏览器/单文件版全部静默 no-op。 ---- */
  const BG = {
    on() {
      try { return typeof AndroidBridge !== 'undefined' && AndroidBridge.isAvailable(); }
      catch (e) { return false; }
    },
    start(text) { if (BG.on()) try { AndroidBridge.keepAliveStart(text || '任务进行中'); } catch (e) {} },
    update(text) { if (BG.on()) try { AndroidBridge.keepAliveUpdate(text); } catch (e) {} },
    stop() { if (BG.on()) try { AndroidBridge.keepAliveStop(); } catch (e) {} }
  };

  /* ---- 全局任务中心（v1.7.1）：AI 长任务的"仪表盘" ----
     病根：进度只写在当前页局部 DOM 上，切个页就随视图销毁；流式只给"已生成 X 字"的字数。
     做法：面板直接挂在 body（不在 #view 内），换页/锁屏回来都常驻可见；
     进度条 + 耗时 + 实时流式输出（真实内容，非字数）一键展开；
     通知栏（BG）由这里统一 start/update/stop，各任务不再各管一套。 ---- */
  const TC = {
    wrap: null, t0: 0, tick: null, title: '',
    ensure() {
      if (this.wrap && document.body.contains(this.wrap)) return;
      const w = document.createElement('div');
      w.id = 'tc-panel';
      w.style.cssText = 'position:fixed;left:12px;right:12px;bottom:78px;z-index:97;display:none;pointer-events:none;';
      w.innerHTML =
        '<div style="pointer-events:auto;background:#202634;color:#e8eaf0;border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13px;line-height:1.5;">' +
          '<div style="display:flex;align-items:center;gap:8px;min-width:0;">' +
            '<span data-tc-icon style="flex:none;">⏳</span>' +
            '<b data-tc-title style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></b>' +
            '<span data-tc-time style="flex:none;color:#8b93a7;font-variant-numeric:tabular-nums;">0:00</span>' +
            '<button data-tc-toggle style="flex:none;border:0;border-radius:6px;padding:2px 8px;background:#313a4d;color:#cfd6e4;font-size:12px;">输出</button>' +
          '</div>' +
          '<div style="height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin:8px 0 6px;overflow:hidden;">' +
            '<div data-tc-bar style="height:100%;width:0;background:#4f8cff;transition:width .3s;"></div>' +
          '</div>' +
          '<div data-tc-note style="color:#aab2c5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.2em;"></div>' +
          '<pre data-tc-out style="display:none;max-height:170px;overflow:auto;margin:8px 0 0;padding:8px;background:#161b26;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;color:#a8e0a8;"></pre>' +
        '</div>';
      document.body.appendChild(w);
      this.wrap = w;
      w.querySelector('[data-tc-toggle]').onclick = () => {
        const out = w.querySelector('[data-tc-out]');
        out.style.display = out.style.display === 'none' ? 'block' : 'none';
        if (out.style.display === 'block') out.scrollTop = out.scrollHeight;
      };
    },
    q(sel) { return this.wrap ? this.wrap.querySelector(sel) : null; },
    start(title) {
      this.ensure();
      this.title = title;
      const q = s => this.q(s);
      q('[data-tc-title]').textContent = title;
      q('[data-tc-icon]').textContent = '⏳';
      q('[data-tc-bar]').style.width = '0%';
      q('[data-tc-note]').textContent = '准备中…';
      q('[data-tc-out]').textContent = '';
      q('[data-tc-time]').textContent = '0:00';
      this.wrap.style.display = 'block';
      clearInterval(this.tick);
      this.t0 = Date.now();
      this.tick = setInterval(() => {
        const s = Math.round((Date.now() - this.t0) / 1000);
        const el = this.q('[data-tc-time]');
        if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      }, 1000);
      BG.start(title); // 通知栏同步：任务开始即拉前台服务
    },
    set(done, total, note) {
      if (!this.wrap) return;
      if (total) this.q('[data-tc-bar]').style.width = Math.min(100, Math.round(done / total * 100)) + '%';
      if (note != null) this.q('[data-tc-note]').textContent = note;
      BG.update(`${this.title} · ${done}/${total}${note ? ' · ' + note : ''}`);
    },
    note(text) { if (this.wrap && text != null) this.q('[data-tc-note]').textContent = text; },
    /* 流式实时输出：显示真实内容（末尾 1500 字），用户上翻查看时不抢滚动条 */
    delta(acc) {
      if (!this.wrap) return;
      const out = this.q('[data-tc-out]');
      acc = acc || '';
      const tail = acc.length > 1500 ? '…' + acc.slice(-1500) : acc;
      const stick = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      out.textContent = tail || '（等待模型输出…）';
      if (stick) out.scrollTop = out.scrollHeight;
      // v1.7.3：acc 为空 = 重试后清屏，此时不覆盖 note——保留「第 N/4 次重试 · 原因」提示
      if (acc) this.note(`流式生成中 · 已 ${acc.length} 字`);
    },
    finish(ok, summary) {
      if (!this.wrap) return;
      clearInterval(this.tick);
      this.q('[data-tc-icon]').textContent = ok ? '✓' : '⚠';
      this.q('[data-tc-note]').textContent = summary || '';
      this.q('[data-tc-bar]').style.width = '100%';
      BG.stop(); // 通知栏撤了；面板保留 8 秒让人看清结果再自动收起
      setTimeout(() => { if (this.wrap) this.wrap.style.display = 'none'; }, 8000);
    }
  };

  /* ---- 逐批入库器（v1.7.1）：每片范式文本一到手就解析入库，不等整份转完 ----
     「等了半天题库还是空的」的病根就是旧版全部转/识别完才统一入库，
     中途网络一抖、解析一挂，全白等。现在第 1 片转完题库列表马上就有题；

  function pieceSaver(name, source) {
    let bank = null, total = 0, noAns = 0, sections = [], loose = [];

      if (!bank) {
        bank = { id: DB.uid(), name, createdAt: Date.now(), count: 0, source, sections: null };
        await DB.bankAdd(bank);
      }
      r.questions.forEach(q => { delete q._srcLine; q.bankId = bank.id; });
      await DB.questionAddMany(r.questions);
      total += r.questions.length;
      noAns += r.questions.filter(q => !q.answer).length;
      if (r.sections && r.sections.length) sections.push(...r.sections);
      bank.count = total;
      bank.sections = sections.length ? sections : null;
      await DB.bankAdd(bank); // 覆盖写：题库列表的题数实时在涨
    };
    return {
      add: async piece => {
        if (!piece) return 0;
        let r = null;
        try { r = Canon.parse(piece); } catch (e) { r = null; }
        if (!r || !r.questions.length) { loose.push(piece); return 0; }
        await insert(r);
        return r.questions.length;
      },
      /* 收尾：没解析出题的片合并起来最后再试一次；返回这轮补入的题数 */
      flush: async () => {
        if (!loose.length) return 0;
        let r = null;
        try { r = Canon.parse(loose.join('\n\n')); } catch (e) { r = null; }
        loose = [];
        if (r && r.questions.length) { await insert(r); return r.questions.length; }
        return 0;
      },

  }

    const { path, params } = parseHash();
    clearExamTimer();   // 离开答题页就停掉倒计时，避免计时器写已移除的 DOM
    const page = routes[path] || pageHome;
    const tabs = ['home', 'quiz-setup', 'wrong', 'stats', 'me'];
    const active = tabs.includes(path) ? path
      : path.startsWith('quiz') ? 'quiz-setup'
      : path === 'star' ? 'wrong'
      : path === 'history' ? 'stats'
      : path === 'settings' ? 'me'
      : 'home';
    renderTabbar(active);
    page(params);
    window.scrollTo(0, 0);

  /* ---- 文件小工具（浏览器 / APK 通用） ---- */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        const url = fr.result || '';
        const i = url.indexOf(',');
        resolve(i >= 0 ? url.slice(i + 1) : '');
      };
      fr.onerror = () => reject(fr.error || new Error('读取失败'));
      fr.readAsDataURL(blob);
    });
  }

  /* 保存二进制文件（Blob）：APK 走 JS 桥接写系统 Download 目录，浏览器走 <a download> */
  async function saveBlobFile(fileName, blob) {
    const bridge = typeof window !== 'undefined' && window.AndroidBridge;
    const isApk = bridge && typeof bridge.isAvailable === 'function' && bridge.isAvailable();
    if (isApk) {
      const b64 = await blobToBase64(blob);
      if (!b64) throw new Error('文件内容为空');
      const res = ('' + (bridge.saveFile(fileName, b64) || '')).trim();
      if (res.startsWith('OK:')) return { path: res.slice(3) };
      if (res.startsWith('NEED_PERMISSION:')) throw new Error(res.slice(16) + '（授予后再点一次）');
      throw new Error(res || '原生保存失败');
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(a.href);
    return { path: fileName };
  }

  /* 保存文本文件 */
  async function saveTextFile(fileName, text, mime = 'text/plain') {
    return saveBlobFile(fileName, new Blob([text], { type: mime + ';charset=utf-8' }));
  }

  /* 保存范式 .docx（Canon.buildDocx → Uint8Array） */
  async function saveDocxFile(fileName, text) {
    const bytes = Canon.buildDocx(text);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    return saveBlobFile(fileName, blob);
  }

  /* 读任意题库文件为纯文本（.txt/.md 直读；DOCX 走提取器） */
  async function readAnyText(file) {

    if (/\.(txt|md|markdown|text)$/.test(n)) return await file.text();
    return await Extractor.extract(file);
  }

  /* ---- 文件 → 范式文本：本地抽文字（免费）→ 已是范式就直接用 → 否则 AI 只做排版 ----
     AI 只负责「重排格式」，答案一律从原卷照抄，不做题：产物丢给本地 Canon.parse 预览后导入 */
  async function aiCanonFromFiles(files, ui = {}) {
    const say = ui.onStatus || (() => {});
    const prog = ui.onProgress || (() => {});
    const texts = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      say(`提取文字 ${i + 1}/${files.length}：${f.name}（本地解析，不花 API）…`);
      const raw = await Extractor.extract(f, (p, t) => say(`提取 ${f.name}：${p}/${t} 页`));
      texts.push(Extractor.cleanText(raw));
    }
    const raw = texts.join('\n\n').trim();
    if (raw.replace(/\s/g, '').length < 50) throw new Error('没提取到文字（可能是图片型 / 扫描件文件，请改用含可复制文字的文档）');
    const local = Canon.convert(raw);
    if (local.passthrough) {
      say('✓ 这份文档已经是范式格式，直接使用（0 次 API 调用）');
      prog(1);
      return local.text;
    }
    /* v1.7.3：先走「AI 只出标注」快速通道（输出量零头，快 5~10 倍）；
       标注路线没走通再退回全量重排。两条路产物都是范式文本，交给下方预览页人工核对 */
    const liteRetry = (att, cool, why) => say(`第 ${att}/4 次重试 · ${why || '网络波动'}${cool > 0 ? `，冷却 ${cool}s` : ''}`);
    let text = '';
    try {
      text = await LLM.fileToCanonLite(raw, {
        onProgress: (done, total, note) => {
          prog(total ? done / total : 0);
          say(`AI 标注转换中：${note || ''} · AI 只出定位和答案，题干本地照抄`);
        },
        onRetry: liteRetry,
        onDelta: ui.onDelta || null
      });
      say('✓ 快速通道完成 · 请核对下方范式（题干为原文照抄）');
    } catch (e) {
      console.warn('标注快速通道失败，退回全量重排：', e);
    }
    if (!text) {
      text = await LLM.fileToCanon(raw,
        (done, total, note) => {
          prog(total ? done / total : 0);
          say(`AI 转换中：${note || ''} · 只做排版，答案从原卷照抄`);
        },
        liteRetry,
        ui.onDelta || null);
    }
    prog(1);
    return text;
  }

  /* 复制到剪贴板（APK WebView 可能没有 clipboard API，降级用临时 textarea） */
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* 降级 */ }
    try {
      const t = document.createElement('textarea');
      t.value = text;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(t);
      return ok;
    } catch (e) { return false; }
  }
