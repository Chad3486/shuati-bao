  <script>
/* ========== LLM 解析引擎（OpenAI 兼容接口） ========== */
const LLM = (() => {

  const DEFAULT_CONFIG = {
    baseUrl: 'https://api.deepseek.com/v1',
    apiKey: '',
    model: 'deepseek-chat',
    temperature: 0.1,
    concurrency: 4
  };

  async function getConfig() {
    const saved = await DB.metaGet('llmConfig');
    return Object.assign({}, DEFAULT_CONFIG, saved || {});
  }
  async function saveConfig(cfg) {
    await DB.metaSet('llmConfig', cfg);
  }

  /* ---- 单次 chat 调用 ---- */
  async function chat(messages, { onRetry, raw = false } = {}) {
    const cfg = await getConfig();
    if (!cfg.apiKey) throw new Error('请先在「设置」中配置 API Key');

    const url = cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions';
    const payload = { model: cfg.model, messages, temperature: cfg.temperature, max_tokens: 8192 };
    if (!raw) {
      // 要求 JSON 输出（兼容不同实现；DeepSeek 要求提示词含 'json' 才能启用）
      payload.response_format = { type: 'json_object' };
    }
    const body = JSON.stringify(payload);

    const maxRetry = 4;
    let lastErr = null;
    for (let attempt = 0; attempt <= maxRetry; attempt++) {
      try {
        // 全局限流阀：上一请求撞 429 时，先等冷却结束再发
        const wait = _throttleUntil - Date.now();
        if (wait > 0) await new Promise(r => setTimeout(r, wait));
        // 请求级超时：手机网络弱时 fetch 可能挂起几分钟，90s 强制断开重试
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort('timeout'), 90000);
        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cfg.apiKey
          },
          body,
          signal: ctl.signal
        });
        clearTimeout(timer);
        if (!resp.ok) {
          if (resp.status === 429) {
            // 撞限流：读 Retry-After（秒），无头默认 15s；整段冷却时间翻倍逐次递增
            const ra = parseInt(resp.headers.get('retry-after'), 10);
            const cool = (ra > 0 ? ra * 1000 : 15000) * (attempt + 1);
            _throttleUntil = Date.now() + cool;
            if (onRetry) onRetry(attempt + 1, Math.round(cool / 1000));
            lastErr = new Error('API 429 限流');
            continue;
          }
          const errText = await resp.text().catch(() => '');
          throw new Error(`API ${resp.status}: ${errText.slice(0, 300)}`);
        }
        const data = await resp.json();
        const content = data.choices?.[0]?.message?.content;
        if (!content) throw new Error('API 返回为空');
        return content;
      } catch (e) {
        lastErr = e;
        // 网络错误 / 超时 / 5xx → 重试；400/401/403/404 配置错误直接抛
        if (/API (400|401|403|404)/.test(e.message)) throw e;
        if (attempt < maxRetry) {
          if (onRetry) onRetry(attempt + 1, 0);
          // 弱网退避：3s 起步逐次加长，给手机网络恢复时间
          await new Promise(r => setTimeout(r, 3000 * (attempt + 1)));
        }
      }
    }
    const isNet = /Failed to fetch|NetworkError|timeout|aborted|network/i.test(lastErr?.message || '');
    throw new Error(isNet
      ? `网络连不上 API（已重试 ${maxRetry} 次）：请检查手机网络/代理，或稍后再试。也可换个网络（如切流量）`
      : (lastErr?.message || '未知错误'));
  }

  /* 全局限流冷却截止时间（429 后所有 worker 共同遵守） */
  let _throttleUntil = 0;

  /* ---- JSON 容错解析 ---- */
  function parseJSON(text) {
    if (!text) return null;
    let t = text.trim();
    // 去 markdown 代码块
    t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    // 部分模型会加前后缀说明文字，找最外层 [ ] 或 { }
    const tryParse = (s) => { try { return JSON.parse(s); } catch { return null; } };
    let obj = tryParse(t);
    if (obj) return obj;
    const s1 = t.indexOf('['), e1 = t.lastIndexOf(']');
    if (s1 >= 0 && e1 > s1) { obj = tryParse(t.slice(s1, e1 + 1)); if (obj) return obj; }
    const s2 = t.indexOf('{'), e2 = t.lastIndexOf('}');
    if (s2 >= 0 && e2 > s2) { obj = tryParse(t.slice(s2, e2 + 1)); if (obj) return obj; }
    return null;
  }

  /* ---- 从全文提取答案区（启发式）：
     A. 逐行答案条目：「2、答案：A（解析：…）」「3.答案：BCD」「4、对」——出现≥5条即认定答案区，
        连同其间的 章/节 标题一起收集（保留结构上下文，供跨节对位）
     B. 传统模式：密集答案行「1.C 2.A」（每行≥3对）或「参考答案」等标题触发 ---- */
  function findAnswerTable(text) {
    const lines = text.split('\n');
    const isStruct = t => /^第\s*[一二三四五六七八九十\d]+\s*章/.test(t) ||
      /^[一二三四五六七八九十]+\s*[、.．]/.test(t) ||
      /^(单项选择题|单选题|多项选择题|多选题|判断题|填空题|选择题)\s*[：:]?\s*$/.test(t);
    // 逐行答案条目：题号 + (答案：)? + 字母/对错，尾部仅允许 解析括号 / 少量标点
    const entryRe = /^\d{1,3}\s*[.、．:：)）]?\s*(?:答案\s*[:：]?\s*)?([A-Ha-hＡ-Ｈａ-ｈ]{1,4}|对|错|√|×|正确|错误)(?![A-Za-z0-9])/;
    const tailOk = rest => {
      const r = rest.trim();
      if (!r) return true;
      if (/^[（(【\[]\s*(答案解析|解析|解释|说明)/.test(r)) return true;
      if (/^[）)】,，。;；、\s]{0,2}$/.test(r)) return true;
      return false;
    };
    const entryIdx = [];
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(entryRe);
      if (m && tailOk(lines[i].slice(m.index + m[0].length))) entryIdx.push(i);
    }
    if (entryIdx.length >= 5) {
      const out = [];
      for (let i = entryIdx[0]; i <= entryIdx[entryIdx.length - 1]; i++) {
        const t = lines[i].trim();
        if (!t) continue;
        if (isStruct(t)) { out.push(t); continue; }
        if (entryIdx.includes(i)) out.push(t);
      }
      return out.join('\n');
    }
    // 传统模式：密集答案行 / 答案区标题 / 逐行答案条目
    const tableLines = [];
    let inTable = false;
    // 匹配 "1.C 2.A" / "1、C" / "1.对 2.错" 等密集答案行
    const pair = /(\d{1,3})\s*[.、．:：)]?\s*([A-D]|对|错|√|×)(?![A-Za-z0-9])/g;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/参考答案|答案速查|答案表|答案汇总/.test(line)) { inTable = true; tableLines.push(line); continue; }
      // 逐行答案条目（「2、答案：A（解析：…）」）
      const mE = line.match(entryRe);
      if (mE && tailOk(line.slice(mE.index + mE[0].length))) { inTable = true; tableLines.push(line); continue; }
      // 多字母密集表（「1.ABD 2.BC」「1.对 2.错」：整行除题号/答案/分隔符外无其他内容）
      if (tryDenseLine(line)) { inTable = true; tableLines.push(line); continue; }
      let count = 0; let m;
      pair.lastIndex = 0;
      while ((m = pair.exec(line)) !== null) count++;
      if (count >= 3) { inTable = true; tableLines.push(line); }
      else if (inTable && line.trim() === '') { /* 表中空行跳过 */ }
      else if (inTable && count === 0 && tableLines.length > 0 && !/^答案/.test(line)) {
        // 表结束条件：连续非答案行
        if (!lines[i + 1] || !/(参考答案|答案)/.test(lines[i + 1])) inTable = false;
      }
    }
    return tableLines.join('\n');
  }

  /* ================= 配套答案文件 · 结构化解析与精确匹配 ================= */

  const fullToHalf = s => String(s).replace(/[Ａ-Ｈａ-ｈ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  function normLetters(s) {
    const t = fullToHalf(String(s || '')).replace(/[\s,，、]/g, '');
    return /^[A-Ha-h]+$/.test(t) ? t.toUpperCase() : null;
  }
  function secTypeOfTitle(s) {
    if (/单选|只选/.test(s) && /题/.test(s)) return 'single';
    if (/多选/.test(s)) return 'multi';
    if (/判断/.test(s)) return 'judge';
    if (/填空/.test(s)) return 'fill';
    return null;
  }

  /* ---- 剥出答案值与解析：「A（解析：xx）」→ { A, xx } ---- */
  function splitExplanation(body) {
    const pats = [
      /[（(]\s*(?:答案解析|解析|解释|说明)\s*[:：]?\s*([\s\S]*?)\s*[)）]\s*$/,
      /[【\[]\s*(?:答案解析|解析|解释|说明)\s*[:：]?\s*([\s\S]*?)\s*[】\]]\s*$/,
      /[,，。;；]\s*(?:答案解析|解析|解释|说明)\s*[:：]\s*([\s\S]*)$/,
      /^(?:答案解析|解析)\s*[:：]\s*([\s\S]*)$/
    ];
    for (const re of pats) {
      const m = body.match(re);
      if (m) {
        const explanation = m[1].trim() || null;
        return { answerPart: body.slice(0, m.index).trim(), explanation };
      }
    }
    return { answerPart: body.trim(), explanation: null };
  }

  /* ---- 答案值分类：字母（A/ACD/ＡＢ）→ 判断词（对/错/√/×/正确/错误）→ 文本（填空）
     「AB（存疑）」等尾部标注会剥掉，并把标注并进解析提示 ---- */
  function classifyAnswerToken(part, secType) {
    let t = String(part || '').trim().replace(/^[：:]\s*/, '');
    if (!t) return null;
    let note = null;
    const nm = t.match(/\s*[（(]\s*(存疑|争议|待定|不确定|仅供参考)\s*[)）]\s*$/);
    if (nm) { note = nm[1]; t = t.slice(0, nm.index).trim(); }
    const wrap = t.match(/^[（(]\s*(.+?)\s*[)）]$/); // 答案：（A）
    if (wrap) t = wrap[1].trim();
    const letters = normLetters(t);
    if (letters) return { answer: letters, kind: 'letter', raw: t, note };
    if (/^(对|正确|√|✓|是)$/.test(t)) return { answer: 'A', kind: 'judge', raw: t, note };
    if (/^(错|错误|×|✗|否)$/.test(t)) return { answer: 'B', kind: 'judge', raw: t, note };
    if (secType === 'judge' && /^(T|Y|TRUE)$/i.test(t)) return { answer: 'A', kind: 'judge', raw: t, note };
    if (secType === 'judge' && /^(F|N|FALSE)$/i.test(t)) return { answer: 'B', kind: 'judge', raw: t, note };
    t = t.replace(/[。；;]\s*$/, '').trim();
    if (!t || /^(见解析|略|无)$/.test(t)) return null;
    return { answer: t, kind: 'text', raw: t, note };
  }

  /* ---- 密集答案行：「1.C 2.A 3.B」「1.对 2.错」→ 多条目 ---- */
  function tryDenseLine(t) {
    const re = /(\d{1,3})\s*[.、．:：)）]?\s*([A-H]{1,4}|对|错|√|×)(?![A-Za-z0-9])/g;
    const pairs = [...t.matchAll(re)];
    if (pairs.length < 2) return null;
    const rest = t.replace(re, '').replace(/[\s,，、.。;；:：（()）]/g, '');
    if (rest.length > 0) return null; // 还有别的内容 → 不是纯答案表行
    return pairs.map(p => {
      const v = p[2];
      const isJudge = /^(对|√)$/.test(v) ? 'A' : (/^(错|×)$/.test(v) ? 'B' : v);
      return { no: +p[1], answer: isJudge, kind: isJudge === v ? 'letter' : 'judge', raw: v };
    });
  }

  /* ---- 配套答案文件解析：逐行追踪 章/节 标题，输出带章节上下文的答案条目 ----
     支持「2、答案：A（解析：…）」「3.答案：BCD」「4、对」「1.C 2.A」「第1题 答案：C」「题号：1 答案：C」「答案：A」纯序列 ---- */
  function parseAnswerDocument(text) {
    const lines = String(text || '').split('\n');
    const entries = [];   // 带题号条目 { no, chapter, section, secType, answer, kind, raw, explanation }
    const ordered = [];   // 全部答案按出现顺序（无题号文件的序列兜底）
    let chapter = null, section = null, secType = null;

    const pushEntry = (no, cls, explanation) => {
      // 答案文件里的「（存疑）」等标注并进解析，练习时能看到提示
      let exp = explanation || null;
      if (cls.note) exp = exp ? `${exp}（答案文件标注：${cls.note}）` : `（答案文件标注：${cls.note}）`;
      const e = { no, chapter, section, secType, answer: cls.answer, kind: cls.kind, raw: cls.raw, explanation: exp };
      if (no != null) entries.push(e);
      ordered.push({ answer: cls.answer, kind: cls.kind, raw: cls.raw, explanation: exp });
    };

    for (const raw of lines) {
      const t = raw.trim();
      if (!t) continue;
      // 章 / 节 / 题型标题（与题目文件同名结构对齐）
      if (/^第\s*[一二三四五六七八九十\d]+\s*章/.test(t)) { chapter = t.slice(0, 40); section = null; secType = null; continue; }
      if (/^[一二三四五六七八九十]+\s*[、.．]/.test(t) || /^(单项选择题|单选题|多项选择题|多选题|判断题|填空题|选择题)\s*[：:]?\s*$/.test(t)) {
        section = t.slice(0, 20); secType = secTypeOfTitle(t); continue;
      }
      // 题号前缀（三选一）+ 可选「答案：」
      let no = null, rest = null;
      let m = t.match(/^(\d{1,3})\s*[.、．:：)）=－-]\s*/);
      if (m) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^第\s*(\d{1,3})\s*题\s*/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^题号\s*[:：]?\s*(\d{1,3})\s*/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no == null && (m = t.match(/^(\d{1,3})\s+(?=[A-Ha-hＡ-Ｈａ-ｈ对错√×])/))) { no = +m[1]; rest = t.slice(m[0].length); }
      if (no != null) {
        const mA = rest.match(/^答案\s*[:：]?\s*/);
        const hasMarker = !!mA;
        if (mA) rest = rest.slice(mA[0].length);
        const { answerPart, explanation } = splitExplanation(rest);
        const cls = classifyAnswerToken(answerPart, secType);
        // 无「答案：」标记时只收字母/判断类（避免把题目行当答案）
        if (cls && (hasMarker || cls.kind !== 'text')) { pushEntry(no, cls, explanation); continue; }
      }
      // 密集答案行
      const dense = tryDenseLine(t);
      if (dense) { for (const d of dense) pushEntry(d.no, d, null); continue; }
      // 无题号答案行（序列模式）
      const m2 = t.match(/^(?:答案|答)\s*[:：]\s*([\s\S]+)$/);
      if (m2) {
        const { answerPart, explanation } = splitExplanation(m2[1]);
        const cls = classifyAnswerToken(answerPart, secType);
        if (cls) ordered.push({ answer: cls.answer, kind: cls.kind, raw: cls.raw, explanation: explanation || null });
      }
    }
    return { entries, ordered, hasNos: entries.length >= 3 };
  }

  /* ---- 答案文件判定辅助：答案行占比（导入时区分题目文件 / 答案文件） ---- */
  function answerLineRatio(text) {
    const lines = String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return 0;
    let n = 0;
    for (const t of lines) {
      if (/^\d{1,3}\s*[.、．:：)）]?\s*(?:答案\s*[:：]?\s*)?[A-Ha-hＡ-Ｈａ-ｈ](?![A-Za-z0-9])/.test(t) ||
          /^\d{1,3}\s*[.、．:：)）]?\s*(?:答案\s*[:：]?\s*)?(对|错|√|×|正确|错误)/.test(t) ||
          /^(?:答案|答)\s*[:：]/.test(t)) n++;
    }
    return n / lines.length;
  }

  /* ---- 配套答案匹配：按 章+节+题号 精确对位，逐级回退（章+题号 → 节+题号 → 裸题号 → 顺序）
     同时填入解析；按题型校验答案合法性，多候选无法区分时宁缺毋错 ---- */
  function matchAnswersStructured(questions, sections, parsed) {
    const res = { filled: 0, explained: 0 };
    if (!parsed || (!parsed.entries.length && !parsed.ordered.length)) return res;

    const normTitle = s => String(s || '').trim()
      .replace(/单项选择题/g, '单选题').replace(/多项选择题/g, '多选题');

    // 问题侧：secIdx → { chapter, section, type }
    const secMeta = new Map();
    let curChapter = null;
    for (const s of (sections || [])) {
      const title = s.title || null;
      const isChap = title && /^第\s*[一二三四五六七八九十\d]+\s*章/.test(title);
      if (isChap) curChapter = title;
      secMeta.set(s.secIdx, {
        chapter: isChap ? title : curChapter,
        section: isChap ? null : (title ? normTitle(title) : null),
        type: s.type || null
      });
    }

    // 答案侧索引
    const exact = new Map(), chapNo = new Map(), secNo = new Map(), bareNo = new Map();
    const put = (m, k, e) => { if (!m.has(k)) m.set(k, []); m.get(k).push(e); };
    for (const e of parsed.entries) {
      const chap = e.chapter || null;
      const sec = e.section ? normTitle(e.section) : null;
      if (chap && sec) put(exact, chap + '|' + sec + '|' + e.no, e);
      if (chap) put(chapNo, chap + '|' + e.no, e);
      if (sec) put(secNo, sec + '|' + e.no, e);
      put(bareNo, String(e.no), e);
    }

    const valid = (q, e) => {
      if (!e || !e.answer) return false;
      if (!q.options || q.type === 'fill') return String(e.answer).trim().length > 0;
      const letters = normLetters(e.answer);
      if (!letters) return false;                       // 选项题不能配文本答案
      if ([...letters].some(c => !q.options[c])) return false;
      if ((q.type === 'single' || q.type === 'judge') && letters.length !== 1) return false;
      return true;
    };
    const apply = (q, e) => {
      if (!valid(q, e)) return false;
      if (q.type === 'fill' || !q.options) q.answer = String(e.kind === 'text' ? e.answer : (e.raw || e.answer)).trim();
      else q.answer = normLetters(e.answer);
      if (e.explanation && !q.explanation) { q.explanation = e.explanation; res.explained++; }
      res.filled++;
      return true;
    };
    const pick = (cands, q, meta) => {
      if (!cands || !cands.length) return null;
      const ok = cands.filter(e => valid(q, e));
      if (!ok.length) return null;
      if (ok.length === 1) return ok[0];
      const byType = ok.filter(e => e.secType && meta && meta.type && e.secType === meta.type);
      return byType.length === 1 ? byType[0] : null; // 多候选且分不清 → 放弃，宁缺毋错
    };

    const targets = questions.filter(q => !q.answer);
    // P1 章+节+题号 → P2 章+题号 → P3 节+题号 → P4 裸题号
    for (const q of targets) {
      const meta = q.key ? secMeta.get(+String(q.key).split('-')[0]) || null : null;
      let e = null;
      if (meta) {
        if (meta.chapter && meta.section) e = pick(exact.get(meta.chapter + '|' + meta.section + '|' + q.no), q, meta);
        if (!e && meta.chapter) e = pick(chapNo.get(meta.chapter + '|' + q.no), q, meta);
        if (!e && meta.section) e = pick(secNo.get(meta.section + '|' + q.no), q, meta);
      }
      if (!e) e = pick(bareNo.get(String(q.no)), q, meta);
      if (e) apply(q, e);
    }
    // P5 纯序列（答案文件无题号）：按出现顺序对位（已答的也占位，保持对齐）
    if (!parsed.entries.length && parsed.ordered.length) {
      let si = 0;
      for (const q of questions) {
        const e = parsed.ordered[si++];
        if (!e) break;
        if (!q.answer) apply(q, e);
      }
    }
    return res;
  }

  /* ================= AI 辅助录入 · 从答案文件原文智能对位 =================
     定位：本地结构化匹配（matchAnswersStructured）的兜底——格式怪异/题号错位/
     无章节标题导致正则对不上时，交给 AI 按语义从答案原文里找答案照抄填入。
     关键设计（保正确率）：
     1. AI 只做「对位+照抄」，明确禁止自己推理做题——答案文件里就是标准答案
     2. 每题带章节上下文 + 题号 + 题型 + 题干，给 AI 足够对位线索
     3. 回填前过同一套题型校验（single/judge→单字母且在选项内，multi→字母合法，fill→文本）
     4. 答案原文超长自动分片轮询；失败批次重试；并发可配 */
  async function aiMatchAnswers(questions, answerText, sections, onProgress, onRetry, onBatchSave) {
    const res = { filled: 0, explained: 0 };
    let pool = questions.filter(q => !q.answer);
    if (!pool.length || !answerText || !String(answerText).trim()) return res;

    const cfg = await getConfig();
    const concurrency = Math.max(1, Math.min(4, parseInt(cfg.concurrency, 10) || 4));
    const BATCH = 12;      // 每批题数
    const SLICE = 48000;   // 答案原文分片大小（字符）

    // 题目侧章节上下文（与 matchAnswersStructured 同源），给 AI 对位线索
    const secMeta = new Map();
    let curChapter = null;
    for (const s of (sections || [])) {
      const title = s.title || null;
      const isChap = title && /^第\s*[一二三四五六七八九十\d]+\s*章/.test(title);
      if (isChap) curChapter = title;
      secMeta.set(s.secIdx, { chapter: isChap ? title : curChapter, section: isChap ? null : title });
    }
    const contextOf = q => {
      if (!q.key) return null;
      const m = secMeta.get(+String(q.key).split('-')[0]);
      return m ? [m.chapter, m.section].filter(Boolean).join(' / ') || null : null;
    };

    const PROMPT = `你是答案匹配专家。输入包含【题目列表】和【答案文件原文】，答案文件原文里写着每道题的标准答案。
请从答案文件原文中找出每道题对应的答案（按题号、章节标题、题型、题干内容对位），严格按 JSON 输出（不要 markdown、不要解释文字）：
{"answers":[{"idx":0,"answer":"C","explanation":"答案文件原文中该题的解析，没有则留空"}]}
规则：
- idx 是【题目列表】里每题的序号（从 0 开始）
- 选择题 answer 为选项字母串，如 "C"、"ACD"；单选题只填 1 个字母
- 判断题：原文「对/正确/√」→ answer 填 "A"；「错/错误/×」→ answer 填 "B"
- 填空题 answer 为答案文本
- 必须照抄答案文件原文中的答案，禁止自己推理做题
- 答案文件原文里找不到对应答案的题，不要输出该项
- explanation 仅当答案原文带解析时照抄，否则留空`;

    // 一批题目 + 一片答案原文 → AI 对位 → 校验回填
    const fillBatch = async (batch, sliceText) => {
      const body = batch.map((q, i) => ({
        idx: i,
        no: q.no ?? undefined,
        context: contextOf(q) || undefined,
        type: q.type,
        stem: String(q.stem || '').slice(0, 60),
        options: q.options ? Object.keys(q.options).join('') : undefined
      }));
      const raw = await chat([
        { role: 'system', content: PROMPT },
        { role: 'user', content: '【题目列表】\n' + JSON.stringify(body) + '\n\n【答案文件原文】\n' + sliceText }
      ], { onRetry });
      const obj = parseJSON(raw);
      const arr = obj?.answers || obj;
      if (!Array.isArray(arr)) throw new Error('AI 返回非 JSON');
      let got = 0, exp = 0;
      for (const a of arr) {
        const q = batch[a?.idx];
        if (!q || q.answer) continue;
        let ans = String(a.answer ?? '').trim();
        if (!ans || ans === 'null') continue;
        if (q.options && q.type !== 'fill') {
          // 选项题：同结构化匹配的严格校验
          const letters = normLetters(ans);
          if (!letters) continue;                                       // 选项题不收文本答案
          if ([...letters].some(c => !q.options[c])) continue;           // 字母不在选项里
          if ((q.type === 'single' || q.type === 'judge') && letters.length !== 1) continue; // 单选/判断必须单字母
          q.answer = letters;
        } else {
          // 填空/无选项题：收文本，限长
          if (ans.length > 80) ans = ans.slice(0, 80);
          q.answer = ans;
        }
        if (a.explanation && !q.explanation) { q.explanation = String(a.explanation).trim(); exp++; }
        got++;
      }
      return { got, exp };
    };

    // 分片轮询：答案原文超长时逐片查找（前面片找不到的题进入下一片）
    const text = String(answerText).trim();
    const slices = [];
    for (let i = 0; i < text.length; i += SLICE) slices.push(text.slice(i, i + SLICE));

    for (let si = 0; si < slices.length && pool.length; si++) {
      let retriesLeft = 1; // 每片失败批重试 1 次
      while (pool.length) {
        const batches = [];
        for (let i = 0; i < pool.length; i += BATCH) batches.push(pool.slice(i, i + BATCH));
        let bIdx = 0, done = 0;
        const netFailed = [];
        await Promise.all(Array.from({ length: Math.min(concurrency, batches.length) }, async () => {
          while (bIdx < batches.length) {
            const batch = batches[bIdx++];
            try {
              const { got, exp } = await fillBatch(batch, slices[si]);
              res.filled += got; res.explained += exp;
              if (got && onBatchSave) { try { await onBatchSave(batch); } catch (e) { /* 保存失败不中断 */ } }
            } catch (e) { netFailed.push(batch); }
            done++;
            if (onProgress) onProgress(done, batches.length, res.filled, si + 1, slices.length);
          }
        }));
        pool = pool.filter(q => !q.answer);
        if (!netFailed.length || !pool.length || retriesLeft-- <= 0) break;
        pool = netFailed.flat().filter(q => !q.answer);
      }
    }
    return res;
  }

  /* ---- 整体解析 · 纯本地：正则切题 + 逐题解析 + 答案表匹配（0 次 API 调用、无需 API Key） ---- */
  async function parseDocument(fullText, onProgress) {
    const text = Extractor.cleanText(fullText);
    const answerTable = findAnswerTable(text);

    // 1) 确定性切题
    const split = Extractor.splitQuestions(text);

    // 2) 本地正则解析（毫秒级、零费用）——透传节题型/节键
    const questions = [];
    for (const it of split.items) {
      const q = Extractor.parseOneQuestion(it.no, it.text, it.type, it.key);
      if (q && q.stem) questions.push(q);
    }
    for (const q of questions) delete q._local;

    // 3) 答案区本地匹配：同文件答案表 / 逐行答案条目 → 按 章+节+题号 填答案与解析
    if (answerTable && answerTable.trim()) {
      const parsedAns = parseAnswerDocument(answerTable);
      if (parsedAns.entries.length || parsedAns.ordered.length) {
        matchAnswersStructured(questions, split.sections, parsedAns);
      }
    }

    if (onProgress) onProgress(1, 1, questions.length);

    const answered = questions.filter(q => q.answer).length;
    return {
      questions, answered, noAnswer: questions.length - answered,
      splitTotal: split.total, localCount: questions.length, aiCount: 0,
      degraded: questions.filter(q => q._degraded).length,
      missingNos: split.missingNos, dupNos: split.dupNos, problems: split.problems,
      sections: split.sections,
      dropped: Math.max(0, split.total - questions.length),
      mode: 'local'
    };
  }

  /* ================= 第二步 · 答案补全 ================= */

  /* ---- 把答案文件文本解析成 { 题号: 答案 } 映射（兼容旧接口，内部走结构化解析器） ----
     支持："1.C 2.A 3.B" / "1、C" / "2、答案：A（解析：…）" / "题号:1 答案:C" / "A B C D"（纯序列按顺序） ---- */
  function parseAnswerMap(text) {
    const parsed = parseAnswerDocument(text);
    if (parsed.entries.length >= 3) {
      const map = new Map();
      for (const e of parsed.entries) if (!map.has(e.no)) map.set(e.no, e.answer);
      return { map, mode: 'numbered' };
    }
    if (parsed.ordered.length >= 3) {
      const map = new Map();
      parsed.ordered.forEach((o, i) => map.set(i + 1, o.answer));
      return { map, mode: 'sequence' };
    }
    return { map: new Map(), mode: 'none' };
  }

  /* ---- 用答案映射给题目填答案（按题号；序列模式按顺序，已答题也消耗序号保持对齐） ---- */
  function matchAnswers(questions, answerMap, mode) {
    let filled = 0;
    let seqIdx = 0;
    for (const q of questions) {
      if (mode === 'sequence') {
        // 序列模式：每道题都占一个位置（答案文件通常是完整的）
        const seq = ++seqIdx;
        if (!q.answer) {
          const ans = answerMap.get(seq);
          if (ans && !(q.options && [...ans].some(c => !q.options[c]))) {
            q.answer = ans;
            filled++;
          }
        }
        continue;
      }
      if (q.answer) continue;
      if (q.no != null) {
        const ans = answerMap.get(q.no);
        if (ans && !(q.options && [...ans].some(c => !q.options[c]))) {
          q.answer = ans;
          filled++;
        }
      }
    }
    return filled;
  }

  /* ---- AI 批量解答（第二步 · 明确告知用户答案来自 AI）
     断点续传设计：每批答完立即回调 onBatchSave 落库；失败批次自动重试（最多 3 轮）；
     中途退出再进来，已答的题自动跳过，从剩余继续 ---- */
  async function solveQuestions(questions, onProgress, onRetry, onBatchSave) {
    const BATCH = 10;
    const MAX_ROUNDS = 3;
    const cfg = await getConfig();
    const concurrency = Math.max(1, Math.min(4, parseInt(cfg.concurrency, 10) || 4));

    const SOLVE_PROMPT = `你是答题专家。解答下列题目，严格按json输出（不要markdown、不要解释文字）：
{"answers":[{"idx":0,"answer":"C","explanation":"简短解析"}]}
- idx 是输入里每题的序号（从0开始）
- 选择题 answer 为字母串如 "C" / "ACD"（必须是给定选项中的字母）
- 填空题 answer 为答案文本，多空用 ||| 分隔
- explanation 一句话即可`;

    let solved = 0;
    let pool = questions.filter(q => !q.answer); // 已答的（上次中断续跑）直接跳过
    let round = 0;
    while (pool.length && round < MAX_ROUNDS) {
      round++;
      if (round > 1) {
        if (onProgress) onProgress(0, 1, solved, `网络波动，第 ${round} 轮重试（10s 后）`);
        await new Promise(r => setTimeout(r, 10000));
        pool = pool.filter(q => !q.answer);
        if (!pool.length) break;
      }
      const batches = [];
      for (let i = 0; i < pool.length; i += BATCH) batches.push(pool.slice(i, i + BATCH));
      const failed = [];
      let done = 0;
      let idx = 0;
      async function worker() {
        while (idx < batches.length) {
          const my = idx++;
          const batch = batches[my];
          const body = batch.map((q, i) => ({
            idx: i, type: q.type, stem: q.stem,
            options: q.options || undefined
          }));
          let ok = true;
          let parseFailPreview = '';
          try {
            const raw = await chat([
              { role: 'system', content: SOLVE_PROMPT },
              { role: 'user', content: JSON.stringify(body) }
            ], { onRetry });
            const obj = parseJSON(raw);
            const arr = obj?.answers || obj;
            let solvedHere = 0;
            if (Array.isArray(arr)) {
              for (const a of arr) {
                const q = batch[a.idx];
                if (!q || q.answer) continue;
                let ans = String(a.answer ?? '').trim();
                if (!ans) continue;
                if (q.options) {
                  ans = ans.toUpperCase().replace(/[^A-Z]/g, '');
                  if (!ans || [...ans].some(c => !q.options[c])) continue;
                }
                q.answer = ans;
                if (a.explanation) q.explanation = String(a.explanation).trim();
                solved++;
                solvedHere++;
              }
            }
            // LLM 静默失败修复：返回非 JSON 或一题都没解出，标失败进入重试队列
            // （原 v1.0.0 只在 catch 才 ok=false，导致 parseJSON 返回 null 时
            //   静默成功，failed 永远不进队列 → 表现为"什么都不出")
            if (!Array.isArray(arr) || solvedHere === 0) {
              ok = false;
              parseFailPreview = (raw || '(空)').replace(/\s+/g, ' ').slice(0, 80);
            }
          } catch (e) {
            ok = false;
            parseFailPreview = '请求错误：' + (e.message || '').slice(0, 60);
          }
          // 增量落盘：本批有结果的立即保存，断网/退出不丢
          if (onBatchSave && batch.some(q => q.answer)) {
            try { await onBatchSave(batch); } catch (e) { /* 保存失败不中断 */ }
          }
          if (!ok) failed.push(batch);
          done++;
          // 失败时把 GLM 实际返回的前 80 字反馈到 UI，方便诊断
          const note = parseFailPreview
            ? `解析失败 · GLM 返回: ${parseFailPreview}`
            : (round > 1 ? `第 ${round} 轮` : '');
          if (onProgress) onProgress(done, batches.length, solved, note);
        }
      }
      await Promise.all(Array.from({ length: Math.min(concurrency, batches.length) }, worker));
      pool = failed.flat().filter(q => !q.answer);
    }
    return solved;
  }

  /* ---- AI 校验：重做一遍已答题目，比对答案 + 给解析 ----
     返回 { checked, agree, conflicts:[{no, stem, orig, ai}], explained }
     不修改 q.answer（原答案保留），只写 q.aiAnswer / 补 q.explanation ---- */
  async function verifyQuestions(questions, onProgress, onRetry, onBatchSave) {
    const BATCH = 10;
    const cfg = await getConfig();
    const concurrency = Math.max(1, Math.min(4, parseInt(cfg.concurrency, 10) || 4));
    // 断点续跑：跳过已校验过的题（上次中断的部分不再重做）
    const batches = [];
    const todo = questions.filter(q => !q.aiAnswer);
    for (let i = 0; i < todo.length; i += BATCH) batches.push(todo.slice(i, i + BATCH));

    const VERIFY_PROMPT = `你是答题专家。独立解答下列题目（不要猜原答案，凭知识自己做），严格按json输出：
{"answers":[{"idx":0,"answer":"C","explanation":"解题过程，2-3句"}]}
- idx 是输入每题的序号（从0开始）
- 选择题 answer 为字母串如 "C"/"ACD"（必须是给定选项字母）
- 填空题 answer 为答案文本，多空用 ||| 分隔
- explanation 写清推理依据，2-3 句`;

    let done = 0, checked = 0, agree = 0, explained = 0;
    const conflicts = [];
    let idx = 0;
    async function worker() {
      while (idx < batches.length) {
        const my = idx++;
        const batch = batches[my];
        const body = batch.map((q, i) => ({
          idx: i, type: q.type, stem: q.stem,
          options: q.options || undefined
        }));
        try {
          const raw = await chat([
            { role: 'system', content: VERIFY_PROMPT },
            { role: 'user', content: JSON.stringify(body) }
          ], { onRetry });
          const obj = parseJSON(raw);
          const arr = obj?.answers || obj;
          if (Array.isArray(arr)) {
            for (const a of arr) {
              const q = batch[a.idx];
              if (!q) continue;
              let ai = String(a.answer ?? '').trim();
              if (!ai) continue;
              if (q.options) {
                ai = ai.toUpperCase().replace(/[^A-Z]/g, '');
                if (!ai || [...ai].some(c => !q.options[c])) continue;
              } else {
                // 填空：宽松归一后再比对
              }
              q.aiAnswer = ai;
              // 比对
              let same;
              if (q.type === 'fill') {
                same = QuizSession.normalizeFill(ai) === QuizSession.normalizeFill(q.answer);
              } else {
                const nrm = s => String(s).toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
                same = nrm(ai) === nrm(q.answer);
              }
              checked++;
              if (same) agree++;
              else conflicts.push({ no: q.no, stem: q.stem.slice(0, 40), orig: q.answer, ai });
              // 补解析（原本没有的）
              if (!q.explanation && a.explanation) {

  /* ================= 解析 ================= */

  function normLine(s) {

  function detectSecType(title) {

  function bareStem(s) {

      if (!optObj && q.optionRejected) {
        err(q.line, `第 ${q.no} 题：有选项行但无法识别（选项必须从 A 开始连续写，如「A. 内容」），已跳过`);
        return;

      if ((type === 'single' || type === 'multi') && !optObj) {

      let answer = null;

        type,

        options: type === 'judge' ? { A: '正确', B: '错误' } : (type === 'fill' ? null : optObj),

      let m = s.match(/^\s*(#{1,6})\s*(.+?)\s*$/);

      if (isChapterLine(s) || TYPE_TITLE_RE.test(s.trim()) || TYPE_TITLE_NUM_RE.test(s.trim())) {

          secType = detectSecType(raw);
          sections.push({ secIdx: ++secIdx, title: curChapter, type: secType });
        } else {

      //    于是「【解析】…」整段留在题干/选项里；更糟的是答案正文里的公式字母
      //    （如「U≈E=4.44fNΦ」里的 E、F）会被当成答案字母，答出「AEF」这种假答案
      let rest = s, forcedType = null, markerOnly = false;
      {
        const MARK_RE = /[【\[]\s*([^】\]]{1,12}?)\s*[】\]]/g;
        const marks = [];
        let mk;
        while ((mk = MARK_RE.exec(s)) !== null) {
          marks.push({ key: mk[1].replace(/\s/g, ''), start: mk.index, bodyStart: MARK_RE.lastIndex });
          if (MARK_RE.lastIndex === mk.index) MARK_RE.lastIndex++;   // 防御：零宽匹配死循环
        }
        if (marks.length) {
          rest = s.slice(0, marks[0].start).trim();                  // 第一个标记之前的文字
          for (let k = 0; k < marks.length; k++) {
            const stop = k + 1 < marks.length ? marks[k + 1].start : s.length;
            const body = s.slice(marks[k].bodyStart, stop).trim();
            const key = marks[k].key;
            if (TYPE_ALIAS[key]) {
              // 首个标记是题型 → 其后的正文继续按题干/选项处理
              if (k === 0) { forcedType = TYPE_ALIAS[key]; rest = (rest ? rest + ' ' : '') + body; }
            } else if (/^(参考答案|正确答案|答案)$/.test(key)) {
              if (cur) { if (cur.answerRaw == null) cur.answerRaw = body; }
              else warn(ln, '答案出现在题目之外，已忽略');
            } else if (/^(答案解析|解析|解释|说明)$/.test(key)) {
              if (cur) cur.expLines.push(body); else warn(ln, '解析出现在题目之外，已忽略');
            } else {
              warn(ln, `未识别的标记「【${key}】」，已忽略标记`);
              rest = (rest ? rest + ' ' : '') + body;
            }
          }
          markerOnly = !rest;   // 整行只有答案/解析标记 → 不是题干行
        }
      }
      if (markerOnly) continue;

      // ③ 题号行（「1. 题干」/「1、题干」/「第1题 题干」；「2.5kV」这类小数点不算题号）
      const qm = rest.match(/^\s*(?:第\s*)?(\d{1,4})\s*(?:题)?\s*[.、．)）](?!\d)\s*([\s\S]*)$/)
        || rest.match(/^\s*第\s*(\d{1,4})\s*题\s*[:：]?\s*([\s\S]*)$/);
      if (qm) {
        const no = +qm[1];
        const body = qm[2].trim();
        const isStart = forcedType != null || !cur || no === nextNo ||
          (cur.answerRaw != null) || cur.optionOrder.length >= 2 ||
          (cur.stemLines.length === 0) ||
          (cur._auto && !cur.optionOrder.length && cur.answerRaw == null && no === cur.no);
        if (isStart) {
          flush();
          startQuestion(no, forcedType, ln);
          if (body) pushStemBody(body);
          continue;
        }
        // 否则视为题干续行（如「2.5kV…」这类以数字开头的换行）
      } else if (forcedType != null) {
        // 只有题型标记、没有题号：新题（题号自动），rest 继续按普通行处理
        flush();
        startQuestion(null, forcedType, ln);
      }

      // ④ 选项行（含「A.甲  B.乙  C.丙」一行多选项的写法）
      const om = rest.match(/^\s*([A-Ha-hＡ-Ｈ])\s*[.、．)）:：]\s*([\s\S]+)$/);
      if (om && cur) {
        const letter = FULL_LETTER[om[1]] || om[1].toUpperCase();
        const content = om[2].trim();
        // 一行多选项（Word 里最常见）：字母从「下一个期望的字母」起连续、每段都有内容 → 采纳
        const parts = splitInlineOptions(rest);
        if (parts && parts.length >= 2) {
          let expect = cur.optionOrder.length
            ? String.fromCharCode(cur.optionOrder[cur.optionOrder.length - 1].charCodeAt(0) + 1) : 'A';
          let ok = true;
          for (const p of parts) {
            if (p.letter !== expect || !p.content || cur.options[p.letter] != null) { ok = false; break; }
            expect = String.fromCharCode(expect.charCodeAt(0) + 1);
          }
          if (ok) {
            for (const p of parts) { cur.optionOrder.push(p.letter); cur.options[p.letter] = p.content; }
            continue;
          }
        }
        // 题干里「A、B两系统互联…（ ）」式误判：内容含空括号且较长 → 当题干
        if (BLANK_RE.test(content) && content.replace(/\s/g, '').length > 10) {
          pushStemBody(rest);
          continue;
        }
        if (!cur.optionOrder.length && letter !== 'A') { cur.optionRejected = true; warn(ln, `选项必须从 A 开始，「${letter}.」已忽略`); continue; }
        if (cur.options[letter] != null) { cur.optionRejected = true; warn(ln, `选项 ${letter} 重复出现，已忽略后一个`); continue; }
        cur.optionOrder.push(letter);
        cur.options[letter] = content;
        continue;
      }

      // ⑤ 答案行
      const am = rest.match(/^\s*(?:参考答案|正确答案|答案|答)\s*[:：]\s*([\s\S]*)$/);
      if (am) {
        if (!cur) warn(ln, '答案出现在题目之外，已忽略');
        else if (cur.answerRaw != null) warn(ln, `第 ${cur.no} 题出现多个答案行，以第一个为准`);
        else cur.answerRaw = am[1].trim();
        continue;
      }

      // ⑥ 解析行
      const em = rest.match(/^\s*(?:答案解析|解析|解释|说明)\s*[:：]?\s*([\s\S]*)$/);
      if (em) {
        if (cur) cur.expLines.push(em[1].trim());
        else warn(ln, '解析出现在题目之外，已忽略');
        continue;
      }

      // ⑦ 题干内联答案（兼容「题干…（答案：A）。」）—— 交由 pushStemBody 统一处理
      // ⑧ 普通文字：可能是新题（最简写法：无题号、无标记），否则并入题干/解析
      if (cur) {
        const finished = cur.answerRaw != null || cur.optionOrder.length >= 2;
        // 新题的判据：上一题已收尾 + 这行像题干 + （前面有空行 或 还没写解析 或 行内有空位/问号）
        const canStartNew = finished && bareStem(rest) &&
          (prevBlank || !cur.expLines.length || BLANK_RE.test(rest) || /[？?]\s*$/.test(rest));
        if (canStartNew) {
          flush();
          startQuestion(null, null, ln);
          pushStemBody(rest);
          continue;
        }
        if (cur.answerRaw != null) cur.expLines.push(rest.trim());
        else pushStemBody(rest);
      } else if (bareStem(rest)) {
        startQuestion(null, null, ln);
        pushStemBody(rest);
      } else {
        warn(ln, `题目之外的文字（疑似标题/前言），已忽略：「${rest.trim().slice(0, 24)}」`);
      }
    }
    flush();

    const byType = { single: 0, multi: 0, judge: 0, fill: 0 };
    for (const q of questions) byType[q.type]++;
    const missing = questions.filter(q => !q.answer).length;
    return {
      questions, errors, warns, sections,
      stats: {
        total: questions.length, byType, missing,
        answered: questions.length - missing,
        explained: questions.filter(q => q.explanation).length,
        errors: errors.length, warns: warns.length, sections: sections.length
      }
    };
  }

  /* ================= 序列化（题库 / 转换结果 → 范式文本） ================= */

  function secIdxOf(q) {
    if (q.secIdx != null) return q.secIdx;
    const k = String(q.key || '');
    const i = parseInt(k.split('-')[0], 10);
    return Number.isFinite(i) ? i : 0;
  }

  function serialize(questions, sections, opts = {}) {
    const list = [...questions].sort((a, b) => (secIdxOf(a) - secIdxOf(b)) || ((a.no ?? 0) - (b.no ?? 0)));
    const secMap = new Map((sections || []).map(s => [s.secIdx, s.title]));
    const out = [];
    if (opts.title) out.push('# ' + opts.title, '');
    let lastSec = null, lastChap = null;
    for (const q of list) {
      const si = secIdxOf(q);
      if (si !== lastSec) {
        const t = secMap.get(si);
        if (t) {
          // 「第一章 磁路及变压器 · 一、单选题」→ 章单独写一行，节标题回到「一、单选题」。
          // 解析时会把章再拼回节标题（题库里就有单元了），文本也更接近 Word 大纲的样子
          const mm = t.match(/^(第\s*[一二三四五六七八九十\d]+\s*章[^·]*?)\s*·\s*(.+)$/);
          if (mm) {
            const chap = mm[1].trim();
            if (chap !== lastChap) { out.push('# ' + chap, ''); lastChap = chap; }
            out.push('## ' + mm[2].trim(), '');
          } else {
            out.push('## ' + t, '');
            lastChap = null;
          }
        }
        lastSec = si;
      }
      const head = `【${TYPE_LABEL[q.type] || '填空'}】${q.no != null ? q.no + '. ' : ''}${cleanStem(q.stem)}`;
      out.push(head);
      if (q.options && q.type !== 'judge') {
        for (const k of Object.keys(q.options).sort()) out.push(`${k}. ${q.options[k]}`);
      }
      if (q.type === 'judge') {
        out.push('答案：' + (q.answer === 'A' ? '对' : q.answer === 'B' ? '错' : ''));
      } else {
        out.push('答案：' + (q.answer || ''));
      }
      if (q.explanation) out.push('解析：' + String(q.explanation).replace(/\s+/g, ' ').trim());
      out.push('');
    }
    return out.join('\n');
  }

  /* 题干清洗：单行化 + 去掉转换残留的尾部「答案：」「（答案：）」空壳
     （旧格式文档里「题干。\n答案：」这种断行会让答案行落进题干） */
  function cleanStem(s) {
    return String(s == null ? '' : s)
      .replace(/\s*\n\s*/g, ' ')
      .replace(/\s*[（(]?\s*(?:参考答案|正确答案|答案)\s*[:：]?\s*[)）]?\s*$/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* 题库 → 范式文本 */
  function fromQuestions(questions, sections, opts = {}) {
    return serialize(questions || [], sections || [], opts);
  }

  /* ================= Word 转换器：任意文档 → 范式文本 =================
     复用成熟的本地解析流水线（cleanText → splitQuestions → parseOneQuestion），
     再按 章/节/题号 做一次本地答案匹配；匹配不到的题答案留空（写「答案：」），
     由用户在文本框里补，或用「AI 解题」批量补。全程零 API 调用。 */

  /* 文本里是否已经带范式特征（题型标记 或 行首答案行） */
  const CANON_MARK_RE = /[【\[]\s*(?:单选|多选|判断|填空|选择|简答|问答|名词解释|计算|论述)题?\s*[】\]]/;
  const CANON_ANS_RE = /^[ \t　]*(?:参考答案|正确答案|答案)\s*[:：]/m;

  function convert(text) {
    if (typeof Extractor === 'undefined') throw new Error('转换器需要 Extractor 模块');
    const src = String(text || '').replace(/\r\n?/g, '\n').trim();

    const clean = Extractor.cleanText(src);
    const split = Extractor.splitQuestions(clean);
    const qs = [];
    for (const it of split.items) {
      const q = Extractor.parseOneQuestion(it.no, it.text, it.type, it.key);
      if (q && q.stem) { q.secIdx = it.secIdx; qs.push(q); }
    }

    /* 已经是范式（带题型标记 / 行首答案行）且范式解析出的题数不少于旧管线
       → 原样保留，不再二次拆改：转换幂等、反复转换不会把范式拆坏。
       注意：只有「题型标记」才能无条件认定；仅凭「答案：」行时还要求范式解析
       零错误且确实解析出答案，否则旧格式文档（题末答案表）会被误当范式吞掉 */
    const marked = CANON_MARK_RE.test(src);
    if (marked || CANON_ANS_RE.test(src)) {
      const pre = parse(src);
      // 带题型标记 = 明确是范式文本 → 一律原样保留（哪怕有格式错误，也交给「解析预览」
      // 逐条报错，绝不二次拆改用户自己写的文本）
      const ok = marked || (pre.stats.total > 0 && pre.stats.total >= qs.length &&
        pre.errors.length === 0 && pre.stats.answered > 0);
      if (ok) {
        return {
          text: src + '\n',
          stats: {
            total: pre.stats.total, byType: pre.stats.byType, missing: pre.stats.missing,
            answered: pre.stats.answered, explained: pre.stats.explained, filled: 0,
            sections: pre.stats.sections
          },
          problems: [], passthrough: true,
          errors: pre.errors, warns: pre.warns
        };
      }
    }

    // 文末答案表 / 逐行答案条目：按 章/节/题号 本地匹配（无 AI）
    let filled = 0;
    if (typeof LLM !== 'undefined' && qs.length) {
      try {
        const parsed = LLM.parseAnswerDocument(clean);
        if (parsed.entries.length || parsed.ordered.length) {
          const r = LLM.matchAnswersStructured(qs, split.sections, parsed);
          filled = r.filled;
        }
      } catch (e) { /* 答案表匹配失败不影响转换 */ }
    }
    const text2 = serialize(qs, split.sections);
    const missing = qs.filter(q => !q.answer).length;
    const byType = { single: 0, multi: 0, judge: 0, fill: 0 };
    for (const q of qs) byType[q.type]++;
    // explained = 最终带解析的题数（内嵌「解析：…」「【解析】…」与答案表里的解析都算），
    // 让界面能明确显示「解析 402」，而不是永远 0（用户会以为解析丢了）
    const explainedCnt = qs.filter(q => q.explanation).length;
    return {
      text: text2,
      stats: {
        total: qs.length, byType, missing, answered: qs.length - missing,
        filled, explained: explainedCnt, sections: split.sections.length
      },
      problems: split.problems || []
    };
  }

  return { SPEC, template, parse, fromQuestions, convert, TYPE_ALIAS, TYPE_LABEL };
})();

  <script>
/* ========== 答题会话逻辑 ========== */
class QuizSession {
  /**
   * @param questions 题目数组
   * @param opts {shuffle:false, mode:'normal'|'wrong', exam:false, minutes:0, deadline:0}
   * 考试模式：作答时只记答案不判分（不显示对错），交卷后 grade() 统一判分并写答题记录
   */
  constructor(questions, opts = {}) {
    this.all = questions;
    this.opts = opts;
    this.list = opts.shuffle ? this._shuffle([...questions]) : [...questions];
    this.index = 0;
    this.answered = new Map(); // qid -> {userAnswer, correct, q, answer, explanation}
    this.startTime = Date.now();

    this.exam = !!opts.exam;
    this.minutes = opts.minutes || 0;      // 考试时长（分钟），0 = 不限时
    this.deadline = opts.deadline || (this.exam && this.minutes ? Date.now() + this.minutes * 60000 : 0);
    this.examAnswers = new Map();          // 考试模式：qid -> 用户答案（尚未判分）
    this.graded = false;
  }

  _shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  get current() { return this.list[this.index]; }
  get total() { return this.list.length; }
  get pos() { return this.index + 1; }
  get finished() { return this.index >= this.list.length; }
  /** 考试中（未交卷）：答题中，不反馈对错 */
  get inExam() { return this.exam && !this.graded; }

  get progress() {
    if (this.inExam) {
      return { total: this.list.length, done: this.examAnswers.size, correct: 0, wrong: 0 };
    }
    const answered = [...this.answered.values()];
    return {
      total: this.list.length,
      done: answered.length,
      correct: answered.filter(a => a.correct).length,
      wrong: answered.filter(a => !a.correct).length
    };
  }

  /* ---- 填空题判分：宽松比对（去空白/标点） ---- */
  static normalizeFill(s) {
    if (s == null) return '';
    return String(s).replace(/[\s，。、；：""''？！,.;:'"?!（）()【】\[\]]/g, '').toLowerCase();
  }

  static checkFill(userAns, stdAns) {
    const uParts = String(userAns).split('|||').map(QuizSession.normalizeFill);
    const sParts = String(stdAns).split('|||').map(QuizSession.normalizeFill);
    if (uParts.length !== sParts.length) {
      // 用户没按格式分空，尝试整体比对
      return QuizSession.normalizeFill(userAns) === QuizSession.normalizeFill(stdAns);
    }
    return uParts.every((u, i) => u === sParts[i]);
  }

  /* ---- 判分（学习模式与考试交卷共用） ---- */
  static judge(q, userAnswer) {
    if (q.type === 'fill') return QuizSession.checkFill(userAnswer, q.answer);
    const norm = s => String(s).toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
    return norm(userAnswer) === norm(q.answer);
  }

  /* ---- 提交答案（学习模式：立即判分并写记录） ---- */
  submit(userAnswer) {
    const q = this.current;
    if (!q || this.answered.has(q.id)) return null;
    // 缺标准答案：不判分（由用户先在 ✎ 里补答案），交给页面提示
    if (!q.answer) return { noAnswer: true };

    const correct = QuizSession.judge(q, userAnswer);
    // 连答案/解析一起存下来：翻回上一题时才能原样显示（否则只剩 userAnswer/correct）
    this.answered.set(q.id, { userAnswer, correct, q, answer: q.answer, explanation: q.explanation });
    DB.recordAdd({
      questionId: q.id,
      bankId: q.bankId,
      userAnswer: String(userAnswer),
      correct
    });
    return { correct, answer: q.answer, explanation: q.explanation };
  }

  /* ---- 考试模式：只记答案，不判分、不写记录 ---- */
  answer(userAnswer) {
    const q = this.current;
    if (!q) return null;
    this.examAnswers.set(q.id, String(userAnswer));
    return { saved: true };
  }

  /* ---- 交卷：统一判分 + 写答题记录（只记已作答的题，未答不计入答题量） ---- */
  grade() {
    if (this.graded) return this.result();
    for (const q of this.list) {
      const ua = this.examAnswers.get(q.id);
      if (ua == null || ua === '') continue;
      const correct = q.answer ? QuizSession.judge(q, ua) : false;
      this.answered.set(q.id, { userAnswer: ua, correct, q, answer: q.answer, explanation: q.explanation });
      DB.recordAdd({ questionId: q.id, bankId: q.bankId, userAnswer: String(ua), correct });
    }
    this.graded = true;
    return this.result();
  }

  /* ---- 成绩单 ---- */
  result() {
    const vals = [...this.answered.values()];
    const correct = vals.filter(v => v.correct).length;
    return {
      total: this.list.length,
      answered: vals.length,
      correct,
      wrong: vals.length - correct,
      unanswered: this.list.length - vals.length,
      acc: this.list.length ? Math.round(correct / this.list.length * 100) : 0,
      timeUsed: Math.max(0, Math.round((Date.now() - this.startTime) / 1000))
    };
  }

  /* ---- 未答或答错的题（交卷后速览 / 重做用） ---- */
  wrongList() {
    return this.list
      .map(q => ({ q, a: this.answered.get(q.id) }))
      .filter(x => !x.a || !x.a.correct)
      .map(x => ({ ...x, userAnswer: x.a ? x.a.userAnswer : (this.examAnswers.get(x.q.id) || null) }));
  }

  next() { this.index++; return !this.finished; }
  jump(i) { if (i >= 0 && i < this.list.length) this.index = i; }

  /* ---- 断点续做：序列化（只存 id 序列 + 进度，题目本身在库里） ---- */
  serialize() {
    return {
      ids: this.list.map(q => q.id),
      index: this.index,
      // 已答的题存 id->结果，恢复时从库里取题重建（否则续做后对错/成绩会丢）
      answered: [...this.answered.entries()].map(([qid, v]) => [qid, { userAnswer: v.userAnswer, correct: v.correct }]),
      exam: this.exam,
      minutes: this.minutes,
      deadline: this.deadline || 0,
      graded: this.graded,
      examAnswers: [...this.examAnswers.entries()]
    };
  }
  /* ---- 反序列化：查库重建 ---- */
  static async restore(data) {
    const qs = [];
    for (const id of data.ids) {
      const q = await DB.questionGet(id);
      if (q) qs.push(q);
    }
    const s = new QuizSession(qs, { shuffle: false, exam: data.exam, minutes: data.minutes, deadline: data.deadline });
    s.index = Math.min(data.index || 0, Math.max(0, qs.length - 1));
    s.graded = !!data.graded;
    for (const [qid, ua] of (data.examAnswers || [])) s.examAnswers.set(qid, ua);
    for (const [qid, v] of (data.answered || [])) {
      const q = qs.find(x => x.id === qid);
      if (q) s.answered.set(qid, { userAnswer: v.userAnswer, correct: v.correct, q, answer: q.answer, explanation: q.explanation });
    }
    return s;
  }
}

/* ---- 构建会话的辅助 ---- */
const QuizBuilder = {
  /** 从多个题库构建：filterType 筛题型；secKeys 筛章节（"bankId:secIdx"，空 = 全部章节） */
  async fromBanks(bankIds, { shuffle = false, filterType = 'all', secKeys = null, exam = false, minutes = 0 } = {}) {
    let qs = [];
    for (const id of bankIds) {
      const list = await DB.questionsByBank(id);
      qs.push(...list);
    }
    if (secKeys && secKeys.size) {
      qs = qs.filter(q => secKeys.has(q.bankId + ':' + (q.secIdx ?? '')));
    }
    if (filterType !== 'all') {
      // 支持组合："choice|answered" / "fill|answered" / "answered"

      if (parts.includes('answered')) qs = qs.filter(q => q.answer);
      if (parts.includes('choice')) qs = qs.filter(q => q.type === 'single' || q.type === 'multi' || q.type === 'judge');
      else if (parts.includes('fill')) qs = qs.filter(q => q.type === 'fill');
    }
    return new QuizSession(qs, { shuffle, exam, minutes });
  },

  /** 错题重做 */
  async wrongRedo() {
    const qs = await DB.wrongQuestions();
    return new QuizSession(qs, { shuffle: true, mode: 'wrong' });
  },

  /** 从指定题单重练（考试交卷后的错题重做等） */
  fromQuestions(questions, opts = {}) {
    return new QuizSession(questions, opts);
  }
};

    const bridge = typeof window !== 'undefined' && window.AndroidBridge;
    const isApk = bridge && typeof bridge.isAvailable === 'function' && bridge.isAvailable();
    if (isApk) {

      const res = ('' + (bridge.saveFile(fileName, b64) || '')).trim();
      if (res.startsWith('OK:')) return { path: res.slice(3) };
      if (res.startsWith('NEED_PERMISSION:')) throw new Error(res.slice(16) + '（授予后再点一次）');

    document.getElementById('canon-tpl-dl').onclick = async () => {
      try {
        const r = await saveTextFile('刷题宝-范式模板.txt', Canon.template());
        toast('模板已保存：' + r.path);
      } catch (e) { toast('保存失败：' + e.message.slice(0, 60)); }
    };
    document.getElementById('canon-clear').onclick = () => {
      ta.value = '';
      invalidate();
      fileStatus.textContent = '';
      importStatus.textContent = '';
    };

    // 载入文件（.txt/.md/.docx/.pdf）：统一走转换器——
    // 已经是范式 → 原样保留；老格式文档 → 自动转成范式（避免把原始 Word 直接当范式解析出乱码）
    const fileInput = document.getElementById('canon-file');
    document.getElementById('canon-pick').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const f = fileInput.files[0];
      fileInput.value = '';
      if (!f) return;
      fileStatus.textContent = `载入 ${f.name}…`;
      try {
        const raw = await readAnyText(f);
        const res = Canon.convert(raw);
        ta.value = res.text;
        invalidate();
        const s = res.stats;
        fileStatus.textContent = res.passthrough
          ? `✓ ${f.name} 已是范式格式，原样载入 · ${s.total} 题 · 答案 ${s.answered} · 解析 ${s.explained || 0} · 章节 ${s.sections || 0}`
          : `✓ 已载入并自动转换：${f.name} · ${s.total} 题 · 答案 ${s.answered} · 解析 ${s.explained || 0} · 章节 ${s.sections || 0} · 缺答案 ${s.missing}`;
        runCheck();
      } catch (e) {
        fileStatus.textContent = '⚠ ' + e.message.slice(0, 100);
      }
    };

    // Word 转换器：旧格式文档（题目+答案表 / 内联答案）→ 范式文本
    const oldInput = document.getElementById('canon-old');
    document.getElementById('canon-conv').onclick = () => oldInput.click();
    oldInput.onchange = async () => {
      const f = oldInput.files[0];
      oldInput.value = '';
      if (!f) return;
      fileStatus.textContent = `转换 ${f.name}…`;
      try {
        const raw = await readAnyText(f);
        const res = Canon.convert(raw);
        ta.value = res.text;
        invalidate();
        const s = res.stats;
        fileStatus.textContent = res.passthrough
          ? `✓ ${f.name} 已是范式格式，原样保留 · ${s.total} 题 · 答案 ${s.answered} · 解析 ${s.explained || 0} · 章节 ${s.sections || 0}`
          : `✓ 转换完成：${f.name} · ${s.total} 题 · 答案 ${s.answered} · 解析 ${s.explained || 0} · 章节 ${s.sections || 0}${s.filled ? `（答案表匹配 ${s.filled}）` : ''} · 缺答案 ${s.missing}`
            + (res.problems?.length ? `；⚠ ${res.problems.slice(0, 3).map(p => `第${p.sec}节${p.dupNos.length ? '重号' + p.dupNos.join('、') : ''}${p.missingNos.length ? '缺号' + p.missingNos.slice(0, 8).join('、') : ''}`).join('；')}` : '');
        runCheck();
      } catch (e) {
        fileStatus.textContent = '⚠ ' + e.message.slice(0, 120);
      }
    };

    document.getElementById('canon-check').onclick = () => runCheck();

    /* ---- 解析预览 ---- */
    function runCheck() {
      const text = ta.value;
      if (text.replace(/\s/g, '').length < 5) { toast('请先贴入范式文本'); return null; }
      const r = Canon.parse(text);
      canonParsed = r;
      const s = r.stats;
      const typeStr = Object.keys(s.byType).filter(k => s.byType[k])
        .map(k => `${Canon.TYPE_LABEL[k]} ${s.byType[k]}`).join(' · ');
      reportCard.style.display = '';
      reportBody.innerHTML = `
        <div class="canon-stats">
          <div class="canon-stat"><b>${s.total}</b><span>题目</span></div>
          <div class="canon-stat"><b style="color:var(--ok)">${s.answered}</b><span>有答案</span></div>
          <div class="canon-stat"><b style="color:${s.explained ? 'var(--ok)' : 'var(--muted, #888)'}">${s.explained || 0}</b><span>带解析</span></div>
          <div class="canon-stat"><b style="color:${s.missing ? 'var(--bad)' : 'var(--ok)'}">${s.missing}</b><span>缺答案</span></div>
          <div class="canon-stat"><b style="color:${s.errors ? 'var(--bad)' : 'var(--ok)'}">${s.errors}</b><span>格式错误</span></div>
        </div>
        <div class="muted small">${typeStr || '—'}${s.sections ? ` · ${s.sections} 个章节` : ''}</div>
        ${r.errors.length ? `<div class="canon-issues">
          <div class="canon-issue-title bad">⚠ ${r.errors.length} 处格式错误（这些题不会被导入）</div>
          ${r.errors.slice(0, 30).map(e => `<div class="canon-issue"><span class="ln">第${e.line}行</span>${escapeHtml(e.msg)}</div>`).join('')}
          ${r.errors.length > 30 ? '<div class="muted small">…仅显示前 30 条</div>' : ''}
        </div>` : ''}
        ${r.warns.length ? `<div class="canon-issues">
          <div class="canon-issue-title">提示 ${r.warns.length} 处（不影响导入）</div>
          ${r.warns.slice(0, 20).map(e => `<div class="canon-issue"><span class="ln">第${e.line}行</span>${escapeHtml(e.msg)}</div>`).join('')}
          ${r.warns.length > 20 ? '<div class="muted small">…仅显示前 20 条</div>' : ''}
        </div>` : ''}`;

      const noAns = r.questions.filter(q => !q.answer);
      if (noAns.length) {
        aiCard.style.display = '';
        aiBtn.disabled = false;
        aiBtn.textContent = `AI 解答缺答案的 ${noAns.length} 题`;
        aiStatus.textContent = '也可以直接在文本框里补「答案：」，再点「解析预览」';
      } else {
        aiCard.style.display = 'none';
      }
      return r;
    }

    /* ---- AI 解题：补缺答案，写回文本框 ---- */
    aiBtn.onclick = async () => {
      const r = canonParsed || runCheck();
      if (!r) return;
      const noAns = r.questions.filter(q => !q.answer);
      if (!noAns.length) return toast('没有缺答案的题了');
      const cfg = await LLM.getConfig();
      if (!cfg.apiKey) { toast('请先到「设置」配置 API Key'); return navigate('#/settings'); }
      aiBtn.disabled = true;
      aiStatus.textContent = 'AI 解题中…（自适应批量、进度实时反馈）';
      try {
        const solved = await LLM.solveQuestions(noAns, (done, total, got, note) => {
          if (total <= 0) { if (note) aiStatus.textContent = note; return; }
          aiStatus.textContent = `${note ? note + ' · ' : ''}AI 解题中：${done}/${total} 批 · 已得 ${got} 个答案`;
        }, (c, a, cool) => {
          aiStatus.textContent = cool > 0 ? `⏳ API 限流，冷却 ${cool}s 后重试` : '网络波动，重试中…';
        });
        // 答案写回文本框（AI 答案仅供练习参考，可人工核对后再导入）
        const left = r.questions.filter(q => !q.answer).length;
        ta.value = Canon.fromQuestions(r.questions, r.sections);
        const re = runCheck();
        aiStatus.textContent = `✓ AI 补了 ${solved} 个答案，已写回文本框（可人工核对）`
          + (left ? `；剩 ${left} 题未解出` : '')
          + (re?.stats.errors ? `；⚠ 文本有 ${re.stats.errors} 处格式错误` : '');
        toast(`AI 补了 ${solved} 个答案`);
      } catch (e) {
        aiStatus.textContent = '⚠ ' + e.message.slice(0, 120);
        aiBtn.disabled = false;
      }
    };

    /* ---- 导入题库 ---- */
    document.getElementById('canon-import').onclick = async () => {
      const r = canonParsed || runCheck();
      if (!r) return;
      if (!r.stats.total) {
        importStatus.textContent = '⚠ 没有解析到任何题目，请对照「格式说明」检查（题目要有题干行，选择题要有 A./B. 选项行）';
        return;
      }
      if (!confirmDialog(`导入 ${r.stats.total} 题到新题库？${r.stats.missing ? `\n其中 ${r.stats.missing} 题缺答案，导入后可在题库列表「补答案」。` : ''}`)) return;
      const name = (document.getElementById('canon-name').value.trim()
        || `范式导入 ${new Date().toLocaleDateString()}`).slice(0, 40);
      const bank = {
        id: DB.uid(),
        name,
        createdAt: Date.now(),
        count: r.questions.length,
        source: '范式导入',
        sections: r.sections && r.sections.length ? r.sections : null
      };
      const qs = r.questions.map(q => {
        const o = { ...q, id: DB.uid(), bankId: bank.id };
        delete o._srcLine;
        return o;
      });
      await DB.questionAddMany(qs);
      await DB.bankAdd(bank);
      const noAns = qs.filter(q => !q.answer).length;
      importStatus.textContent = `✓ 已导入「${name}」共 ${qs.length} 题${noAns ? `（${noAns} 题缺答案）` : ''}`;
      toast(`已导入 ${qs.length} 题`);
      navigate('#/home');
    };
  }
