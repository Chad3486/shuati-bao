plugins {
    id 'com.android.application'
}
android {
    namespace 'com.shuati.bao'
    compileSdk 34
    defaultConfig {
        applicationId "com.shuati.bao"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.1.2"
    }
    // 固定 debug 签名：把 debug.keystore 提交到仓库，
    // GitHub Actions 不同次构建都用同一个 keystore 签名，
    // 用户从此可以稳定覆盖升级，不再出现"签名冲突不能覆盖"错误
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
