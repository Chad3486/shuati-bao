plugins {
    id 'com.android.application'
}
android {
    namespace 'com.shuati.bao'
    compileSdk 34
    defaultConfig {
        applicationId "com.shuati.bao"
        minSdk 21
        targetSdk 34
        // 版本号唯一来源：打 tag 发版时由 CI 按 tag 注入 VERSION_NAME / VERSION_CODE；
        // 推 main、手动触发、本地直接 gradle 构建时退回下面的 fallback。
        // 发版流程：只改这两行 fallback + 同名 tag，不再手改 versionCode。
        // 先算局部变量再传，避免 Groovy 命令表达式歧义（Value is null）。
        def fallbackName = '1.8.23'
        def fallbackCode = 108023
        def envVerName = System.getenv('VERSION_NAME')
        def envVerCode = System.getenv('VERSION_CODE')
        versionCode((envVerCode ? envVerCode.toInteger() : fallbackCode))
        versionName(envVerName ? envVerName : fallbackName)
    }
    // 固定 debug 签名：把 debug.keystore 提交到仓库，
    // GitHub Actions 不同次构建都用同一个 keystore 签名，
    // 用户从此可以稳定覆盖升级，不再出现"签名冲突不能覆盖"错误
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            // 沿用仓库里这把固定的 debug keystore 签名（见上面 signingConfigs 注释）：
            // 用户从历史的 debug 包升级过来签名不变，可以直接覆盖安装，不用卸载重装。
            // 真要换 release keystore，会让所有老用户签名冲突，必须配一次「请卸载重装」的公告。
            signingConfig signingConfigs.debug
            // 显式关掉可调试：debug 变体 debuggable=true，同机开 USB 调试后
            // 能被 adb run-as 直接读走 WebView 里的 IndexedDB（题库、练习记录）。
            debuggable false
            minifyEnabled false
        }
    }
}
dependencies {
}
