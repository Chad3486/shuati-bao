plugins {
    id 'com.android.application'
}
android {
    namespace 'com.shuati.bao'
    compileSdk 34
    defaultConfig {
        applicationId "com.shuati.bao"
        minSdk 21
        targetSdk 34
        // 版本号唯一来源：CI 从 tag 注入 VERSION_NAME / VERSION_CODE（见 .github/workflows/build-apk.yml），
        // 本地直接 gradle 构建时退回下面的默认值。先算好局部变量再传，避免 Groovy 命令表达式歧义。
        def envVerName = System.getenv('VERSION_NAME')
        def envVerCode = System.getenv('VERSION_CODE')
        def finalVerName = envVerName ? envVerName : '1.8.17'
        def finalVerCode = (envVerCode ? envVerCode : '108017').toInteger()
        versionCode finalVerCode
        versionName finalVerName
    }
    // 固定 debug 签名：把 debug.keystore 提交到仓库，
    // GitHub Actions 不同次构建都用同一个 keystore 签名，
    // 用户从此可以稳定覆盖升级，不再出现"签名冲突不能覆盖"错误
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
}
