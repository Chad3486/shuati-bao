name: Build ShuatiBao APK

# 触发规则（v1.8.18 整改后）：
#   1) push main / 手动触发  -> 只构建校验；仅手动触发时上传 Artifact（供下载安装）
#   2) push tag v*           -> 构建 + 硬校验 + 发 Release
#
# 为什么不再用 paths: 过滤 —— paths 对 tag 推送同样生效。
# 打 tag 的提交若只改了 README/scripts/dist 就会被跳过，
# 结果就是「tag 有了、Release 却没有」（旧版就丢过包）。宁可多跑一次构建。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史做「tag 是否在 main 上」校验

      # 防误发：任意分支打个 v* 就能发正式版的历史到此为止
      - name: Guard tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} 不在 main 上，拒绝发版"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} 在 main 上，继续"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 版本号唯一来源 = tag。发版只靠 tag，不再手改 versionCode/versionName。
      # versionCode = 主*10000 + 次*100 + 修订（次/修订必须 <= 99，否则会进位碰撞）
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(grep -oE "fallbackName = '[0-9.]+'" apk-src/app/build.gradle | grep -oE "[0-9]+[.][0-9]+[.][0-9]+" | head -1)
          fi
          if ! echo "$V" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::版本号格式不合法: $V"; exit 1
          fi
          MAJ=${V%%.*}
          REST=${V#*.}
          MIN=${REST%%.*}
          PAT=${REST#*.}
          if [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::次版本号/修订号必须 <= 99（当前 $MIN/$PAT），否则 versionCode 会与其它版本碰撞"
            exit 1
          fi
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "版本号 $V (versionCode $CODE)"

      # 用同一份版本号重建单文件版，保证 App 内显示的版本号与 APK 一致
      # （历史上出现过 versionName 写 1.8.17、内嵌 app.html 实为 1.8.16 的包）
      - name: Rebuild single-file bundle
        run: |
          node build-single.mjs
          if ! grep -q "const VERSION = '${VERSION_NAME}';" apk-src/app/src/main/assets/app.html; then
            echo "::error::内嵌 app.html 版本号与 ${VERSION_NAME} 不一致，中止"
            exit 1
          fi

      - name: Assemble Debug APK
        run: gradle -p apk-src :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp apk-src/app/build/outputs/apk/debug/app-debug.apk "shuati-bao-v${VERSION_NAME}.apk"

      # 卡住「versionName 与内嵌 app.html 版本不一致」这种坏包（见 scripts/verify-apk.py 注释）
      - name: Verify APK version consistency
        run: python3 scripts/verify-apk.py

      # 只在「打 tag 发版」或「手动触发下载」时上传，避免每次推 main 都堆一个 Artifact
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: shuati-bao-apk
          path: shuati-bao-v*.apk
          retention-days: 30

      # ---- 以下仅打 tag 时执行 ----
      # Release 说明自动取 README「更新日志」表格里对应 tag 的那一行
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          SUMMARY=$(awk -v tag="$TAG" '
            substr($0,1,1)=="|" {
              n=split($0, a, "|")
              if (n < 3) next
              k=a[2]; gsub(/^[ \t]+|[ \t]+$/, "", k)
              if (k == tag) { v=a[3]; gsub(/^[ \t]+|[ \t]+$/, "", v); print v; exit }
            }' README.md)
          if [ -n "$SUMMARY" ]; then
            { echo "发布 $TAG"; echo; echo "$SUMMARY"; } > release_notes.md
          else
            { echo "发布 $TAG"; echo; echo "（README 更新日志里没找到 $TAG 这一行，请补上）"; } > release_notes.md
          fi
          echo "=== release_notes.md ==="; cat release_notes.md

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shuati-bao-v*.apk
          body_path: release_notes.md
