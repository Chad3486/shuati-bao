name: Build ShuatiBao APK

on:
  workflow_dispatch: # 手动触发：Actions → 选此 workflow → Run workflow
  push:
    branches: [ main ]
    paths: [ 'apk-src/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Assemble Debug APK
        run: gradle -p apk-src :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp apk-src/app/build/outputs/apk/debug/app-debug.apk 刷题宝.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shuati-bao-apk
          path: 刷题宝.apk
