<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1652f0">
  <title>刷题宝</title>
  <script>
    /* 首屏提前应用主题/配色，避免加载瞬间闪白（值由 app.js 写入 localStorage） */
    try {
      var t = JSON.parse(localStorage.getItem('sb_theme') || '{}');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t.theme === 'dark' || (t.theme !== 'light' && sysDark)) document.documentElement.classList.add('dark');
      if (t.skin) document.documentElement.setAttribute('data-skin', t.skin);
    } catch (e) { /* 忽略 */ }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>
  <script src="libs/pdf.min.js"></script>
  <script src="libs/mammoth.browser.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
